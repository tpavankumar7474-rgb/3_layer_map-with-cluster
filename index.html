                "Khobar"

            );


        /* =================================================
           LAYER TREE
           ================================================= */

        const overlaysTree = {

            label:
                "Map Layers",

            selectAllCheckbox:
                false,

            children: [

                {

                    label:
                        "Dammam",

                    selectAllCheckbox:
                        true,

                    children: [

                        {

                            label:
                                "Boundary",

                            layer:
                                municipalityBoundaryLayers[
                                    "Dammam"
                                ]

                        },

                        {

                            label:
                                "Districts",

                            selectAllCheckbox:
                                true,

                            children:
                                dammamDistricts

                        }

                    ]

                },


                {

                    label:
                        "Dhahran",

                    selectAllCheckbox:
                        true,

                    children: [

                        {

                            label:
                                "Boundary",

                            layer:
                                municipalityBoundaryLayers[
                                    "Dhahran"
                                ]

                        },

                        {

                            label:
                                "Districts",

                            selectAllCheckbox:
                                true,

                            children:
                                dhahranDistricts

                        }

                    ]

                },


                {

                    label:
                        "Khobar",

                    selectAllCheckbox:
                        true,

                    children: [

                        {

                            label:
                                "Boundary",

                            layer:
                                municipalityBoundaryLayers[
                                    "Khobar"
                                ]

                        },

                        {

                            label:
                                "Districts",

                            selectAllCheckbox:
                                true,

                            children:
                                khobarDistricts

                        }

                    ]

                }

            ]

        };


        /* =================================================
           LAYER CONTROL
           ================================================= */

        if (

            typeof
            L.control.layers.tree ===
            "function"

        ) {

            L.control.layers.tree(

                {

                    "OpenStreetMap":
                        osm

                },

                overlaysTree,

                {

                    collapsed:
                        false,

                    namedToggle:
                        true,

                    selectorBack:
                        false,

                    closedSymbol:
                        "▶",

                    openedSymbol:
                        "▼"

                }

            ).addTo(
                map
            );


            collapseLayerTreeGroups();

        }

        else {

            console.warn(
                "Layer Tree library not loaded."
            );


            const fallbackOverlays = {};


            if (
                municipalityBoundaryLayers.Dammam
            ) {

                fallbackOverlays[
                    "Dammam Boundary"
                ] =
                    municipalityBoundaryLayers.Dammam;

            }


            if (
                municipalityBoundaryLayers.Dhahran
            ) {

                fallbackOverlays[
                    "Dhahran Boundary"
                ] =
                    municipalityBoundaryLayers.Dhahran;

            }


            if (
                municipalityBoundaryLayers.Khobar
            ) {

                fallbackOverlays[
                    "Khobar Boundary"
                ] =
                    municipalityBoundaryLayers.Khobar;

            }


            L.control.layers(

                {

                    "OpenStreetMap":
                        osm

                },

                fallbackOverlays,

                {

                    collapsed:
                        false

                }

            ).addTo(
                map
            );

        }


        /* =================================================
           DEFAULT MUNICIPALITY BOUNDARIES
           ================================================= */

        const defaultBoundaryLayers = [

            municipalityBoundaryLayers.Dammam,

            municipalityBoundaryLayers.Dhahran,

            municipalityBoundaryLayers.Khobar

        ].filter(
            Boolean
        );


        defaultBoundaryLayers.forEach(

            layer => {

                if (
                    !map.hasLayer(
                        layer
                    )
                ) {

                    layer.addTo(
                        map
                    );

                }

            }

        );


        /* =================================================
           MAP EXTENT
           ================================================= */

        if (
            defaultBoundaryLayers.length
        ) {

            map.fitBounds(

                L.featureGroup(
                    defaultBoundaryLayers
                ).getBounds(),

                {

                    padding:
                        [20,20]

                }

            );

        }

        else {

            map.setView(

                [26.35,50.10],

                10

            );

        }


        /* =================================================
           MAP READY
           ================================================= */

        mapReady =
            true;


        /* =================================================
           APPLY PENDING DATA
           ================================================= */

        if (
            pendingIncidentData
        ) {

            applyIncidentData(
                pendingIncidentData
            );


            pendingIncidentData =
                null;

        }

        else {

            calculateMunicipalityRiskStats();

            showMunicipalityLevel();

        }


        /* =================================================
           SIZE FIX
           ================================================= */

        setTimeout(

            () => {

                map.invalidateSize();

            },

            200

        );


        setTimeout(

            () => {

                map.invalidateSize();

            },

            1000

        );


        /* =================================================
           INFORM PARENT
           ================================================= */

        window.parent.postMessage(

            {

                type:
                    "iframeReady"

            },

            "*"

        );

    }

);


/* =====================================================
   ERROR SAFETY
   ===================================================== */

window.addEventListener(

    "error",

    function(event) {

        console.error(

            "Map error:",

            event.error ||
            event.message

        );

    }

);


/* =====================================================
   GRAFANA DATA MESSAGE
   ===================================================== */

window.addEventListener(

    "message",

    function(event) {

        if (

            event.data?.type !==
            "incidentData"

        ) {

            return;

        }


        const rows =
            event.data.data || [];


        console.log(

            "Received incident data:",
            rows

        );


        if (!mapReady) {

            pendingIncidentData =
                rows;

            return;

        }


        applyIncidentData(
            rows
        );

    }

);


/* =====================================================
   RESIZE OBSERVER
   ===================================================== */

if (
    typeof ResizeObserver !==
    "undefined"
) {

    const resizeObserver =
        new ResizeObserver(

            function() {

                setTimeout(

                    () => {

                        map.invalidateSize();

                    },

                    50

                );

            }

        );


    resizeObserver.observe(

        document.getElementById(
            "map"
        )

    );

}


/* =====================================================
   FINAL SIZE FIX
   ===================================================== */

setTimeout(

    function() {

        map.invalidateSize();

    },

    300

);

</script>
