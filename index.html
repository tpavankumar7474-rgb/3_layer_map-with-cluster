<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Municipality Incident Gradient Heat Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.control.layers.tree@1.1.0/L.Control.Layers.Tree.css">
<style>
html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:#061018;font-family:Arial,sans-serif}
.leaflet-control-layers{max-height:85vh;overflow:auto;font-size:13px}
.title{position:absolute;z-index:2000;left:18px;top:14px;background:rgba(3,12,18,.90);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:12px 18px;box-shadow:0 4px 18px rgba(0,0,0,.35);font-size:22px;font-weight:800}
.title .level{display:block;color:#39ff14;font-size:14px;margin-bottom:5px}
.back{background:rgba(3,12,18,.92);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:9px;padding:11px 17px;font-size:16px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.35)}
.back:hover{background:#111827}
.info{position:absolute;z-index:2000;left:18px;bottom:18px;background:rgba(3,12,18,.90);color:#fff;border:1px solid rgba(255,255,255,.30);border-radius:9px;padding:10px 15px;font-size:14px}
.legend{position:absolute;z-index:2000;right:18px;bottom:18px;background:rgba(3,12,18,.92);color:#fff;border:1px solid rgba(255,255,255,.30);border-radius:10px;padding:14px 17px;min-width:205px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.legend h3{margin:0 0 10px;font-size:17px}.legend-row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}.sw{width:19px;height:19px;border-radius:3px;border:1px solid rgba(255,255,255,.25)}
.number-label{background:transparent!important;border:0!important;box-shadow:none!important;pointer-events:none}
.number-label div{color:#fff;font-size:18px;font-weight:900;text-shadow:0 2px 4px #000,0 0 5px #000,1px 0 2px #000,-1px 0 2px #000;white-space:nowrap;text-align:center}
.number-label.small div{font-size:14px}
.custom-tooltip{font-size:13px;font-weight:700}
.error{position:absolute;z-index:3000;left:50%;top:50%;transform:translate(-50%,-50%);max-width:650px;background:rgba(80,0,0,.94);color:#fff;padding:20px;border-radius:12px;border:1px solid #fca5a5;display:none;font-family:monospace;white-space:pre-wrap}
</style>
</head>
<body>
<div id="map"></div>
<div class="title"><span class="level" id="levelText">LEVEL 1</span><span id="titleText">Municipalities Overview</span></div>
<div class="info" id="mapInfo">Click Dammam, Khobar or Dhahran to view Groups (Level 2)</div>
<div class="legend" id="legend"></div>
<div class="error" id="errorBox"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.control.layers.tree@1.1.0/L.Control.Layers.Tree.js"></script>
<script>
'use strict';

const CITIES=['Dammam','Khobar','Dhahran'];
const CITY_AR={Dammam:'الدمام',Khobar:'الخبر',Dhahran:'الظهران'};
const PALETTE={
 Dammam:{light:'#fca5a5',mid:'#ef4444',dark:'#991b1b'},
 Khobar:{light:'#fde68a',mid:'#facc15',dark:'#a16207'},
 Dhahran:{light:'#a7d88c',mid:'#4d9a3e',dark:'#087f3e'}
};
const RISK_PALETTE={
 High:{light:'#fca5a5',mid:'#ef4444',dark:'#991b1b'},
 Medium:{light:'#fde68a',mid:'#facc15',dark:'#a16207'},
 Low:{light:'#b7df9b',mid:'#4d9a3e',dark:'#087f3e'}
};

const map=L.map('map',{zoomControl:true,maxZoom:19,preferCanvas:false});
const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri World Imagery',maxZoom:19}).addTo(map);
const labels=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'OpenStreetMap',opacity:.28,maxZoom:19}).addTo(map);

const municipalityLayers={};
const municipalityFeatures={};
const districtData={Dammam:null,Khobar:null,Dhahran:null};
const districtLayers={Dammam:L.layerGroup(),Khobar:L.layerGroup(),Dhahran:L.layerGroup()};
const districtFeatures={Dammam:[],Khobar:[],Dhahran:[]};
const municipalityTotals={Dammam:0,Khobar:0,Dhahran:0};
const incidentRows={Dammam:[],Khobar:[],Dhahran:[]};
const districtCounts={};
const dynamicLayers=L.layerGroup().addTo(map);
const labelLayer=L.layerGroup().addTo(map);
let level=0,selectedCity=null,selectedGroup=null;
let groupData=[];
let mapReady=false;
let pendingRows=null;

function norm(v){return String(v??'').trim().replace(/\s+/g,' ').toLowerCase()}
function normAr(v){return norm(v).replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[\u064B-\u065F\u0670]/g,'')}
function propName(f){return String(f?.properties?.REMARKS??f?.properties?.NameEn??f?.properties?.NAME??f?.properties?.name??f?.properties?.NAME_EN??'').trim()}
function cityFromName(n){const x=normAr(n); if(x==='الدمام'||x==='dammam')return'Dammam'; if(x==='الخبر'||x==='khobar'||x==='al khobar'||x==='alkhobar')return'Khobar'; if(x==='الظهران'||x==='dhahran')return'Dhahran'; return null}
function num(v){const n=Number(String(v??0).replace(/,/g,''));return Number.isFinite(n)?n:0}
function fmt(v){return num(v).toLocaleString()}
function centroidFeatures(features){
 const ll=[]; features.forEach(f=>{const c=L.geoJSON(f).getBounds().getCenter(); if(Number.isFinite(c.lat)&&Number.isFinite(c.lng))ll.push(c)});
 if(!ll.length)return null; return [ll.reduce((a,b)=>a+b.lat,0)/ll.length,ll.reduce((a,b)=>a+b.lng,0)/ll.length];
}
function centerOfFeature(f){try{const b=L.geoJSON(f).getBounds();if(b.isValid())return b.getCenter()}catch(e){}return null}

// -------- gradients: radial, dark centre -> lighter outer edge --------
function colorToRgb(hex){hex=hex.replace('#','');return [parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)]}
function mix(a,b,t){const A=colorToRgb(a),B=colorToRgb(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function makeGradientColors(base,intensity){
 const light=base.light,mid=base.mid,dark=base.dark;
 const d=mix(light,dark,Math.max(.15,Math.min(1,intensity)));
 const m=mix(light,mid,Math.max(.20,Math.min(1,intensity+.12)));
 return {light,middle:m,dark:d};
}
function ensureGradient(layer,id,colors){
 const path=layer?.getLayers?.()[0]?._path; if(!path)return false;
 const svg=path.ownerSVGElement; if(!svg)return false;
 let defs=svg.querySelector('defs'); if(!defs){defs=document.createElementNS('http://www.w3.org/2000/svg','defs');svg.insertBefore(defs,svg.firstChild)}
 let g=defs.querySelector('#'+id); if(!g){g=document.createElementNS('http://www.w3.org/2000/svg','radialGradient');g.setAttribute('id',id);g.setAttribute('cx','50%');g.setAttribute('cy','45%');g.setAttribute('r','72%');g.setAttribute('fx','48%');g.setAttribute('fy','42%');defs.appendChild(g)}
 g.innerHTML='';[['0%',colors.dark],['38%',colors.middle],['72%',colors.light],['100%',colors.light]].forEach(([o,c])=>{const s=document.createElementNS('http://www.w3.org/2000/svg','stop');s.setAttribute('offset',o);s.setAttribute('stop-color',c);s.setAttribute('stop-opacity','.88');g.appendChild(s)});
 return true;
}
function applyGradient(layer,id,colors){if(ensureGradient(layer,id,colors)){layer.setStyle({fillColor:'url(#'+id+')',fillOpacity:1})}else{layer.setStyle({fillColor:colors.middle,fillOpacity:.72})}}

function clearDynamic(){dynamicLayers.clearLayers();labelLayer.clearLayers()}
function numberLabel(latlng,count,small=false){if(!latlng)return;const icon=L.divIcon({className:'number-label'+(small?' small':''),html:`<div>${fmt(count)}</div>`,iconSize:[100,30],iconAnchor:[50,15]});labelLayer.addLayer(L.marker(latlng,{icon,interactive:false,zIndexOffset:5000}))}

function riskStats(items){const vals=items.map(x=>num(x.count)).filter(x=>x>0);if(!vals.length)return{min:0,max:0,low:0,high:0};const min=Math.min(...vals),max=Math.max(...vals),r=max-min;return{min,max,low:min+r*.33,high:min+r*.66}}
function riskOf(v,s){v=num(v);if(!v)return{level:'Low',palette:RISK_PALETTE.Low};if(s.max===s.min)return{level:'High',palette:RISK_PALETTE.High};if(v>=s.high)return{level:'High',palette:RISK_PALETTE.High};if(v>=s.low)return{level:'Medium',palette:RISK_PALETTE.Medium};return{level:'Low',palette:RISK_PALETTE.Low}}
function intensity(v,s){if(!s.max)return .25;if(s.max===s.min)return 1;return .35+.65*(num(v)/s.max)}
function setTitle(l,t){document.getElementById('levelText').textContent='LEVEL '+(l+1);document.getElementById('titleText').textContent=t}
function updateLegend(mode='risk'){
 const el=document.getElementById('legend');
 el.innerHTML='<h3>Incidents (Count)</h3>';
 if(mode==='municipality'){
  CITIES.forEach(c=>el.innerHTML+=`<div class="legend-row"><span class="sw" style="background:${PALETTE[c].mid}"></span>${c} — ${CITY_AR[c]}</div>`);
  el.innerHTML+='<hr style="border:0;border-top:1px solid #334155"><div style="font-size:12px">Dark centre → higher count<br>Light edge → lower intensity</div>';
 }else{
  [['High',RISK_PALETTE.High],['Medium',RISK_PALETTE.Medium],['Low',RISK_PALETTE.Low]].forEach(([n,p])=>el.innerHTML+=`<div class="legend-row"><span class="sw" style="background:${p.dark}"></span>${n} — Top/Mid/Bottom 33%</div>`);
  el.innerHTML+='<hr style="border:0;border-top:1px solid #334155"><div style="font-size:12px">Each polygon uses a smooth radial gradient.<br>Dark centre = higher count.</div>';
 }
}

function municipalityStyle(city){return{color:'#fff',weight:2.5,opacity:.95,fillColor:PALETTE[city].mid,fillOpacity:.75}}
function districtBaseStyle(){return{color:'rgba(255,255,255,.75)',weight:1,opacity:.75,fillColor:'#64748b',fillOpacity:.15}}

function showMunicipalityOverview(){
 level=0;selectedCity=null;selectedGroup=null;groupData=[];clearDynamic();
 const items=CITIES.map(c=>({city:c,count:municipalityTotals[c]}));const s=riskStats(items);
 CITIES.forEach(c=>{
  const layer=municipalityLayers[c];if(!layer)return;
  const intensityValue=intensity(municipalityTotals[c],s);
  const colors=makeGradientColors(PALETTE[c],intensityValue);
  applyGradient(layer,'muni_grad_'+c.toLowerCase(),colors);
  layer.bringToFront();
  layer.off('click').on('click',()=>showMunicipality(c));
  const center=centerOfFeature(municipalityFeatures[c]?.[0]);
  numberLabel(center,municipalityTotals[c]);
 });
 const all=CITIES.map(c=>municipalityLayers[c]).filter(Boolean);if(all.length){const b=L.featureGroup(all).getBounds();if(b.isValid())map.fitBounds(b,{padding:[55,55],maxZoom:12})}
 setTitle(0,'Municipalities Overview');document.getElementById('mapInfo').innerHTML='Click Dammam, Khobar or Dhahran to view Groups (Level 2)';updateLegend('municipality');
}

function makeRowsFromFeatures(city){
 const feats=districtFeatures[city]||[];return feats.map((f,i)=>{const name=propName(f)||`${city} District ${i+1}`;const existing=lookupCount(name);const c=centerOfFeature(f);return{name,count:existing,lat:c?.lat,lng:c?.lng,feature:f,index:i,city}})
}
function lookupCount(name){const k=normAr(name);if(districtCounts[k]!==undefined)return num(districtCounts[k]);return 0}
function distributeThree(rows){
 if(rows.length<=3)return rows.map(x=>[x]);
 const c=rows.reduce((a,r)=>({lat:a.lat+r.lat,lng:a.lng+r.lng}),{lat:0,lng:0});c.lat/=rows.length;c.lng/=rows.length;
 const sorted=[...rows].sort((a,b)=>Math.atan2(a.lat-c.lat,a.lng-c.lng)-Math.atan2(b.lat-c.lat,b.lng-c.lng));
 const g=[[],[],[]];sorted.forEach((r,i)=>g[i%3].push(r));return g.filter(Boolean).filter(x=>x.length)
}
function groupClusters(rows){return distributeThree(rows).map((items,i)=>({index:i,items,count:items.reduce((a,r)=>a+num(r.count),0),center:centerRows(items)}))}
function centerRows(rows){if(!rows.length)return null;const valid=rows.filter(r=>Number.isFinite(r.lat)&&Number.isFinite(r.lng));if(!valid.length)return null;return{lat:valid.reduce((a,r)=>a+r.lat,0)/valid.length,lng:valid.reduce((a,r)=>a+r.lng,0)/valid.length}}

function renderGroupLevel(city,groups,sub=false){
 clearDynamic();const s=riskStats(groups);
 groups.forEach((g,i)=>{
  const risk=riskOf(g.count,s);const colors=makeGradientColors(risk.palette,intensity(g.count,s));
  const gl=L.layerGroup();
  g.items.forEach((r,j)=>{
   const l=L.geoJSON(r.feature,{style:{color:'transparent',weight:0,fillOpacity:.88,fillColor:risk.palette.mid}});
   gl.addLayer(l);l.on('click',()=>sub?showDistrictLevel(g,city):showSecondLevel(g,city));
   setTimeout(()=>applyGradient(l,`grp_${level}_${city}_${i}_${j}`.replace(/[^a-zA-Z0-9_]/g,''),colors),0);
  });
  gl.addTo(dynamicLayers);g._layer=gl;
  if(g.center)numberLabel([g.center.lat,g.center.lng],g.count);
 });
}

function showMunicipality(city){
 level=1;selectedCity=city;selectedGroup=null;
 // Keep actual municipality boundary visible, but hide other municipality fills visually.
 CITIES.forEach(c=>{if(municipalityLayers[c])municipalityLayers[c].setStyle({fillOpacity:c===city ? .18 : 0,opacity:c===city ? .8 : .15})});
 const rows=makeRowsFromFeatures(city);
 // If real incident rows have coordinates/names, use those values; otherwise polygon centers remain valid.
 const groups=groupClusters(rows);groupData=groups;
 renderGroupLevel(city,groups,false);
 const b=municipalityLayers[city]?.getBounds();if(b?.isValid())map.fitBounds(b,{padding:[45,45],maxZoom:13});
 setTitle(1,'Groups - '+city);document.getElementById('mapInfo').innerHTML=`<b>${city}</b> — Click a group to view districts (Level 3)`;updateLegend('risk');
}

function showSecondLevel(group,city){
 level=2;selectedGroup=group;clearDynamic();
 // This level directly shows the three sub-groups as geographic regions.
 const rows=group.items||[];const subs=groupClusters(rows);groupData=subs;renderGroupLevel(city,subs,true);
 const pts=rows.filter(r=>Number.isFinite(r.lat)&&Number.isFinite(r.lng)).map(r=>[r.lat,r.lng]);if(pts.length)map.fitBounds(L.latLngBounds(pts),{padding:[55,55],maxZoom:15});
 setTitle(2,'Sub-Groups - '+city+' / Group '+(group.index+1));document.getElementById('mapInfo').innerHTML=`<b>${city}</b> — Group ${group.index+1} — Click a sub-group to view districts`;
}

function showDistrictLevel(group,city){
 level=3;clearDynamic();
 const rows=group.items||[];const s=riskStats(rows);const fg=L.layerGroup();
 rows.forEach((r,i)=>{
  const risk=riskOf(r.count,s);const colors=makeGradientColors(risk.palette,intensity(r.count,s));
  const l=L.geoJSON(r.feature,{style:{color:'#fff',weight:1.1,opacity:.8,fillColor:risk.palette.mid,fillOpacity:.86}});
  l.bindTooltip(`<b>${escapeHtml(r.name)}</b><br>${fmt(r.count)} incidents`,{sticky:true,className:'custom-tooltip'});
  l.on('click',()=>window.parent.postMessage({type:'mapClick',state:r.name,municipality:city,lat:r.lat,long:r.lng},'*'));
  fg.addLayer(l);setTimeout(()=>applyGradient(l,`dist_${city}_${i}`.replace(/[^a-zA-Z0-9_]/g,''),colors),0);
  numberLabel([r.lat,r.lng],r.count,true);
 });
 fg.addTo(dynamicLayers);
 const pts=rows.filter(r=>Number.isFinite(r.lat)&&Number.isFinite(r.lng)).map(r=>[r.lat,r.lng]);if(pts.length)map.fitBounds(L.latLngBounds(pts),{padding:[55,55],maxZoom:16});
 setTitle(3,'Districts - '+city+' / Group '+(selectedGroup?.index+1??''));document.getElementById('mapInfo').innerHTML=`<b>${city}</b> — District incidents. Hover for tooltip; click district to send Grafana filter.`;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

const back=L.control({position:'topright'});back.onAdd=()=>{const d=L.DomUtil.create('div','back');d.textContent='← Back';L.DomEvent.disableClickPropagation(d);d.onclick=()=>{if(level===3&&selectedGroup){showSecondLevel(selectedGroup,selectedCity)}else if(level===2&&selectedCity){showMunicipality(selectedCity)}else if(level===1){showMunicipalityOverview()}};return d};back.addTo(map);
const reset=L.control({position:'topright'});reset.onAdd=()=>{const d=L.DomUtil.create('div','back');d.textContent='↻ Reset View';L.DomEvent.disableClickPropagation(d);d.onclick=()=>showMunicipalityOverview();return d};reset.addTo(map);

function addLayerTree(){
 const tree={label:'Map Layers',selectAllCheckbox:false,children:CITIES.map(c=>({label:c,selectAllCheckbox:true,children:[{label:'Municipality Boundary',layer:municipalityLayers[c]},{label:'Districts',selectAllCheckbox:true,children:districtFeatures[c].map(f=>({label:propName(f)||'District',layer:L.geoJSON(f,{style:districtBaseStyle()})}))}]}))};
 L.control.layers.tree({'Satellite / Google Earth Style':satellite,'Roads + Labels':labels},tree,{collapsed:false,namedToggle:true,closedSymbol:'▶',openedSymbol:'▼'}).addTo(map);
}

function loadJson(url){return fetch(url).then(r=>{if(!r.ok)throw new Error(url+' -> HTTP '+r.status);return r.json()})}
function loadAll(){
 Promise.all([loadJson('./municipality.geojson'),loadJson('./dammam.geojson'),loadJson('./dhahran.geojson'),loadJson('./khobar.geojson')]).then(([mun,dha,dh,kho])=>{
  const by={Dammam:[],Khobar:[],Dhahran:[]};
  (mun.features||[]).forEach(f=>{const c=cityFromName(propName(f));if(c)by[c].push(f)});
  CITIES.forEach(c=>{municipalityFeatures[c]=by[c];if(by[c].length){municipalityLayers[c]=L.geoJSON({type:'FeatureCollection',features:by[c]},{style:municipalityStyle(c)}).addTo(map);municipalityLayers[c].bindTooltip(()=>`${c}<br>${fmt(municipalityTotals[c])} incidents`,{sticky:true})}});
  districtData.Dammam=dha;districtData.Dhahran=dh;districtData.Khobar=kho;
  districtFeatures.Dammam=dha.features||[];districtFeatures.Dhahran=dh.features||[];districtFeatures.Khobar=kho.features||[];
  CITIES.forEach(c=>(districtFeatures[c]||[]).forEach(f=>districtLayers[c].addLayer(L.geoJSON(f,{style:districtBaseStyle()}))));
  addLayerTree();mapReady=true;
  if(pendingRows){applyIncidentData(pendingRows);pendingRows=null}else{applyDummyData();}
 }).catch(err=>{console.error(err);document.getElementById('errorBox').style.display='block';document.getElementById('errorBox').textContent='GeoJSON could not be loaded.\n\n'+err.message+'\n\nRun this HTML from a local web server (not file://) and keep these files beside it:\nmunicipality.geojson\ndammam.geojson\ndhahran.geojson\nkhobar.geojson';});
}

function applyIncidentData(rows){
 Object.keys(districtCounts).forEach(k=>delete districtCounts[k]);CITIES.forEach(c=>{municipalityTotals[c]=0;incidentRows[c]=[]});
 (rows||[]).forEach(r=>{const name=String(r.state??r.district??r.name??'').trim();const count=num(r.count??r.Incidents??r.incidents);let lat=Number(r.lat),lng=Number(r.long??r.lng);if(!name)return;let city=cityFromName(r.municipality??r.city??'')||cityForDistrict(name);if(!city)return;municipalityTotals[city]+=count;districtCounts[normAr(name)]=count;incidentRows[city].push({name,count,lat,lng,city})});
 // Match incoming district coordinates/counts to actual GeoJSON features.
 CITIES.forEach(c=>{districtFeatures[c].forEach(f=>{const n=propName(f);const row=incidentRows[c].find(x=>normAr(x.name)===normAr(n));if(row){const p=centerOfFeature(f);row.lat=Number.isFinite(row.lat)?row.lat:p?.lat;row.lng=Number.isFinite(row.lng)?row.lng:p?.lng}})});
 showMunicipalityOverview();
}
function cityForDistrict(name){const k=normAr(name);for(const c of CITIES){if(districtFeatures[c].some(f=>normAr(propName(f))===k))return c}return null}
function applyDummyData(){
 // Dummy values are only for testing the 3-level behaviour. Replace with Grafana incidentData later.
 const dvals=[12000,8500,6200,5400,4800,4100,3700,3300,2900,2500,2200,1900,1700,1500,1300,1100,950,800,700,600,500,420,350,300];
 let ix=0;
 CITIES.forEach((c,ci)=>{
  districtFeatures[c].forEach((f,i)=>{const n=propName(f)||`${c} District ${i+1}`;const v=dvals[(ix++)%dvals.length]+ci*350;districtCounts[normAr(n)]=v});
  municipalityTotals[c]=(ci===0?85420:ci===1?68230:42180);
 });
 // Ensure municipality totals are the requested dummy totals, while district values drive Groups.
 showMunicipalityOverview();
}

window.addEventListener('message',e=>{if(e.data?.type==='incidentData'){if(mapReady)applyIncidentData(e.data.data||[]);else pendingRows=e.data.data||[]}});
loadAll();
</script>
</body>
</html>
