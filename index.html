<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Municipality Incident Heat Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html,body,#map{height:100%;margin:0;font-family:Arial,sans-serif} #map{background:#dcecf3}
    .panel,.legend{background:rgba(255,255,255,.94);padding:9px 12px;border-radius:8px;box-shadow:0 2px 9px #0004;border:1px solid #475569}
    #title{position:absolute;z-index:1000;top:10px;left:50%;transform:translateX(-50%);font-weight:700;text-align:center}.small{font-size:12px;font-weight:400;margin-top:3px}
    #back{display:none;position:absolute;z-index:1000;top:10px;left:10px;border:1px solid #334155;border-radius:7px;background:white;padding:8px 11px;font-weight:700;cursor:pointer}
    #filters{position:absolute;z-index:1000;right:10px;top:10px;width:185px;max-height:310px;overflow:auto;font-size:12px}.filter-title{font-weight:700;margin-bottom:6px}.filter-row{display:block;padding:3px 0;cursor:pointer}.filter-row input{vertical-align:middle;margin-right:6px}
    #total-incidents{position:absolute;z-index:1000;bottom:0;left:0;right:0;padding:6px 14px;background:rgba(15,23,42,.88);color:#fff;text-align:center;font-size:14px;font-weight:700;letter-spacing:.1px;pointer-events:none}
    .legend{line-height:22px;font-size:12px}.dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:middle}.tip{font-weight:600}
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="title" class="panel">Municipality Incident Heat Map<div id="status" class="small">Loading boundaries…</div></div>
  <button id="back">← Municipalities</button>
  <div id="filters" class="panel"></div>
  <div id="total-incidents">Total Incidents: 0</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
  <script>
  /* Put these four GeoJSON files in the SAME folder as this HTML. */
  const FILES={municipalities:'./municipality.geojson',Dammam:'./dammam.geojson',Dhahran:'./dhahran.geojson',Khobar:'./khobar.geojson'};
  const CITIES=['Dammam','Dhahran','Khobar'];
  const AREA_COUNT=3;
  const COLORS={low:'#22a447',medium:'#f4c430',high:'#df3030'};
  const map=L.map('map').setView([26.4,50.1],10);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors © CARTO'}).addTo(map);
  const boundary={}, districts={}, totals={}, rowsByCity={}; let view='municipalities', selectedCity=null, selectedArea=null, heatLayers=[], areaLayers=[], districtLayers=[], districtDisplay=[];
  const selectedCities=new Set(CITIES), selectedDistricts=new Set();
  const status=document.querySelector('#status'), back=document.querySelector('#back'), filters=document.querySelector('#filters'), totalLabel=document.querySelector('#total-incidents');
  function number(x){x=Number(x);return Number.isFinite(x)?x:0}
  function clean(x){return String(x??'').trim().toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ')}
  function nameOf(f){return f.properties?.REMARKS||f.properties?.NameEn||f.properties?.NAME||f.properties?.name||''}
  function districtName(f){return f.properties?.NAME||f.properties?.NameEn||f.properties?.name||f.properties?.REMARKS||''}
  function cityForName(name){const n=clean(name);if(['dammam','الدمام'].includes(n))return'Dammam';if(['dhahran','الظهران'].includes(n))return'Dhahran';if(['khobar','al khobar','الخبر'].includes(n))return'Khobar';return null}
  function risk(value,values){const a=values.filter(x=>x>0).sort((x,y)=>x-y);if(!a.length||value<=0)return'low';const q1=a[Math.floor((a.length-1)/3)],q2=a[Math.floor(2*(a.length-1)/3)];return value>q2?'high':value>q1?'medium':'low'}
  function clear(list){list.forEach(x=>map.removeLayer(x));list.length=0}
  function setBack(label){back.style.display=view==='municipalities'?'none':'block';back.textContent=label}
  function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function renderFilters(){
    if(view==='municipalities'){
      filters.innerHTML='<div class="filter-title">Municipalities</div>'+CITIES.map(c=>'<label class="filter-row"><input type="checkbox" value="'+c+'" '+(selectedCities.has(c)?'checked':'')+'> '+c+'</label>').join('');
      filters.querySelectorAll('input').forEach(x=>x.onchange=()=>{x.checked?selectedCities.add(x.value):selectedCities.delete(x.value);overview()});
    } else if(view==='districts') {
      filters.innerHTML='<div class="filter-title">Districts — Area '+(selectedArea+1)+'</div>'+districtDisplay.map(d=>'<label class="filter-row"><input type="checkbox" value="'+escapeHtml(d.name)+'" '+(selectedDistricts.has(d.name)?'checked':'')+'> '+escapeHtml(d.name)+'</label>').join('');
      filters.querySelectorAll('input').forEach(x=>x.onchange=()=>{const d=districtDisplay.find(v=>v.name===x.value);if(!d)return;x.checked?(selectedDistricts.add(d.name),d.layer.addTo(map)):(selectedDistricts.delete(d.name),map.removeLayer(d.layer))});
    } else filters.innerHTML='<div class="filter-title">Municipality: '+selectedCity+'</div><div class="small">Select an area on the map to filter districts.</div>';
  }
  function allBounds(){return L.featureGroup(Object.values(boundary)).getBounds()}
  function heat(city,features,rows,opacity=.3){
    const good=rows.filter(r=>Number.isFinite(r.lat)&&Number.isFinite(r.lng)&&r.count>0);if(!good.length||!features.length)return;
    const box=turf.bbox(turf.featureCollection(features)),W=320,H=320,canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d'),lngSpan=Math.max(box[2]-box[0],.0001),latSpan=Math.max(box[3]-box[1],.0001),max=Math.max(...good.map(r=>r.count));
    good.forEach(r=>{const x=(r.lng-box[0])/lngSpan*W,y=(box[3]-r.lat)/latSpan*H,rad=18+38*Math.sqrt(r.count/max),g=ctx.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,'rgba(220,38,38,.75)');g.addColorStop(.35,'rgba(245,158,11,.45)');g.addColorStop(.7,'rgba(250,204,21,.14)');g.addColorStop(1,'rgba(250,204,21,0)');ctx.fillStyle=g;ctx.fillRect(x-rad,y-rad,rad*2,rad*2)});
    function ring(coords){ctx.moveTo((coords[0][0]-box[0])/lngSpan*W,(box[3]-coords[0][1])/latSpan*H);coords.slice(1).forEach(p=>ctx.lineTo((p[0]-box[0])/lngSpan*W,(box[3]-p[1])/latSpan*H));ctx.closePath()} function shape(g){if(g.type==='Polygon')g.coordinates.forEach(ring);if(g.type==='MultiPolygon')g.coordinates.forEach(p=>p.forEach(ring))} ctx.globalCompositeOperation='destination-in';ctx.beginPath();features.forEach(f=>shape(f.geometry));ctx.fillStyle='#fff';ctx.fill('evenodd');ctx.globalCompositeOperation='source-over';
    heatLayers.push(L.imageOverlay(canvas.toDataURL(),[[box[1],box[0]],[box[3],box[2]]],{opacity,interactive:false}).addTo(map));
  }
  function overview(){view='municipalities';selectedCity=null;clear(heatLayers);clear(areaLayers);clear(districtLayers);districtDisplay=[];const values=CITIES.map(c=>totals[c]||0),visible=[];CITIES.forEach(c=>{if(!boundary[c])return;const color=COLORS[risk(totals[c]||0,values)];if(!selectedCities.has(c)){map.removeLayer(boundary[c]);return}boundary[c].addTo(map).setStyle({color:'#fff',weight:2,fillColor:color,fillOpacity:.58});boundary[c].off();boundary[c].on('click',()=>fiveAreas(c));boundary[c].bindTooltip('<div class="tip">'+c+'</div>Incidents: '+(totals[c]||0).toLocaleString()+'<br>Click to view 3 areas',{sticky:true});visible.push(boundary[c]);heat(c,boundary[c].toGeoJSON().features,rowsByCity[c]||[],.18)});const bounds=L.featureGroup(visible).getBounds();if(bounds.isValid())map.fitBounds(bounds,{padding:[35,35]});status.textContent='Green: low • Yellow: medium • Red: high — select municipalities at right';setBack();renderFilters()}
  function fiveAreas(city){view='areas';selectedCity=city;clear(heatLayers);clear(areaLayers);clear(districtLayers);CITIES.forEach(c=>{if(boundary[c])boundary[c].setStyle({color:c===city?'#111827':'#94a3b8',weight:c===city?3:1,fillOpacity:0})});
    const rows=(rowsByCity[city]||[]).filter(r=>Number.isFinite(r.lat)&&Number.isFinite(r.lng)),b=boundary[city].getBounds(),seeds=[];for(let i=0;i<AREA_COUNT;i++){const r=rows[i]||{lat:b.getSouth()+(i+1)*(b.getNorth()-b.getSouth())/(AREA_COUNT+1),lng:b.getWest()+(i+1)*(b.getEast()-b.getWest())/(AREA_COUNT+1)};seeds.push(r)}
    const groups=seeds.map(()=>[]);rows.forEach(r=>{let best=0,dist=Infinity;seeds.forEach((s,i)=>{const d=(r.lat-s.lat)**2+(r.lng-s.lng)**2;if(d<dist){dist=d;best=i}});groups[best].push(r)});const groupTotals=groups.map(g=>g.reduce((s,r)=>s+r.count,0));
    const pts=turf.featureCollection(seeds.map((s,i)=>turf.point([s.lng,s.lat],{i})));let cells=[];try{cells=turf.voronoi(pts,{bbox:[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()]}).features}catch(e){console.error(e)}
    cells.forEach((cell,i)=>{if(!cell)return;let clipped;try{clipped=turf.intersect(turf.featureCollection([cell,boundary[city].toGeoJSON()]));}catch(e){clipped=cell}if(!clipped)return;const total=groupTotals[i],level=risk(total,groupTotals),layer=L.geoJSON(clipped,{style:{color:'#fff',weight:2,fillColor:COLORS[level],fillOpacity:.58}}).addTo(map);layer.bindTooltip('<b>Area '+(i+1)+' — '+level+'</b><br>Incidents: '+total.toLocaleString()+'<br>Click for districts',{sticky:true});layer.on('click',()=>districtView(city,i,groups[i],clipped));areaLayers.push(layer);heat(city,[clipped],groups[i],.26)});
    map.fitBounds(b,{padding:[45,45]});status.textContent=city+' — 3 risk areas. Click an area to view its districts.';setBack('← Municipalities');renderFilters()
  }
  function districtView(city,area,group,areaFeature){view='districts';selectedArea=area;clear(areaLayers);clear(heatLayers);clear(districtLayers);districtDisplay=[];const keys=new Set(group.map(r=>clean(r.name))),list=Object.values(districts[city]),shown=list.filter(d=>{try{return turf.booleanPointInPolygon(turf.centroid(d.feature),areaFeature)}catch(e){return keys.has(clean(d.name))}}),vals=shown.map(d=>d.count);shown.forEach(d=>{const layer=L.geoJSON(d.feature,{style:{color:'#fff',weight:1.2,fillColor:COLORS[risk(d.count,vals)],fillOpacity:.68}}).addTo(map);layer.bindTooltip('<b>'+d.name+'</b><br>Incidents: '+d.count.toLocaleString(),{sticky:true});districtLayers.push(layer);districtDisplay.push({name:d.name,layer})});selectedDistricts.clear();districtDisplay.forEach(d=>selectedDistricts.add(d.name));heat(city,areaFeature?.type==='FeatureCollection'?areaFeature.features:[areaFeature],group,.3);if(districtLayers.length)map.fitBounds(L.featureGroup(districtLayers).getBounds(),{padding:[45,45]});status.textContent=city+' — Area '+(area+1)+' district heatmap';setBack('← 3 Areas');renderFilters()}
  back.onclick=()=>view==='districts'?fiveAreas(selectedCity):overview();
  const legend=L.control({position:'bottomleft'});legend.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML='<b>Incident risk</b><br><span class="dot" style="background:#22a447"></span>Low<br><span class="dot" style="background:#f4c430"></span>Medium<br><span class="dot" style="background:#df3030"></span>High';return d};legend.addTo(map);
  function setData(rows){CITIES.forEach(c=>{totals[c]=0;rowsByCity[c]=[];Object.values(districts[c]||{}).forEach(d=>d.count=0)});rows.forEach(r=>{const city=cityForName(r.municipality||r.city)||Object.entries(districts).find(([,ds])=>ds[clean(r.state||r.name||r.district)])?.[0];if(!city)return;const item={name:r.state||r.name||r.district||'',count:number(r.count),lat:Number(r.lat??r.latitude),lng:Number(r.long??r.lng??r.longitude)};totals[city]+=item.count;rowsByCity[city].push(item);const d=districts[city][clean(item.name)];if(d)d.count+=item.count});totalLabel.textContent='Total Incidents: '+Object.values(totals).reduce((sum,value)=>sum+value,0).toLocaleString();overview()}
  window.addEventListener('message',e=>{if(e.data?.type==='incidentData')setData(Array.isArray(e.data.data)?e.data.data:[])});
  function loadDemo(){
    function rect(w,s,e,n,name){return{type:'Feature',properties:{NAME:name},geometry:{type:'Polygon',coordinates:[[[w,s],[e,s],[e,n],[w,n],[w,s]]]}}}
    const demo={Dammam:[50.00,26.30,50.18,26.48],Dhahran:[49.92,26.20,50.08,26.33],Khobar:[50.10,26.20,50.28,26.40]};const data=[];
    CITIES.forEach((city,ci)=>{const [w,s,e,n]=demo[city];boundary[city]=L.geoJSON(rect(w,s,e,n,city)).addTo(map);districts[city]={};for(let i=0;i<9;i++){const col=i%3,row=Math.floor(i/3),x1=w+(e-w)*col/3,x2=w+(e-w)*(col+1)/3,y1=s+(n-s)*row/3,y2=s+(n-s)*(row+1)/3,name=city+' District '+(i+1),feature=rect(x1,y1,x2,y2,name);districts[city][clean(name)]={name,feature,count:0};data.push({state:name,municipality:city,count:8+(ci*7+i*11)%78,lat:(y1+y2)/2,lng:(x1+x2)/2})}});status.textContent='Demo boundaries shown — add your GeoJSON files to use real municipality data.';setData(data)
  }
  Promise.all([fetch(FILES.municipalities).then(r=>r.json()),...CITIES.map(c=>fetch(FILES[c]).then(r=>r.json()))]).then(([municipalities,...cityFiles])=>{municipalities.features.forEach(f=>{const c=cityForName(nameOf(f));if(c)boundary[c]=L.geoJSON(f).addTo(map)});cityFiles.forEach((geo,i)=>{const city=CITIES[i];districts[city]={};geo.features.forEach(f=>{const n=districtName(f);if(n)districts[city][clean(n)]={name:n,feature:f,count:0}})});setData([])}).catch(err=>{console.warn('Real GeoJSON unavailable; loading demo.',err);loadDemo()});
  </script>
</body>
</html>
