<style>

/* =========================================================
   PAGE
   ========================================================= */

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

    width: 100%;
    height: 100vh;

/* =========================================================
   LAYER CONTROL

.leaflet-control-layers {

    font-size: 13px;
}


/* =========================================================
   ALL BUBBLES

.cluster-marker,
.municipality-total-marker {

}


/* =========================================================

/* =========================================================
   TOOLTIP

.leaflet-tooltip.custom-tooltip {

}


/* =========================================================

.risk-legend {

/* =========================================================
   TITLE

.map-title {

}


/* =========================================================

.map-info {

/* =========================================================

.map-back-button {

.map-back-button:hover {

/* =========================================================

@media(max-width:600px) {

    }

        min-width: 130px;

        font-size: 11px;
    }
}

</style>

</head>


<body>

<div id="map"></div>


<div class="map-title">
    Municipality Incident Map
</div>


<div
    id="map-info"
    class="map-info"
>
    🟢 Low &nbsp;&nbsp;
    🟡 Medium &nbsp;&nbsp;
    🔴 High
</div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script
    src="https://unpkg.com/leaflet.control.layers.tree@1.1.0/L.Control.Layers.Tree.js">
</script>


<script>

/* =========================================================
   MAP
   ========================================================= */

const map = L.map("map", {

    maxZoom: 18

});


/* =========================================================
   OPEN STREET MAP
   ========================================================= */

const osm = L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        attribution:
            "&copy; OpenStreetMap contributors",

        maxZoom: 19

    }

).addTo(map);


/* =========================================================
   MUNICIPALITIES
   ========================================================= */

const CITIES = [
    "Dammam",
    "Dhahran",
    "Khobar"
];


/* =========================================================
   DATA STORES
   ========================================================= */

const districtCounts = {};

const districtToCity = {};

const districtNameLookup = {};

const districtLayers = {};

const municipalityBoundaryLayers = {};

const municipalityBoundaryFeatures = {};

const municipalityCenters = {};

const municipalityIncidentRows = {

    Dammam: [],
    Dhahran: [],
    Khobar: []

};

const municipalityTotals = {

    Dammam: 0,
    Dhahran: 0,
    Khobar: 0

};


/* =========================================================
   INCIDENT BUBBLE LAYER
   ========================================================= */

const incidentBubbleLayer =
    L.layerGroup().addTo(map);


/* =========================================================
   MUNICIPALITY MARKERS
   ========================================================= */

const municipalityMarkers = {};


/* =========================================================
   CURRENT DRILL STATE
   =========================================================

   0 = Municipality

   1 = First clustering layer

   2 = Second clustering layer

   3 = District layer

   ========================================================= */

let drillLevel = 0;

let selectedMunicipality = null;

let selectedCluster = null;

let selectedSubCluster = null;


/* =========================================================
   CURRENT CLUSTER DATA
   ========================================================= */

let currentClusters = [];


/* =========================================================
   MAP STATE
   ========================================================= */

let mapReady = false;

let pendingIncidentData = null;

let refreshTimer = null;


/* =========================================================
   NORMALIZE NAME
   ========================================================= */

function normalizeName(value) {

    return String(value || "")

        .trim()

        .replace(/\s+/g, " ")

        .toLowerCase()

        .replace(/[‐-‒–—―]/g, "-");

}


/* =========================================================
   REMOVE ARABIC DIACRITICS
   ========================================================= */

function normalizeArabic(value) {

    return String(value || "")

        .trim()

        .replace(/[\u064B-\u065F\u0670]/g, "")

        .replace(/[أإآ]/g, "ا")

        .replace(/ى/g, "ي")

        .replace(/ة/g, "ه")

        .replace(/\s+/g, " ");

}


/* =========================================================
   CANONICAL DISTRICT NAME
   ========================================================= */

function districtLookupKey(name) {

    return normalizeArabic(
        normalizeName(name)
    );

}


/* =========================================================
   GET DISTRICT COUNT
   ========================================================= */

function getDistrictCount(name) {

    const key =
        districtLookupKey(name);

    return Number(
        districtNameLookup[key]?.count ||
        districtCounts[name]?.count ||
        0
    );

}


/* =========================================================
   UPDATE MAP INFO
   ========================================================= */

function updateMapInfo(text) {

    const el =
        document.getElementById("map-info");

    if (el) {

        el.innerHTML = text;

    }

}


/* =========================================================
   POINT IN RING
   ========================================================= */

function pointInRing(
    lat,
    lng,
    ring
) {

    if (!ring || ring.length < 3) {

        return false;

    }

    let inside = false;

    for (

        let i = 0,
            j = ring.length - 1;

        i < ring.length;

        j = i++

    ) {

        const lngI =
            Number(ring[i][0]);

        const latI =
            Number(ring[i][1]);

        const lngJ =
            Number(ring[j][0]);

        const latJ =
            Number(ring[j][1]);


        const intersect =

            ((latI > lat) !== (latJ > lat))

            &&

            (

                lng <

                (

                    (lngJ - lngI) *

                    (lat - latI) /

                    ((latJ - latI) || 1e-12)

                ) +

                lngI

            );


        if (intersect) {

            inside = !inside;

        }

    }

    return inside;

}


/* =========================================================
   POINT IN POLYGON
   ========================================================= */

function pointInPolygon(
    lat,
    lng,
    coordinates
) {

    if (
        !coordinates ||
        !coordinates.length
    ) {

        return false;

    }


    if (
        !pointInRing(
            lat,
            lng,
            coordinates[0]
        )
    ) {

        return false;

    }


    for (
        let i = 1;
        i < coordinates.length;
        i++
    ) {

        if (
            pointInRing(
                lat,
                lng,
                coordinates[i]
            )
        ) {

            return false;

        }

    }


    return true;

}


/* =========================================================
   POINT IN GEOMETRY
   ========================================================= */

function pointInGeometry(
    lat,
    lng,
    geometry
) {

    if (
        !geometry ||
        !geometry.coordinates
    ) {

        return false;

    }


    if (
        geometry.type === "Polygon"
    ) {

        return pointInPolygon(
            lat,
            lng,
            geometry.coordinates
        );

    }


    if (
        geometry.type === "MultiPolygon"
    ) {

        return geometry.coordinates.some(

            polygon =>

                pointInPolygon(
                    lat,
                    lng,
                    polygon
                )

        );

    }


    return false;

}


/* =========================================================
   STRICT MUNICIPALITY DETECTION
   ========================================================= */

function resolveMunicipalityByCoordinates(
    lat,
    lng
) {

    if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ) {

        return null;

    }


    for (
        const city of CITIES
    ) {

        const features =
            municipalityBoundaryFeatures[city] ||
            [];


        for (
            const feature of features
        ) {

            if (
                pointInGeometry(
                    lat,
                    lng,
                    feature.geometry
                )
            ) {

                return city;

            }

        }

    }


    return null;

}


/* =========================================================
   DISTANCE
   ========================================================= */

function distanceSquared(
    lat1,
    lng1,
    lat2,
    lng2
) {

    const dx =
        (lng1 - lng2) *
        Math.cos(
            ((lat1 + lat2) / 2) *
            Math.PI / 180
        );

    const dy =
        lat1 - lat2;

    return (
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   FALLBACK MUNICIPALITY
   =========================================================

   IMPORTANT:

   If district is not found in JSON and its
   coordinates are outside the exact boundary,
   we still keep it inside the nearest
   existing municipality.

   This prevents the data from disappearing.

   ========================================================= */

function resolveMunicipalityFallback(
    lat,
    lng
) {

    if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ) {

        return null;

    }


    let bestCity = null;

    let bestDistance = Infinity;


    CITIES.forEach(city => {

        const center =
            municipalityCenters[city];


        if (!center) {

            return;

        }


        const distance =
            distanceSquared(
                lat,
                lng,
                center.lat,
                center.long
            );


        if (
            distance <
            bestDistance
        ) {

            bestDistance =
                distance;

            bestCity =
                city;

        }

    });


    return bestCity;

}


/* =========================================================
   RESOLVE MUNICIPALITY
   ========================================================= */

function resolveMunicipality(
    name,
    lat,
    lng
) {

    const cleanName =
        String(name || "").trim();


    /* -------------------------------------------------------
       1. Exact district GeoJSON mapping
       ------------------------------------------------------- */

    const districtCity =
        districtToCity[cleanName];


    if (districtCity) {

        return {

            city: districtCity,

            method:
                "district-geojson"

        };

    }


    const lookupCity =
        districtToCity[
            districtNameLookup[
                districtLookupKey(
                    cleanName
                )
            ]?.name
        ];


    if (lookupCity) {

        return {

            city: lookupCity,

            method:
                "district-normalized"

        };

    }


    /* -------------------------------------------------------
       2. Exact coordinate boundary
       ------------------------------------------------------- */

    const boundaryCity =
        resolveMunicipalityByCoordinates(
            lat,
            lng
        );


    if (boundaryCity) {

        return {

            city: boundaryCity,

            method:
                "coordinate-boundary"

        };

    }


    /* -------------------------------------------------------
       3. FALLBACK

       Unknown district remains inside an
       existing municipality.

       ------------------------------------------------------- */

    const fallbackCity =
        resolveMunicipalityFallback(
            lat,
            lng
        );


    if (fallbackCity) {

        return {

            city: fallbackCity,

            method:
                "municipality-fallback"

        };

    }


    return {

        city: null,

        method:
            "unresolved"

    };

}


/* =========================================================
   RISK STATS
   ========================================================= */

const riskStats = {

    min: 0,

    max: 0,

    lowLimit: 0,

    highLimit: 0

};


/* =========================================================
   CALCULATE GLOBAL RISK
   ========================================================= */

function calculateRiskStats() {

    const values = [];


    CITIES.forEach(city => {

        (
            municipalityIncidentRows[city] ||
            []
        ).forEach(row => {

            const count =
                Number(row.count || 0);


            if (count > 0) {

                values.push(count);

            }

        });

    });


    if (!values.length) {

        riskStats.min = 0;

        riskStats.max = 0;

        riskStats.lowLimit = 0;

        riskStats.highLimit = 0;

        return;

    }


    riskStats.min =
        Math.min(...values);

    riskStats.max =
        Math.max(...values);


    const range =
        riskStats.max -
        riskStats.min;


    riskStats.lowLimit =
        riskStats.min +
        range * 0.33;


    riskStats.highLimit =
        riskStats.min +
        range * 0.66;

}


/* =========================================================
   RISK LEVEL
   ========================================================= */

function getRiskLevel(
    count
) {

    count =
        Number(count || 0);


    if (count <= 0) {

        return {

            level: "No Data",

            color: "#94a3b8",

            className:
                "no-data-count"

        };

    }


    if (
        riskStats.max <= 0
    ) {

        return {

            level: "No Data",

            color: "#94a3b8",

            className:
                "no-data-count"

        };

    }


    if (
        riskStats.max ===
        riskStats.min
    ) {

        return {

            level: "High",

            color: "#dc2626",

            className:
                "high-count"

        };

    }


    if (
        count >=
        riskStats.highLimit
    ) {

        return {

            level: "High",

            color: "#dc2626",

            className:
                "high-count"

        };

    }


    if (
        count >=
        riskStats.lowLimit
    ) {

        return {

            level: "Medium",

            color: "#facc15",

            className:
                "medium-count"

        };

    }


    return {

        level: "Low",

        color: "#16a34a",

        className:
            "low-count"

    };

}


/* =========================================================
   BUBBLE SIZE
   ========================================================= */

function getBubbleSize(
    count,
    globalMax,
    minSize = 34,
    maxSize = 62
) {

    count =
        Number(count || 0);

    globalMax =
        Number(globalMax || 0);


    if (
        globalMax <= 0
    ) {

        return minSize;

    }


    const ratio =
        Math.sqrt(
            Math.max(
                0,
                count / globalMax
            )
        );


    return Math.round(

        minSize +

        (
            maxSize -
            minSize
        ) *

        ratio

    );

}


/* =========================================================
   MAKE BUBBLE ICON
   ========================================================= */

function makeBubbleIcon(
    count,
    size,
    className
) {

    const safeSize =
        Math.max(
            30,
            Math.min(
                72,
                Number(size || 38)
            )
        );


    const fontSize =
        safeSize >= 58
            ? 14
            : safeSize >= 45
                ? 12
                : 11;


    return L.divIcon({

        className:
            `cluster-marker ${className}`,

        html: `

            <div
                class="count-circle"
                style="
                    width:${safeSize}px;
                    height:${safeSize}px;
                    font-size:${fontSize}px;
                "
            >
                ${Number(count || 0).toLocaleString()}
            </div>

        `,

        iconSize:
            [
                safeSize,
                safeSize
            ],

        iconAnchor:
            [
                safeSize / 2,
                safeSize / 2
            ]

    });

}


/* =========================================================
   MUNICIPALITY SIZE
   ========================================================= */

function getMunicipalitySize(
    count,
    globalMax
) {

    return getBubbleSize(
        count,
        globalMax,
        60,
        94
    );

}


/* =========================================================
   MUNICIPALITY ICON
   ========================================================= */

function makeMunicipalityIcon(
    count,
    globalMax
) {

    const risk =
        getRiskLevel(count);


    const size =
        getMunicipalitySize(
            count,
            globalMax
        );


    return L.divIcon({

        className:
            `municipality-total-marker ${risk.className}`,

        html: `

            <div
                class="municipality-total-circle"
                style="
                    width:${size}px;
                    height:${size}px;
                    background:${risk.color};
                    font-size:15px;
                "
            >
                ${Number(count || 0).toLocaleString()}
            </div>

        `,

        iconSize:
            [
                size,
                size
            ],

        iconAnchor:
            [
                size / 2,
                size / 2
            ]

    });

}


/* =========================================================
   DISTRICT TOOLTIP
   ========================================================= */

function districtTooltipHtml(
    name,
    city,
    count
) {

    const risk =
        getRiskLevel(count);


    return `

        <div>

            <b>District:</b>
            ${name}

            <br>

            <b>Municipality:</b>
            ${city}

            <br>

            <b>Incidents:</b>
            ${Number(count || 0).toLocaleString()}

            <br>

            <b>Risk:</b>
            ${risk.level}

        </div>

    `;

}


/* =========================================================
   CLUSTER TOOLTIP
   ========================================================= */

function clusterTooltipHtml(
    label,
    count,
    level,
    itemCount
) {

    const risk =
        getRiskLevel(count);


    return `

        <div>

            <b>${label}</b>

            <br>

            <b>Incidents:</b>
            ${Number(count || 0).toLocaleString()}

            <br>

            <b>Risk:</b>
            ${risk.level}

            <br>

            <b>Locations:</b>
            ${itemCount}

            <br><br>

            <b>Click bubble to drill down</b>

        </div>

    `;

}


/* =========================================================
   MUNICIPALITY TOOLTIP
   ========================================================= */

function municipalityTooltipHtml(
    city
) {

    const count =
        municipalityTotals[city] || 0;


    const risk =
        getRiskLevel(count);


    return `

        <div>

            <b>Municipality:</b>
            ${city}

            <br>

            <b>Total Incidents:</b>
            ${count.toLocaleString()}

            <br>

            <b>Risk:</b>
            ${risk.level}

            <br><br>

            <b>Click to divide into 3 groups</b>

        </div>

    `;

}


/* =========================================================
   HIDE MUNICIPALITY MARKERS
   ========================================================= */

function hideMunicipalityMarkers() {

    Object.values(
        municipalityMarkers
    ).forEach(marker => {

        if (
            incidentBubbleLayer.hasLayer(
                marker
            )
        ) {

            incidentBubbleLayer.removeLayer(
                marker
            );

        }

    });

}


/* =========================================================
   CLEAR ALL BUBBLES
   ========================================================= */

function clearBubbleLayer() {

    incidentBubbleLayer.clearLayers();

}


/* =========================================================
   CREATE MUNICIPALITY MARKERS
   ========================================================= */

function createMunicipalityMarkers() {

    clearBubbleLayer();


    const globalMax =
        Math.max(

            ...CITIES.map(
                city =>
                    municipalityTotals[city] || 0
            ),

            1

        );


    CITIES.forEach(city => {

        const center =
            municipalityCenters[city];


        if (!center) {

            return;

        }


        const count =
            municipalityTotals[city] || 0;


        const marker =
            L.marker(

                [
                    center.lat,
                    center.long
                ],

                {

                    icon:
                        makeMunicipalityIcon(
                            count,
                            globalMax
                        ),

                    zIndexOffset:
                        2000,

                    interactive:
                        true

                }

            );


        marker.bindTooltip(

            municipalityTooltipHtml(
                city
            ),

            {

                sticky: true,

                direction: "top",

                opacity: 0.95,

                className:
                    "custom-tooltip"

            }

        );


        marker.on(
            "click",
            function() {

                showMunicipality(
                    city
                );

            }
        );


        municipalityMarkers[city] =
            marker;


        incidentBubbleLayer.addLayer(
            marker
        );

    });

}


/* =========================================================
   GET CENTROID
   ========================================================= */

function getCentroid(
    rows
) {

    if (
        !rows ||
        !rows.length
    ) {

        return null;

    }


    let lat = 0;

    let lng = 0;


    rows.forEach(row => {

        lat +=
            Number(row.lat || 0);

        lng +=
            Number(row.lng || 0);

    });


    return {

        lat:
            lat / rows.length,

        lng:
            lng / rows.length

    };

}


/* =========================================================
   CREATE FALLBACK COORDINATE
   =========================================================

   Used when an unmatched district has no
   valid coordinate.

   It stays inside the municipality.

   ========================================================= */

function fallbackCoordinate(
    city,
    index,
    total
) {

    const center =
        municipalityCenters[city];


    if (!center) {

        return null;

    }


    const angle =
        (
            index /
            Math.max(total, 1)
        ) *

        Math.PI * 2;


    const radius =
        0.008;


    return {

        lat:
            center.lat +
            Math.sin(angle) *
            radius,

        lng:
            center.long +
            Math.cos(angle) *
            radius

    };

}


/* =========================================================
   PREPARE ROW COORDINATES
   ========================================================= */

function prepareRows(
    rows,
    city
) {

    return rows.map(
        (row, index) => {

            let lat =
                Number(row.lat);

            let lng =
                Number(row.lng);


            if (
                !Number.isFinite(lat) ||
                !Number.isFinite(lng)
            ) {

                const fallback =
                    fallbackCoordinate(
                        city,
                        index,
                        rows.length
                    );


                if (fallback) {

                    lat =
                        fallback.lat;

                    lng =
                        fallback.lng;

                }

            }


            return {

                ...row,

                lat,

                lng,

                city

            };

        }

    );

}


/* =========================================================
   DISTANCE BETWEEN TWO POINTS
   ========================================================= */

function pointDistance(
    a,
    b
) {

    return distanceSquared(
        a.lat,
        a.lng,
        b.lat,
        b.lng
    );

}


/* =========================================================
   SIMPLE 3-WAY SPATIAL CLUSTERING
   =========================================================

   Deterministic geographic clustering.

   It does NOT put all markers on top
   of each other.

   ========================================================= */

function splitIntoThree(
    rows
) {

    if (
        !rows ||
        rows.length <= 1
    ) {

        return rows && rows.length
            ? [rows]
            : [];

    }


    if (
        rows.length === 2
    ) {

        return [
            [rows[0]],
            [rows[1]]
        ];

    }


    const centroid =
        getCentroid(rows);


    if (!centroid) {

        return [rows];

    }


    /* -------------------------------------------------------
       Sort by angle around centroid
       ------------------------------------------------------- */

    const sorted =
        [...rows].sort(
            (a, b) => {

                const angleA =
                    Math.atan2(
                        a.lat -
                        centroid.lat,

                        a.lng -
                        centroid.lng
                    );


                const angleB =
                    Math.atan2(
                        b.lat -
                        centroid.lat,

                        b.lng -
                        centroid.lng
                    );


                return angleA - angleB;

            }
        );


    /* -------------------------------------------------------
       Split into 3 balanced groups
       ------------------------------------------------------- */

    const groups = [
        [],
        [],
        []
    ];


    sorted.forEach(
        (row, index) => {

            groups[
                index % 3
            ].push(row);

        }
    );


    return groups.filter(
        group =>
            group.length > 0
    );

}


/* =========================================================
   CREATE CLUSTER OBJECTS
   ========================================================= */

function createClusters(
    rows
) {

    const groups =
        splitIntoThree(rows);


    return groups.map(
        (items, index) => {

            const total =
                items.reduce(

                    (sum, row) =>

                        sum +
                        Number(
                            row.count || 0
                        ),

                    0

                );


            const center =
                getCentroid(items);


            return {

                id:
                    `${Date.now()}_${index}_${Math.random()}`,

                index,

                items,

                count:
                    total,

                lat:
                    center
                        ? center.lat
                        : null,

                lng:
                    center
                        ? center.lng
                        : null

            };

        }

    );

}


/* =========================================================
   CREATE CLUSTER MARKER
   ========================================================= */

function createClusterMarker(
    cluster,
    level,
    city
) {

    if (
        !cluster ||
        !Number.isFinite(cluster.lat) ||
        !Number.isFinite(cluster.lng)
    ) {

        return null;

    }


    const allCounts =
        currentClusters.map(
            item =>
                Number(item.count || 0)
        );


    const globalMax =
        Math.max(
            ...allCounts,
            1
        );


    const risk =
        getRiskLevel(
            cluster.count
        );


    const size =
        level === 1

            ? getBubbleSize(
                cluster.count,
                globalMax,
                44,
                70
            )

            : getBubbleSize(
                cluster.count,
                globalMax,
                38,
                62
            );


    const marker =
        L.marker(

            [
                cluster.lat,
                cluster.lng
            ],

            {

                icon:
                    makeBubbleIcon(
                        cluster.count,
                        size,
                        risk.className
                    ),

                zIndexOffset:
                    1500 +

                    (
                        100 -
                        level * 10
                    ),

                interactive:
                    true

            }

        );


    marker.bindTooltip(

        clusterTooltipHtml(

            level === 1
                ? `Group ${cluster.index + 1}`
                : `Sub-group ${cluster.index + 1}`,

            cluster.count,

            level,

            cluster.items.length

        ),

        {

            sticky: true,

            direction: "top",

            opacity: 0.95,

            className:
                "custom-tooltip"

        }

    );


    marker.on(
        "click",
        function() {

            if (
                level === 1
            ) {

                showSecondLevel(
                    cluster,
                    city
                );

            }

            else {

                showDistrictLevel(
                    cluster,
                    city
                );

            }

        }
    );


    return marker;

}


/* =========================================================

function showMunicipality(
    city
) {

    selectedMunicipality =

        null;

        null;

    drillLevel = 1;


    clearBubbleLayer();


    const rows =
        prepareRows(

            municipalityIncidentRows[city] ||
            [],

        );


    if (!rows.length) {

        updateMapInfo(
            `${city} — No incident data`
        );

        updateBackButton();

        return;

    }


    currentClusters =
        createClusters(rows);


    currentClusters.forEach(
        cluster => {

            const marker =
                createClusterMarker(
                    cluster,
                    1,
                    city
                );


            if (marker) {

                incidentBubbleLayer.addLayer(
                    marker
                );

            }

        }
    );


    const boundary =
        municipalityBoundaryLayers[city];


    if (boundary) {

        map.fitBounds(

            boundary.getBounds(),

            {

                    [60, 60],

                maxZoom:

            }

        );

    }


    updateMapInfo(

        `<b>${city}</b>
         &nbsp; → &nbsp;

    );


    updateBackButton();

) {

            );


            incidentBubbleLayer.addLayer(

            );

        }

    const points =
        rows.filter(

            row =>

                Number.isFinite(row.lat) &&

        );


    if (points.length) {

        const bounds =
            L.latLngBounds(

                points.map(

                        ]
                )

        if (

        ) {

        );

/* =========================================================
   BACK HANDLER
   ========================================================= */

function handleBack() {

    if (
        drillLevel === 3
    ) {

        if (
            selectedCluster
        ) {

            showSecondLevel(

                selectedCluster,

                selectedMunicipality

            );

        }

        return;

    }


    if (
        drillLevel === 2
    ) {

        if (
            selectedMunicipality
        ) {

            showMunicipality(
                selectedMunicipality
            );

        }

        return;

    }


    showMunicipalityOverview();

}


/* =========================================================
   UPDATE BACK BUTTON
   ========================================================= */

function updateBackButton() {

    const button =
        document.querySelector(
            ".map-back-button"
        );


    if (!button) {

        return;

    }


    if (
        drillLevel === 0
    ) {

        button.style.display =
            "none";

        return;

    }


    button.style.display =
        "block";


    if (
        drillLevel === 1
    ) {

        button.innerHTML =
            "← Municipalities";

    }

    else if (
        drillLevel === 2
    ) {

        button.innerHTML =
            "← Groups";

    }

    else {

        button.innerHTML =
            "← Sub-groups";

    }

}

/* =========================================================
   DISTRICT STYLE
   ========================================================= */

function districtStyle(
    city,
    districtName
) {

    const count =
        getDistrictCount(
            districtName
        );


    const risk =
        getRiskLevel(count);


    return {

        color:
            "#374151",

        weight:
            1.2,

        opacity:
            0.75,

        fillColor:
            risk.color,

        fillOpacity:
            count > 0
                ? 0.22
                : 0.03

    };

}


/* =========================================================
   MAKE DISTRICT NODES
   ========================================================= */

function makeDistrictNodes(
    data,
    city
) {

    if (
        !data ||
        !Array.isArray(
            data.features
        )
    ) {

        return [];

    }


    return data.features
        .map(feature => {

            const districtName =
                String(

                    feature.properties?.REMARKS ||

                    feature.properties?.NameEn ||

                    feature.properties?.NAME ||

                    feature.properties?.name ||

                    ""

                ).trim();


            if (!districtName) {

                return null;

            }


            districtToCity[
                districtName
            ] = city;


            districtNameLookup[
                districtLookupKey(
                    districtName
                )
            ] = {

                name:
                    districtName,

                city:
                    city,

                count:
                    getDistrictCount(
                        districtName
                    )

            };


            const layer =
                L.geoJSON(

                    feature,

                    {

                        style:
                            districtStyle(
                                city,
                                districtName
                            )

                    }

                );


            layer.bindTooltip(

                districtTooltipHtml(

                    districtName,

                    city,

                    getDistrictCount(
                        districtName
                    )

                ),

                {

                    sticky:
                        true,

                    direction:
                        "top",

                    opacity:
                        0.95,

                    className:
                        "custom-tooltip"

                }

            );


            layer.on({

                mouseover:
                    function(e) {

                        e.target.setStyle({

                            weight:
                                2.5,

                            fillColor:
                                getRiskLevel(

                                    getDistrictCount(
                                        districtName
                                    )

                                ).color,

                            fillOpacity:
                                0.40

                        });

                    },


                mouseout:
                    function() {

                        layer.setStyle(

                            districtStyle(
                                city,
                                districtName
                            )

                        );

                    },


                click:
                    function() {

                        const d =
                            districtCounts[
                                districtName
                            ];


                        window.parent.postMessage(

                            {

                                type:
                                    "mapClick",

                                state:
                                    districtName,

                                municipality:
                                    city,

                                lat:
                                    d
                                        ? d.lat
                                        : null,

                                long:
                                    d
                                        ? d.long
                                        : null

                            },

                            "*"

                        );

                    }

            });


            districtLayers[
                districtName
            ] = layer;


            return {

                label:
                    districtName,

                layer:
                    layer

            };

        })

        .filter(Boolean);

}

                group.getBounds().isValid()
            ) {

                map.fitBounds(

                    group.getBounds(),

                    {

                        padding:
                            [30, 30]

                    }

                );

            }

        }


        /* =================================================
           LEGEND
           ================================================= */

        const legend =
            L.control({

                position:
                    "bottomleft"

            });


        legend.onAdd =
            function() {

                const div =
                    L.DomUtil.create(

                        "div",

                        "risk-legend"

                    );


                div.innerHTML = `

                    <div
                        class="risk-legend-title"
                    >
                        Incident Risk
                    </div>


                    <div class="legend-row">

                        <span
                            class="legend-color
                                   legend-green">
                        </span>

                        <span>
                            Low
                        </span>

                    </div>


                    <div class="legend-row">

                        <span
                            class="legend-color
                                   legend-yellow">
                        </span>

                        <span>
                            Medium
                        </span>

                    </div>


                    <div class="legend-row">

                        <span
                            class="legend-color
                                   legend-red">
                        </span>

                        <span>
                            High
                        </span>

                    </div>

                `;


                return div;

            };


        legend.addTo(map);


        /* =================================================
           MAP READY
           ================================================= */

        mapReady =
            true;


        if (
            pendingIncidentData
        ) {

            applyIncidentData(
                pendingIncidentData
            );


            pendingIncidentData =
                null;

        }

        else {

            calculateRiskStats();

            showMunicipalityOverview();

        }


        /* =================================================
           INFORM GRAFANA
           ================================================= */

        window.parent.postMessage(

            {

                type:
                    "iframeReady"

            },

            "*"

        );

    }

)

.catch(

    err => {

        console.error(

            "Error loading GeoJSON:",

            err

        );

    }

);


/* =========================================================
   APPLY GRAFANA DATA
   ========================================================= */

function applyIncidentData(
    rows
) {


    /* =====================================================
       RESET
       ===================================================== */

    Object.keys(
        districtCounts
    ).forEach(key => {

        delete districtCounts[key];

    });


    Object.keys(
        districtNameLookup
    ).forEach(key => {

        delete districtNameLookup[key];

    });


    CITIES.forEach(city => {

        municipalityTotals[city] =
            0;

        municipalityIncidentRows[city] =
            [];

    });


    /* =====================================================
       PROCESS ROWS
       ===================================================== */

    (rows || []).forEach(
        row => {

            const name =
                String(
                    row.state || ""
                ).trim();


            const count =
                Number(
                    row.count || 0
                );


            let lat =
                Number(row.lat);


            let lng =
                Number(row.long);


            if (
                !name ||
                !Number.isFinite(count)
            ) {

                return;

            }


            /* ------------------------------------------------
               Normalize invalid coordinates
               ------------------------------------------------ */

            if (
                !Number.isFinite(lat)
            ) {

                lat = null;

            }


            if (
                !Number.isFinite(lng)
            ) {

                lng = null;

            }


            /* ------------------------------------------------
               Municipality resolution
               ------------------------------------------------ */

            const resolution =
                resolveMunicipality(

                    name,

                    lat,

                    lng

                );


            if (
                !resolution.city
            ) {

                console.warn(

                    "Could not resolve municipality:",

                    {

                        name,

                        count,

                        lat,

                        lng

                    }

                );

                return;

            }


            const city =
                resolution.city;


            /* ------------------------------------------------
               Store municipality total
               ------------------------------------------------ */

            municipalityTotals[city] +=
                count;


            /* ------------------------------------------------
               If district exists in GeoJSON,
               store its count.
               ------------------------------------------------ */

            const exactDistrict =
                districtToCity[name];


            if (
                exactDistrict
            ) {

                districtCounts[
                    exactDistrict
                ] = {

                    count,

                    lat,

                    long:
                        lng

                };

            }


            /* ------------------------------------------------
               Store normalized lookup
               ------------------------------------------------ */

            districtNameLookup[
                districtLookupKey(name)
            ] = {

                name,

                city,

                count

            };


            /* ------------------------------------------------
               IMPORTANT:
               Every row stays inside municipality.

               Unknown district names are NOT discarded.
               ------------------------------------------------ */

            municipalityIncidentRows[city]
                .push({

                    name,

                    count,

                    lat,

                    lng,

                    city,

                    method:
                        resolution.method

                });

        }

    );


    /* =====================================================
       CREATE FALLBACK POSITIONS
       =====================================================

       For rows without coordinates, put them around
       the municipality center.

       ===================================================== */

    CITIES.forEach(city => {

        const rowsForCity =
            municipalityIncidentRows[city];


        rowsForCity.forEach(
            (row, index) => {

                if (
                    !Number.isFinite(row.lat) ||
                    !Number.isFinite(row.lng)
                ) {

                    const fallback =
                        fallbackCoordinate(

                            city,

                            index,

                            rowsForCity.length

                        );


                    if (fallback) {

                        row.lat =
                            fallback.lat;

                        row.lng =
                            fallback.lng;

                    }

                }

            }

        );

    });


    /* =====================================================
       RISK
       ===================================================== */

    calculateRiskStats();


    /* =====================================================
       UPDATE DISTRICT POLYGONS
       ===================================================== */

    Object.keys(
        districtLayers
    ).forEach(name => {

        const city =
            districtToCity[name];


        const layer =
            districtLayers[name];


        if (!layer) {

            return;

        }


        layer.setStyle(

            districtStyle(
                city,
                name
            )

        );


        layer.setTooltipContent(

            districtTooltipHtml(

                name,

                city,

                getDistrictCount(
                    name
                )

            )

        );

    });


    /* =====================================================
       RESET VIEW
       ===================================================== */

    drillLevel =
        0;

    selectedMunicipality =
        null;

    selectedCluster =
        null;

    selectedSubCluster =
        null;


    currentClusters = [];


    showMunicipalityOverview();


    scheduleRefresh();

}


/* =========================================================
   REFRESH
   ========================================================= */

function scheduleRefresh() {

    if (
        refreshTimer
    ) {

        clearTimeout(
            refreshTimer
        );

    }


    refreshTimer =
        setTimeout(

            () => {

                refreshTimer =
                    null;

                refreshMap();

            },

            100

        );

}


/* =========================================================
   REFRESH MAP
   ========================================================= */

function refreshMap() {

    calculateRiskStats();


    if (
        drillLevel === 0
    ) {

        showMunicipalityOverview();

    }

}


/* =========================================================
   RECEIVE DATA FROM GRAFANA
   ========================================================= */

window.addEventListener(

    "message",

    event => {


        if (
            event.data?.type !==
            "incidentData"
        ) {

            return;

        }


        const rows =
            event.data.data || [];


        console.log(

            "Received incident data:",

            rows

        );


        if (!mapReady) {

            pendingIncidentData =
                rows;

            return;

        }


        applyIncidentData(
            rows
        );

    }

);

</script>

</body>

</html>
