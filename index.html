/* =====================================================
   APPLY INCIDENT DATA
   ===================================================== */

function applyIncidentData(
    rows
) {

    console.log(
        "Incident data received:",
        rows
    );


    /*
       =================================================
       CLEAR DATA
       =================================================
    */

    Object.keys(
        districtCounts
    ).forEach(
        key => {

            delete districtCounts[
                key
            ];

        }
    );


    municipalityTotals.Dammam =
        0;

    municipalityTotals.Dhahran =
        0;

    municipalityTotals.Khobar =
        0;


    municipalityLocationRows.Dammam =
        [];

    municipalityLocationRows.Dhahran =
        [];

    municipalityLocationRows.Khobar =
        [];


    municipalityCluster.clearLayers();

    districtCluster.clearLayers();


    /*
       =================================================
       PROCESS EVERY ROW
       =================================================
    */

    (rows || []).forEach(
        row => {

            const name =
                String(

                    row.state ||

                    row.district ||

                    row.district_name ||

                    row.location ||

                    row.name ||

                    ""

                ).trim();


            const count =
                safeNumber(
                    row.count
                );


            const lat =
                Number(
                    row.lat
                );


            const long =
                Number(
                    row.long
                );


            if (
                !name &&
                !Number.isFinite(lat)
            ) {

                return;

            }


            /*
               =================================================
               DISTRICT COUNT
               =================================================
            */

            if (name) {

                const normalized =
                    normalizeName(
                        name
                    );


                let existingKey =
                    Object.keys(
                        districtCounts
                    ).find(
                        key =>
                            normalizeName(
                                key
                            ) === normalized
                    );


                const districtKey =
                    existingKey ||
                    name;


                if (
                    !districtCounts[
                        districtKey
                    ]
                ) {

                    districtCounts[
                        districtKey
                    ] = {

                        count:
                            0,

                        lat:
                            Number.isFinite(lat)
                                ? lat
                                : null,

                        long:
                            Number.isFinite(long)
                                ? long
                                : null

                    };

                }


                districtCounts[
                    districtKey
                ].count +=
                    count;


                /*
                   Keep coordinates.
                */

                if (
                    Number.isFinite(lat) &&
                    Number.isFinite(long)
                ) {

                    districtCounts[
                        districtKey
                    ].lat =
                        lat;

                    districtCounts[
                        districtKey
                    ].long =
                        long;

                }

            }


            /*
               =================================================
               FIND MUNICIPALITY
               =================================================
            */

            let city =
                findMunicipalityFromRow(
                    row
                );


            /*
               =================================================
               LAT/LONG FALLBACK
               =================================================
            */

            if (
                !city &&
                Number.isFinite(lat) &&
                Number.isFinite(long)
            ) {

                city =
                    findMunicipalityByLatLng(
                        lat,
                        long
                    );

            }


            /*
               =================================================
               SAVE ROW
               =================================================
            */

            if (city) {

                municipalityTotals[
                    city
                ] +=
                    count;


                municipalityLocationRows[
                    city
                ].push({

                    ...row,

                    state:
                        name,

                    count:
                        count,

                    lat:
                        lat,

                    long:
                        long

                });

            }

        }
    );


    /*
       =================================================
       UPDATE OLD DISTRICT GEOJSON
       =================================================

       THIS PART IS IMPORTANT.

       The district polygons remain.
       Their color changes according to
       the district incident count.
    */

    Object.keys(
        districtLayers
    ).forEach(
        districtName => {

            const city =
                districtToCity[
                    districtName
                ];


            if (!city) {

                return;

            }


            districtLayers[
                districtName
            ].setStyle(

                districtStyle(

                    city,

                    districtName

                )

            );


            const d =
                districtCounts[
                    districtName
                ];


            bindOrUpdateTooltip(

                districtLayers[
                    districtName
                ],

                locationTooltipHtml(

                    districtName,

                    city,

                    d
                        ? d.count
                        : 0,

                    d
                        ? d.lat
                        : null,

                    d
                        ? d.long
                        : null

                )

            );

        }
    );


    /*
       Refresh screen.
    */

    if (mapReady) {

        refreshMap();

    }

}


/* =====================================================
   TOOLTIP UPDATE
   ===================================================== */

function bindOrUpdateTooltip(
    layer,
    html
) {

    if (!layer) {

        return;

    }


    if (
        layer.getTooltip()
    ) {

        layer.setTooltipContent(
            html
        );

    }

    else {

        layer.bindTooltip(

            html,

            {

                sticky:
                    true,

                direction:
                    "top",

                opacity:
                    0.95,

                className:
                    "custom-tooltip"

            }

        );

    }

}


/* =====================================================
   GEOJSON LOADER
   ===================================================== */

function loadGeoJSON(
    url
) {

    return fetch(
        url
    )

    .then(
        response => {

            if (
                !response.ok
            ) {

                throw new Error(

                    `${url} returned HTTP ${response.status}`

                );

            }


            return response.json();

        }
    );

}


/* =====================================================
   CREATE DISTRICT NODES
   OLD DISTRICT LAYER RETAINED
   ===================================================== */

function makeDistrictNodes(
    data,
    city
) {

    if (
        !data ||
        !Array.isArray(
            data.features
        )
    ) {

        console.warn(
            `No district GeoJSON for ${city}`
        );

        return [];

    }


    return data.features

        .map(

            feature => {

                const districtName =
                    String(

                        feature
                            .properties
                            ?.REMARKS ||

                        feature
                            .properties
                            ?.NAME ||

                        feature
                            .properties
                            ?.name ||

                        feature
                            .properties
                            ?.DISTRICT ||

                        feature
                            .properties
                            ?.DISTRICT_NAME ||

                        ""

                    ).trim();


                if (!districtName) {

                    return null;

                }


                /*
                   MAP DISTRICT -> MUNICIPALITY
                */

                districtToCity[
                    districtName
                ] =
                    city;


                /*
                   =================================================
                   OLD DISTRICT POLYGON
                   =================================================
                */

                const layer =
                    L.geoJSON(

                        feature,

                        {

                            style:
                                districtStyle(

                                    city,

                                    districtName

                                )

                        }

                    );


                /*
                   STORE IT
                   */

                districtLayers[
                    districtName
                ] =
                    layer;


                /*
                   TOOLTIP
                */

                bindOrUpdateTooltip(

                    layer,

                    locationTooltipHtml(

                        districtName,

                        city,

                        getDistrictCount(
                            districtName
                        ),

                        districtCounts[
                            districtName
                        ]?.lat,

                        districtCounts[
                            districtName
                        ]?.long

                    )

                );


                /*
                   HOVER
                */

                layer.on(

                    "mouseover",

                    function(e) {

                        layer.setStyle({

                            color:
                                "#000000",

                            weight:
                                3,

                            fillOpacity:
                                selectedMunicipality === city
                                    ? 0.25
                                    : 0.10

                        });


                        layer.openTooltip(
                            e.latlng
                        );

                    }

                );


                layer.on(

                    "mouseout",

                    function() {

                        layer.setStyle(

                            districtStyle(

                                city,

                                districtName

                            )

                        );

                    }

                );


                /*
                   DISTRICT CLICK
                */

                layer.on(

                    "click",

                    function() {

                        const d =
                            districtCounts[
                                districtName
                            ];


                        window.parent.postMessage(

                            {

                                type:
                                    "mapClick",

                                state:
                                    districtName,

                                municipality:
                                    city,

                                lat:
                                    d
                                        ? d.lat
                                        : null,

                                long:
                                    d
                                        ? d.long
                                        : null,

                                count:
                                    d
                                        ? d.count
                                        : 0

                            },

                            "*"

                        );

                    }

                );


                return {

                    label:
                        districtName,

                    layer:
                        layer

                };

            }

        )

        .filter(
            Boolean
        );

}


/* =====================================================
   GET DISTRICT COUNT
   ===================================================== */

function getDistrictCount(
    name
) {

    const direct =
        districtCounts[
            name
        ];


    if (direct) {

        return direct.count || 0;

    }


    const normalized =
        normalizeName(
            name
        );


    const matching =
        Object.keys(
            districtCounts
        )
        .find(
            key =>
                normalizeName(
                    key
                ) === normalized
        );


    return matching
        ? districtCounts[
            matching
        ].count || 0
        : 0;

}


/* =====================================================
   COLLAPSE LAYER TREE
   ===================================================== */

function collapseLayerTreeGroups() {

    setTimeout(

        () => {

            document
                .querySelectorAll(
                    ".leaflet-layerstree-header-pointer"
                )
                .forEach(
                    pointer => {

                        const node =
                            pointer.closest(
                                ".leaflet-layerstree-node"
                            );


                        if (!node) {

                            return;

                        }


                        if (
                            !node.classList.contains(
                                "leaflet-layerstree-node-collapsed"
                            )
                        ) {

                            pointer.click();

                        }

                    }
                );

        },

        500

    );

}


/* =====================================================
   LOAD ALL GEOJSON
   ===================================================== */

Promise.allSettled(

    [

        loadGeoJSON(
            "./municipality.geojson"
        ),

        loadGeoJSON(
            "./dammam.geojson"
        ),

        loadGeoJSON(
            "./dhahran.geojson"
        ),

        loadGeoJSON(
            "./khobar.geojson"
        )

    ]

)

.then(

    results => {

        /*
           =================================================
           MUNICIPALITY
           =================================================
        */

        const municipalityData =

            results[0].status ===
            "fulfilled"

                ? results[0].value
                : null;


        /*
           =================================================
           DISTRICT FILES
           =================================================
        */

        const dammamData =

            results[1].status ===
            "fulfilled"

                ? results[1].value
                : null;


        const dhahranData =

            results[2].status ===
            "fulfilled"

                ? results[2].value
                : null;


        const khobarData =

            results[3].status ===
            "fulfilled"

                ? results[3].value
                : null;


        /*
           =================================================
           MUNICIPALITY BOUNDARIES
           =================================================
        */

        if (

            municipalityData &&

            Array.isArray(
                municipalityData.features
            )

        ) {

            municipalityData.features.forEach(

                feature => {

                    const name =
                        String(

                            feature
                                .properties
                                ?.REMARKS ||

                            feature
                                .properties
                                ?.NAME ||

                            feature
                                .properties
                                ?.name ||

                            ""

                        ).trim();


                    const city =
                        normalizeMunicipalityName(
                            name
                        );


                    if (!city) {

                        return;

                    }


                    const boundary =
                        L.geoJSON(

                            feature,

                            {

                                style:
                                    boundaryStyle(
                                        city
                                    )

                            }

                        );


                    municipalityBoundaryLayers[
                        city
                    ] =
                        boundary;


                    /*
                       CENTER
                    */

                    const bounds =
                        boundary.getBounds();


                    const center =
                        bounds.getCenter();


                    municipalityCenters[
                        city
                    ] = {

                        lat:
                            center.lat,

                        long:
                            center.lng

                    };


                    /*
                       TOOLTIP
                    */

                    bindOrUpdateTooltip(

                        boundary,

                        municipalityTooltipHtml(
                            city
                        )

                    );


                    /*
                       HOVER
                    */

                    boundary.on(

                        "mouseover",

                        function(e) {

                            boundary.setStyle({

                                weight:
                                    4,

                                fillOpacity:
                                    0.08

                            });


                            boundary.openTooltip(
                                e.latlng
                            );

                        }

                    );


                    boundary.on(

                        "mouseout",

                        function() {

                            boundary.setStyle(

                                boundaryStyle(
                                    city
                                )

                            );

                        }

                    );


                    /*
                       MUNICIPALITY CLICK
                    */

                    boundary.on(

                        "click",

                        function() {

                            showMunicipalityLocations(
                                city
                            );

                        }

                    );

                }

            );

        }


        /*
           =================================================
           CREATE DISTRICT GEOJSON
           =================================================

           DO NOT REMOVE THESE.
        */

        const dammamDistricts =
            makeDistrictNodes(

                dammamData,

                "Dammam"

            );


        const dhahranDistricts =
            makeDistrictNodes(

                dhahranData,

                "Dhahran"

            );


        const khobarDistricts =
            makeDistrictNodes(

                khobarData,

                "Khobar"

            );


        /*
           =================================================
           LAYER TREE
           =================================================
        */

        const overlaysTree = {

            label:
                "Map Layers",

            selectAllCheckbox:
                false,

            children: [

                {

                    label:
                        "Dammam",

                    selectAllCheckbox:
                        true,

                    children: [

                        {

                            label:
                                "Boundary",

                            layer:
                                municipalityBoundaryLayers[
                                    "Dammam"
                                ]

                        },

                        {

                            label:
                                "Districts",

                            selectAllCheckbox:
                                true,

                            children:
                                dammamDistricts

                        }

                    ]

                },


                {

                    label:
                        "Dhahran",

                    selectAllCheckbox:
                        true,

                    children: [

                        {

                            label:
                                "Boundary",

                            layer:
                                municipalityBoundaryLayers[
                                    "Dhahran"
                                ]

                        },

                        {

                            label:
                                "Districts",

                            selectAllCheckbox:
                                true,

                            children:
                                dhahranDistricts

                        }

                    ]

                },


                {

                    label:
                        "Khobar",

                    selectAllCheckbox:
                        true,

                    children: [

                        {

                            label:
                                "Boundary",

                            layer:
                                municipalityBoundaryLayers[
                                    "Khobar"
                                ]

                        },

                        {

                            label:
                                "Districts",

                            selectAllCheckbox:
                                true,

                            children:
                                khobarDistricts

                        }

                    ]

                }

            ]

        };


        /*
           =================================================
           LAYER CONTROL
           =================================================
        */

        if (

            typeof
            L.control.layers.tree ===
            "function"

        ) {

            L.control.layers.tree(

                {

                    "OpenStreetMap":
                        osm

                },

                overlaysTree,

                {

                    collapsed:
                        false,

                    namedToggle:
                        true,

                    selectorBack:
                        false,

                    closedSymbol:
                        "▶",

                    openedSymbol:
                        "▼"

                }

            ).addTo(
                map
            );


            collapseLayerTreeGroups();

        }

        else {

            /*
               Fallback
            */

            const fallbackOverlays = {};


            if (
                municipalityBoundaryLayers.Dammam
            ) {

                fallbackOverlays[
                    "Dammam Boundary"
                ] =
                    municipalityBoundaryLayers.Dammam;

            }


            if (
                municipalityBoundaryLayers.Dhahran
            ) {

                fallbackOverlays[
                    "Dhahran Boundary"
                ] =
                    municipalityBoundaryLayers.Dhahran;

            }


            if (
                municipalityBoundaryLayers.Khobar
            ) {

                fallbackOverlays[
                    "Khobar Boundary"
                ] =
                    municipalityBoundaryLayers.Khobar;

            }


            L.control.layers(

                {

                    "OpenStreetMap":
                        osm

                },

                fallbackOverlays,

                {

                    collapsed:
                        false

                }

            ).addTo(
                map
            );

        }


        /*
           =================================================
           DEFAULT MUNICIPALITY BOUNDARIES
           =================================================
        */

        const defaultBoundaries = [

            municipalityBoundaryLayers.Dammam,

            municipalityBoundaryLayers.Dhahran,

            municipalityBoundaryLayers.Khobar

        ].filter(
            Boolean
        );


        defaultBoundaries.forEach(

            layer => {

                if (
                    !map.hasLayer(
                        layer
                    )
                ) {

                    layer.addTo(
                        map
                    );

                }

            }

        );


        /*
           =================================================
           DEFAULT DISTRICT LAYERS
           =================================================

           KEEPING OLD DISTRICT LAYERS.
        */

        showAllDistrictLayers();


        /*
           =================================================
           MAP EXTENT
           =================================================
        */

        if (
            defaultBoundaries.length
        ) {

            map.fitBounds(

                L.featureGroup(
                    defaultBoundaries
                ).getBounds(),

                {

                    padding:
                        [20,20]

                }

            );

        }

        else {

            map.setView(

                [26.35,50.10],

                10

            );

        }


        /*
           =================================================
           MAP READY
           =================================================
        */

        mapReady =
            true;


        /*
           =================================================
           PENDING GRAFANA DATA
           =================================================
        */

        if (
            pendingIncidentData
        ) {

            applyIncidentData(
                pendingIncidentData
            );


            pendingIncidentData =
                null;

        }

        else {

            showMunicipalityLevel();

        }


        /*
           =================================================
           SIZE FIX
           =================================================
        */

        setTimeout(

            () => {

                map.invalidateSize();

            },

            200

        );


        setTimeout(

            () => {

                map.invalidateSize();

            },

            1000

        );


        /*
           =================================================
           INFORM PARENT
           =================================================
        */

        window.parent.postMessage(

            {

                type:
                    "iframeReady"

            },

            "*"

        );

    }

)

.catch(

    error => {

        console.error(
            "Map initialization error:",
            error
        );

    }

);


/* =====================================================
   GRAFANA MESSAGE
   ===================================================== */

window.addEventListener(

    "message",

    function(event) {

        if (

            event.data?.type !==
            "incidentData"

        ) {

            return;

        }


        const rows =
            Array.isArray(
                event.data.data
            )
                ? event.data.data
                : [];


        console.log(
            "Received incident data:",
            rows
        );


        if (!mapReady) {

            pendingIncidentData =
                rows;

            return;

        }


        applyIncidentData(
            rows
        );

    }

);


/* =====================================================
   ERROR SAFETY
   ===================================================== */

window.addEventListener(

    "error",

    function(event) {

        console.error(

            "Map error:",

            event.error ||
            event.message

        );

    }

);


/* =====================================================
   RESIZE
   ===================================================== */

if (
    typeof ResizeObserver !==
    "undefined"
) {

    const resizeObserver =
        new ResizeObserver(

            function() {

                setTimeout(

                    () => {

                        map.invalidateSize();

                    },

                    50

                );

            }

        );


    resizeObserver.observe(

        document.getElementById(
            "map"
        )

    );

}


/* =====================================================
   FINAL SIZE
   ===================================================== */

setTimeout(

    function() {

        map.invalidateSize();

    },

    300

);

</script>
