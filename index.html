<script

<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const CITIES = [

    "Dammam",

    "Khobar",

    "Dhahran"

];


/* =========================================================
   CITY COLORS
   ========================================================= */

const CITY = {

    Dammam: {

        light: "#fca5a5",

        medium: "#ef4444",

        dark: "#b91c1c"

    },

    Khobar: {

        light: "#fde68a",

        medium: "#facc15",

        dark: "#ca8a04"

    },

    Dhahran: {

        light: "#a7d98c",

        medium: "#4d963e",

        dark: "#166534"

    }

};


/* =========================================================
   GROUP COLORS
   ========================================================= */

const GROUP = {

    "Group 1": CITY.Dammam,

    "Group 2": CITY.Khobar,

    "Group 3": CITY.Dhahran

};


/* =========================================================
   RISK COLORS
   ========================================================= */

const RISK = {

    High: CITY.Dammam,

    Medium: CITY.Khobar,

    Low: CITY.Dhahran

};


/* =========================================================
   MAP
   ========================================================= */

const map = L.map("map", {

    preferCanvas: false,

    zoomControl: true,

    maxZoom: 19

}).setView(

    [26.38,50.10],

    10

);


/* =========================================================
   SATELLITE
   ========================================================= */

const satellite = L.tileLayer(

    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

    {

        attribution: "Esri World Imagery",

        maxZoom: 19

    }

).addTo(map);


/* =========================================================
   ROADS
   ========================================================= */

const roads = L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        attribution: "OpenStreetMap contributors",

        opacity: .22,

        maxZoom: 19

    }

).addTo(map);


/* =========================================================
   LAYER CONTROL
   ========================================================= */

L.control.layers(

    {

        "Satellite": satellite,

        "OpenStreetMap":

            L.tileLayer(

                "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

                {

                    attribution:
                        "OpenStreetMap contributors",

                    maxZoom: 19

                }

            )

    },

    {

        "Roads + Labels": roads

    },

    {

        collapsed: true,

        position: "topright"

    }

).addTo(map);


/* =========================================================
   LAYERS
   ========================================================= */

let polygons =
    L.layerGroup().addTo(map);

let labels =
    L.layerGroup().addTo(map);

let incidentMarkers =
    L.layerGroup().addTo(map);


/* =========================================================
   STATE
   ========================================================= */

let level = 1;

let selectedCity = null;

let selectedGroup = null;


/* =========================================================
   DATA
   ========================================================= */

let DATA = {

    municipalities: {},

    districts: {

        Dammam: [],

        Khobar: [],

        Dhahran: []

    },

    incidentRows: [],

    municipalityTotals: {

        Dammam: 0,

        Khobar: 0,

        Dhahran: 0

    }

};


/* =========================================================
   PENDING GRAFANA DATA
   ========================================================= */

let pendingGrafanaData = null;

let mapReady = false;


/* =========================================================
   HELPERS
   ========================================================= */

function num(value) {

    const n = Number(value);

    return Number.isFinite(n)
        ? n
        : 0;

}


function fmt(value) {

    return num(value).toLocaleString();

}


function normalize(value) {

    return String(value ?? "")

        .trim()

        .replace(/\s+/g," ")

        .toLowerCase();

}


/* =========================================================
   CITY NAME DETECTION
   ========================================================= */

function cityName(value) {

    const s =
        normalize(value);


    if (

        s.includes("الدمام") ||

        s.includes("dammam")

    ) {

        return "Dammam";

    }


    if (

        s.includes("الخبر") ||

        s.includes("khobar")

    ) {

        return "Khobar";

    }


    if (

        s.includes("الظهران") ||

        s.includes("dhahran")

    ) {

        return "Dhahran";

    }


    return null;

}


/* =========================================================
   GET DISTRICT NAME FROM GEOJSON
   ========================================================= */

function getDistrictName(

    properties,

    index

) {

    const candidates = [

        "REMARKS",

        "NameEN",

        "NameEn",

        "NAME_EN",

        "name_en",

        "NAME",

        "name",

        "District",

        "DISTRICT",

        "district",

        "DISTRICT_NA",

        "District_Name"

    ];


    for (

        const field of candidates

    ) {

        if (

            properties &&

            properties[field] != null

        ) {

            const value =
                String(
                    properties[field]
                ).trim();


            if (value) {

                return value;

            }

        }

    }


    return "District " + (index + 1);

}


/* =========================================================
   CLEAR MAP
   ========================================================= */

function clearVisuals() {

    polygons.clearLayers();

    labels.clearLayers();

    incidentMarkers.clearLayers();

}


/* =========================================================
   HEADER
   ========================================================= */

function header(

    levelNumber,

    title

) {

    document.getElementById(
        "level"
    ).textContent =
        "LEVEL " + levelNumber;


    document.getElementById(
        "title"
    ).textContent =
        title;

}


/* =========================================================
   INFO
   ========================================================= */

function info(text) {

    document.getElementById(
        "info"
    ).innerHTML =
        "ⓘ&nbsp;&nbsp;" + text;

}


/* =========================================================
   BACK BUTTON
   ========================================================= */

function showBack(show) {

    document.getElementById(
        "back"
    ).style.display =
        show ? "block" : "none";

}


/* =========================================================
   DATA STATUS
   ========================================================= */

function dataStatus(text) {

    document.getElementById(
        "dataStatus"
    ).textContent =
        text;

}


/* =========================================================
   POINT IN RING
   ========================================================= */

function pointInRing(

    lat,

    lng,

    ring

) {

    if (

        !ring ||

        ring.length < 3

    ) {

        return false;

    }


    let inside = false;


    for (

        let i = 0,
            j = ring.length - 1;

        i < ring.length;

        j = i++

    ) {

        const lngI =
            Number(ring[i][0]);

        const latI =
            Number(ring[i][1]);

        const lngJ =
            Number(ring[j][0]);

        const latJ =
            Number(ring[j][1]);


        const intersect =

            ((latI > lat) !== (latJ > lat))

            &&

            (

                lng <

                (

                    (lngJ - lngI) *

                    (lat - latI) /

                    ((latJ - latI) || 1e-12)

                ) + lngI

            );


        if (intersect) {

            inside = !inside;

        }

    }


    return inside;

}


/* =========================================================
   POINT IN POLYGON
   ========================================================= */

function pointInPolygon(

    lat,

    lng,

    coordinates

) {

    if (

        !coordinates ||

        !coordinates.length

    ) {

        return false;

    }


    if (

        !pointInRing(

            lat,

            lng,

            coordinates[0]

        )

    ) {

        return false;

    }


    /*
       Polygon holes
    */

    for (

        let i = 1;

        i < coordinates.length;

        i++

    ) {

        if (

            pointInRing(

                lat,

                lng,

                coordinates[i]

            )

        ) {

            return false;

        }

    }


    return true;

}


/* =========================================================
   POINT IN GEOMETRY
   ========================================================= */

function pointInGeometry(

    lat,

    lng,

    geometry

) {

    if (

        !geometry ||

        !geometry.coordinates

    ) {

        return false;

    }


    if (

        geometry.type === "Polygon"

    ) {

        return pointInPolygon(

            lat,

            lng,

            geometry.coordinates

        );

    }


    if (

        geometry.type === "MultiPolygon"

    ) {

        return geometry.coordinates.some(

            polygon =>

                pointInPolygon(

                    lat,

                    lng,

                    polygon

                )

        );

    }


    return false;

}


/* =========================================================
   DISTANCE
   ========================================================= */

function distanceKm(

    lat1,

    lng1,

    lat2,

    lng2

) {

    const R = 6371;


    const dLat =

        (lat2-lat1) *

        Math.PI / 180;


    const dLng =

        (lng2-lng1) *

        Math.PI / 180;


    const a =

        Math.sin(dLat/2) ** 2 +

        Math.cos(
            lat1 * Math.PI / 180
        ) *

        Math.cos(
            lat2 * Math.PI / 180
        ) *

        Math.sin(dLng/2) ** 2;


    return 2 *

        R *

        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(1-a)

        );

}


/* =========================================================
   RESOLVE MUNICIPALITY
   ========================================================= */

function resolveMunicipality(

    lat,

    lng

) {

    if (

        !Number.isFinite(lat) ||

        !Number.isFinite(lng)

    ) {

        return null;

    }


    /*
       First: actual municipality polygon.
    */

    for (

        const city of CITIES

    ) {

        const geo =
            DATA.municipalities[city];


        if (!geo) {

            continue;

        }


        if (

            pointInGeometry(

                lat,

                lng,

                geo

            )

        ) {

            return city;

        }

    }


    /*
       Fallback: nearest municipality.
    */

    let nearest = null;

    let nearestDistance = Infinity;


    CITIES.forEach(

        city => {

            const geo =
                DATA.municipalities[city];


            if (!geo) {

                return;

            }


            const center =

                L.geoJSON(geo)

                    .getBounds()

                    .getCenter();


            const d =

                distanceKm(

                    lat,

                    lng,

                    center.lat,

                    center.lng

                );


            if (

                d < nearestDistance

            ) {

                nearestDistance = d;

                nearest = city;

            }

        }

    );


    return nearest;

}


/* =========================================================
   GET RISK
   ========================================================= */

function calculateRisk(

    count,

    values

) {

    count = num(count);


    if (

        count <= 0

    ) {

        return {

            name: "Low",

            palette: CITY.Dhahran

        };

    }


    if (!values.length) {

        return {

            name: "Low",

            palette: CITY.Dhahran

        };

    }


    const sorted =
        values
            .map(num)
            .sort(
                (a,b) => a-b
            );


    const lowIndex =
        Math.floor(
            (sorted.length-1) * .33
        );


    const highIndex =
        Math.floor(
            (sorted.length-1) * .66
        );


    const low =
        sorted[lowIndex];


    const high =
        sorted[highIndex];


    if (

        count >= high

    ) {

        return {

            name: "High",

            palette: CITY.Dammam

        };

    }


    if (

        count >= low

    ) {

        return {

            name: "Medium",

            palette: CITY.Khobar

        };

    }


    return {

        name: "Low",

        palette: CITY.Dhahran

    };

}


/* =========================================================
   GRADIENT
   ========================================================= */

function makeGradient(

    id,

    palette,

    intensity = .65

) {

    const svg =

        document.querySelector(
            "#map svg.leaflet-zoom-animated"
        );


    if (!svg) {

        return;

    }


    let defs =
        svg.querySelector("defs");


    if (!defs) {

        defs =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "defs"
            );


        svg.insertBefore(
            defs,
            svg.firstChild
        );

    }


    const old =
        document.getElementById(id);


    if (old) {

        old.remove();

    }


    const gradient =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "radialGradient"
        );


    gradient.setAttribute(
        "id",
        id
    );


    gradient.setAttribute(
        "cx",
        "50%"
    );


    gradient.setAttribute(
        "cy",
        "50%"
    );


    gradient.setAttribute(
        "r",
        "82%"
    );


    intensity =
        Math.max(
            0,
            Math.min(
                1,
                num(intensity)
            )
        );


    const core =
        Math.round(
            18 + 28 * intensity
        );


    const s2 =
        Math.min(
            60,
            core + 13
        );


    const s3 =
        Math.min(
            76,
            s2 + 10
        );


    const s4 =
        Math.min(
            90,
            s3 + 10
        );


    gradient.innerHTML =

        `<stop
            offset="0%"
            stop-color="${palette.dark}"
            stop-opacity=".97"
        ></stop>

        <stop
            offset="${core}%"
            stop-color="${palette.dark}"
            stop-opacity=".93"
        ></stop>

        <stop
            offset="${s2}%"
            stop-color="${palette.medium}"
            stop-opacity=".89"
        ></stop>

        <stop
            offset="${s3}%"
            stop-color="${palette.medium}"
            stop-opacity=".80"
        ></stop>

        <stop
            offset="${s4}%"
            stop-color="${palette.light}"
            stop-opacity=".72"
        ></stop>

        <stop
            offset="100%"
            stop-color="${palette.light}"
            stop-opacity=".64"
        ></stop>`;


    defs.appendChild(
        gradient
    );

}


/* =========================================================
   APPLY GRADIENT
   ========================================================= */

function applyGradient(

    layer,

    id

) {

    function paint() {

        if (

            !layer ||

            !layer.eachLayer

        ) {

            return;

        }


        layer.eachLayer(

            function(p) {

                if (

                    p &&

                    p._path

                ) {

                    p._path.style.fill =
                        `url(#${id})`;

                    p._path.style.fillOpacity =
                        "1";

                }

            }

        );

    }


    paint();

    setTimeout(
        paint,
        80
    );

    setTimeout(
        paint,
        250
    );

    setTimeout(
        paint,
        600
    );

}


/* =========================================================
   FIT MAP
   ========================================================= */

function fitLayers(

    layerGroup,

    maxZoom

) {

    const layers =
        layerGroup.getLayers();


    if (!layers.length) {

        return;

    }


    const featureGroup =
        L.featureGroup(
            layers
        );


    const bounds =
        featureGroup.getBounds();


    if (

        bounds.isValid()

    ) {

        map.fitBounds(

            bounds,

            {

                padding: [
                    45,
                    45
                ],

                maxZoom:
                    maxZoom

            }

        );

    }

}


/* =========================================================
   GROUPING
   =========================================================

   Uses the same deterministic spatial/angle logic from
   your original working 3-level UI.

   IMPORTANT:
   These groups contain ACTUAL SQL rows.
   No dummy counts are generated.
   ========================================================= */

function groupsOf(rows) {

    if (!rows.length) {

        return [
            [],
            [],
            []
        ];

    }


    const clat =

        rows.reduce(

            (sum,row) =>

                sum + num(row.lat),

            0

        ) / rows.length;


    const clng =

        rows.reduce(

            (sum,row) =>

                sum + num(row.lng),

            0

        ) / rows.length;


    const ordered =

        rows
            .slice()
            .sort(

                function(a,b) {

                    return (

                        Math.atan2(

                            a.lat-clat,

                            a.lng-clng

                        )

                        -

                        Math.atan2(

                            b.lat-clat,

                            b.lng-clng

                        )

                    );

                }

            );


    const n =
        ordered.length;


    const base =
        Math.floor(n/3);


    const remainder =
        n % 3;


    const sizes = [

        base + (remainder > 0 ? 1 : 0),

        base + (remainder > 1 ? 1 : 0),

        base

    ];


    const output = [];


    let start = 0;


    for (

        let i = 0;

        i < 3;

        i++

    ) {

        output.push(

            ordered.slice(

                start,

                start + sizes[i]

            )

        );


        start += sizes[i];

    }


    return output;

}


/* =========================================================
   CREATE INCIDENT CIRCLE
   ========================================================= */

function createIncidentMarker(

    row,

    globalMax,

    riskValues

) {

    const count =
        num(row.count);


    const risk =
        calculateRisk(
            count,
            riskValues
        );


    let ratio = 0;


    if (globalMax > 0) {

        ratio =
            Math.sqrt(
                count / globalMax
            );

    }


    const size =
        Math.round(
            30 +
            30 * ratio
        );


    const fontSize =
        size >= 48
            ? 13
            : size >= 38
                ? 12
                : 11;


    let className =
        "circle-low";


    if (
        risk.name === "High"
    ) {

        className =
            "circle-high";

    }
    else if (
        risk.name === "Medium"
    ) {

        className =
            "circle-medium";

    }


    const icon =
        L.divIcon({

            className:
                "incident-marker",

            html:

                `<div
                    class="incident-circle ${className}"
                    style="
                        width:${size}px;
                        height:${size}px;
                        font-size:${fontSize}px;
                    "
                >
                    ${fmt(count)}
                </div>`,

            iconSize:
                [
                    size,
                    size
                ],

            iconAnchor:
                [
                    size/2,
                    size/2
                ]

        });


    const marker =
        L.marker(

            [
                row.lat,
                row.lng
            ],

            {

                icon: icon,

                zIndexOffset: 1200

            }

        );


    marker.bindTooltip(

        `<b>Location:</b> ${row.name}
         <br><b>Municipality:</b> ${row.city || "Unknown"}
         <br><b>Incidents:</b> ${fmt(count)}
         <br><b>Risk:</b> ${risk.name}
         <br><b>Latitude:</b> ${row.lat.toFixed(6)}
         <br><b>Longitude:</b> ${row.lng.toFixed(6)}`,

        {

            sticky: true,

            direction: "top",

            opacity: .96

        }

    );


    marker.on(

        "click",

        function() {

            window.parent.postMessage(

                {

                    type:
                        "mapClick",

                    state:
                        row.name,

                    municipality:
                        row.city,

                    count:
                        count,

                    lat:
                        row.lat,

                    long:
                        row.lng

                },

                "*"

            );

        }

    );


    return marker;

}


/* =========================================================
   LEVEL 1
   ========================================================= */

function showLevel1() {

    level = 1;

    selectedCity = null;

    selectedGroup = null;


    clearVisuals();


    header(

        1,

        "Municipalities Overview"

    );


    showBack(false);


    info(

        "Click on any Municipality to view Groups (Level 2)"

    );


    const totals =

        CITIES.map(

            city =>

                num(
                    DATA.municipalityTotals[city]
                )

        );


    const min =
        Math.min(...totals);


    const max =
        Math.max(...totals);


    CITIES.forEach(

        function(city) {

            const geometry =
                DATA.municipalities[city];


            if (!geometry) {

                return;

            }


            const total =
                num(
                    DATA.municipalityTotals[city]
                );


            const palette =
                CITY[city];


            const intensity =

                max === min

                    ? .65

                    : (

                        total - min

                    ) / (

                        max - min

                    );


            const gradientId =

                "municipalityGradient_" +

                city;


            makeGradient(

                gradientId,

                palette,

                intensity

            );


            const layer =

                L.geoJSON(

                    geometry,

                    {

                        style: {

                            color: "#fff",

                            weight: 3,

                            opacity: 1,

                            fillColor:
                                palette.medium,

                            fillOpacity: .82

                        },

                        onEachFeature:

                            function(

                                feature,

                                polygon

                            ) {

                                polygon.bindTooltip(

                                    `<b>Municipality:</b> ${city}
                                     <br><b>Total Incidents:</b> ${fmt(total)}
                                     <br><br><b>Click to divide into 3 groups</b>`,

                                    {

                                        sticky: true

                                    }

                                );


                                polygon.on(

                                    "mouseover",

                                    function() {

                                        polygon.setStyle({

                                            weight: 5,

                                            fillOpacity: .94

                                        });

                                    }

                                );


                                polygon.on(

                                    "mouseout",

                                    function() {

                                        polygon.setStyle({

                                            weight: 3,

                                            fillOpacity: .82

                                        });

                                    }

                                );


                                polygon.on(

                                    "click",

                                    function() {

                                        showLevel2(
                                            city
                                        );

                                    }

                                );

                            }

                    }

                ).addTo(polygons);


            applyGradient(

                layer,

                gradientId

            );


            const center =

                layer

                    .getBounds()

                    .getCenter();


            L.marker(

                center,

                {

                    interactive: false,

                    icon:

                        L.divIcon({

                            className: "",

                            html:

                                `<div class="number-label">
                                    ${fmt(total)}
                                </div>`,

                            iconSize:
                                [
                                    120,
                                    32
                                ],

                            iconAnchor:
                                [
                                    60,
                                    16
                                ]

                        })

                }

            ).addTo(labels);

        }

    );


    /*
       Also display the actual SQL locations at Level 1.
       They remain behind the municipality number labels.
    */

    drawIncidentMarkers(

        DATA.incidentRows,

        1

    );


    fitLayers(

        polygons,

        10

    );

}


/* =========================================================
   DRAW INCIDENT MARKERS
   ========================================================= */

function drawIncidentMarkers(

    rows,

    currentLevel

) {

    if (!rows.length) {

        return;

    }


    const valid =
        rows.filter(

            row =>

                Number.isFinite(row.lat) &&

                Number.isFinite(row.lng)

        );


    if (!valid.length) {

        return;

    }


    const globalMax =
        Math.max(

            ...valid.map(
                row => num(row.count)
            )

        );


    const riskValues =
        valid.map(

            row => num(row.count)

        );


    valid.forEach(

        row => {

            /*
               At Level 1 we use smaller bubbles so the
               municipality number remains visually dominant.
            */

            const marker =

                createIncidentMarker(

                    row,

                    globalMax,

                    riskValues

                );


            marker.addTo(
                incidentMarkers
            );

        }

    );

}


/* =========================================================
   LEVEL 2
   ========================================================= */

function showLevel2(

    city

) {

    level = 2;

    selectedCity = city;

    selectedGroup = null;


    clearVisuals();


    header(

        2,

        "Groups - " + city

    );


    showBack(true);


    info(

        "Click on any Group to view Locations / Districts (Level 3)"

    );


    const rows =

        (

            DATA.districts[city] ||

            []

        ).filter(

            row =>

                Number.isFinite(row.lat) &&

                Number.isFinite(row.lng)

        );


    const groups =
        groupsOf(rows);


    groups.forEach(

        function(group,index) {

            if (!group.length) {

                return;

            }


            const groupName =
                "Group " + (index+1);


            const palette =
                GROUP[groupName];


            const total =

                group.reduce(

                    (sum,row) =>

                        sum + num(row.count),

                    0

                );


            const groupTotals =

                groups.map(

                    g =>

                        g.reduce(

                            (sum,row) =>

                                sum + num(row.count),

                            0

                        )

                );


            const min =
                Math.min(
                    ...groupTotals
                );


            const max =
                Math.max(
                    ...groupTotals
                );


            const intensity =

                max === min

                    ? .65

                    : (

                        total - min

                    ) / (

                        max - min

                    );


            const gradientId =

                "groupGradient_" +

                city.replace(/\s/g,"_") +

                "_" +

                (index+1);


            makeGradient(

                gradientId,

                palette,

                intensity

            );


            /*
               Draw actual district/location circles.
            */

            group.forEach(

                function(row) {

                    if (

                        !Number.isFinite(row.lat) ||

                        !Number.isFinite(row.lng)

                    ) {

                        return;

                    }


                    const marker =

                        createIncidentMarker(

                            row,

                            Math.max(

                                ...rows.map(
                                    r => num(r.count)
                                )

                            ),

                            rows.map(
                                r => num(r.count)
                            )

                        );


                    marker.on(

                        "click",

                        function() {

                            showLevel3(

                                city,

                                groupName,

                                group

                            );

                        }

                    );


                    marker.addTo(
                        incidentMarkers
                    );

                }

            );


            /*
               Group center.
            */

            const lat =

                group.reduce(

                    (sum,row) =>

                        sum + row.lat,

                    0

                ) / group.length;


            const lng =

                group.reduce(

                    (sum,row) =>

                        sum + row.lng,

                    0

                ) / group.length;


            /*
               Group number.
            */

            L.marker(

                [lat,lng],

                {

                    interactive: false,

                    icon:

                        L.divIcon({

                            className: "",

                            html:

                                `<div class="number-label">
                                    ${fmt(total)}
                                </div>`,

                            iconSize:
                                [
                                    120,
                                    32
                                ],

                            iconAnchor:
                                [
                                    60,
                                    16
                                ]

                        })

                }

            ).addTo(labels);

        }

    );


    /*
       If there is no SQL data for this municipality,
       still show the municipality boundary.
    */

    const geometry =
        DATA.municipalities[city];


    if (geometry) {

        const boundary =
            L.geoJSON(

                geometry,

                {

                    style: {

                        color: "#fff",

                        weight: 3,

                        fillColor:
                            CITY[city].medium,

                        fillOpacity: .12

                    }

                }

            ).addTo(polygons);


        const total =
            DATA.municipalityTotals[city];


        boundary.bindTooltip(

            `<b>${city}</b>
             <br><b>Total Incidents:</b> ${fmt(total)}`,

            {

                sticky: true

            }

        );

    }


    /*
       Fit to actual group data if available.
    */

    if (rows.length) {

        const points =

            rows.map(

                row =>

                    L.marker(
                        [
                            row.lat,
                            row.lng
                        ]
                    )

            );


        const group =
            L.featureGroup(points);


        map.fitBounds(

            group.getBounds(),

            {

                padding: [
                    60,
                    60
                ],

                maxZoom: 13

            }

        );

    }
    else if (geometry) {

        fitLayers(

            polygons,

            13

        );

    }

}


/* =========================================================
   LEVEL 3
   ========================================================= */

function showLevel3(

    city,

    groupName,

    group

) {

    level = 3;

    selectedCity = city;

    selectedGroup = groupName;


    clearVisuals();


    header(

        3,

        "Locations - " +

        city +

        " / " +

        groupName

    );


    showBack(true);


    const total =

        group.reduce(

            (sum,row) =>

                sum + num(row.count),

            0

        );


    info(

        "Actual SQL Incident Count: " +

        fmt(total)

    );


    const values =

        group.map(

            row => num(row.count)

        );


    const globalMax =
        Math.max(
            ...values,
            0
        );


    /*
       Display every SQL location as a circle.
    */

    group.forEach(

        function(row) {

            if (

                !Number.isFinite(row.lat) ||

                !Number.isFinite(row.lng)

            ) {

                return;

            }


            const marker =

                createIncidentMarker(

                    row,

                    globalMax,

                    values

                );


            marker.addTo(
                incidentMarkers
            );

        }

    );


    /*
       Draw matching district GeoJSON polygons where
       possible.

       SQL location names are matched to GeoJSON names.
    */

    const geoRows =

        DATA.geoDistricts[city] || [];


    const matchedGeo = new Set();


    group.forEach(

        function(row) {

            const target =
                normalize(row.name);


            const match =

                geoRows.find(

                    geo =>

                        normalize(geo.name) ===
                        target

                );


            if (!match) {

                return;

            }


            matchedGeo.add(
                match.name
            );


            const risk =
                calculateRisk(
                    row.count,
                    values
                );


            const palette =
                risk.palette;


            const layer =

                L.geoJSON(

                    match.geometry,

                    {

                        style: {

                            color: "#fff",

                            weight: 1.7,

                            opacity: 1,

                            fillColor:
                                palette.medium,

                            fillOpacity: .22

                        }

                    }

                ).addTo(polygons);


            layer.bindTooltip(

                `<b>${row.name}</b>
                 <br><b>Municipality:</b> ${city}
                 <br><b>Incidents:</b> ${fmt(row.count)}
                 <br><b>Risk:</b> ${risk.name}`,

                {

                    sticky: true

                }

            );


            layer.on(

                "mouseover",

                function() {

                    layer.setStyle({

                        weight: 3,

                        fillOpacity: .40

                    });

                }

            );


            layer.on(

                "mouseout",

                function() {

                    layer.setStyle({

                        weight: 1.7,

                        fillOpacity: .22

                    });

                }

            );


            layer.on(

                "click",

                function() {

                    window.parent.postMessage(

                        {

                            type:
                                "mapClick",

                            state:
                                row.name,

                            municipality:
                                city,

                            group:
                                groupName,

                            count:
                                row.count,

                            lat:
                                row.lat,

                            long:
                                row.lng

                        },

                        "*"

                    );

                }

            );

        }

    );


    /*
       Show count at the actual SQL coordinate.
    */

    group.forEach(

        function(row) {

            if (

                !Number.isFinite(row.lat) ||

                !Number.isFinite(row.lng)

            ) {

                return;

            }


            L.marker(

                [
                    row.lat,
                    row.lng
                ],

                {

                    interactive: false,

                    icon:

                        L.divIcon({

                            className: "",

                            html:

                                `<div class="district-number">
                                    ${fmt(row.count)}
                                </div>`,

                            iconSize:
                                [
                                    105,
                                    28
                                ],

                            iconAnchor:
                                [
                                    52,
                                    14
                                ]

                        })

                }

            ).addTo(labels);

        }

    );


    /*
       Fit to actual SQL coordinates.
    */

    const valid =

        group.filter(

            row =>

                Number.isFinite(row.lat) &&

                Number.isFinite(row.lng)

        );


    if (valid.length) {

        const pointLayers =

            valid.map(

                row =>

                    L.marker(

                        [
                            row.lat,
                            row.lng
                        ]

                    )

            );


        map.fitBounds(

            L.featureGroup(
                pointLayers
            ).getBounds(),

            {

                padding: [
                    70,
                    70
                ],

                maxZoom: 14

            }

        );

    }

}


/* =========================================================
   BUILD MUNICIPALITY GEOJSON
   ========================================================= */

function processMunicipalityGeoJSON(

    data

) {

    DATA.municipalities = {};


    const features =
        data.features || [];


    features.forEach(

        function(feature) {

            const city =

                cityName(

                    feature.properties?.REMARKS

                    ||

                    feature.properties?.NameEN

                    ||

                    feature.properties?.NameEn

                    ||

                    feature.properties?.NAME

                    ||

                    feature.properties?.name

                );


            if (

                !city ||

                !feature.geometry

            ) {

                return;

            }


            if (

                !DATA.municipalities[city]

            ) {

                DATA.municipalities[city] = {

                    type:
                        "FeatureCollection",

                    features: []

                };

            }


            DATA.municipalities[city]
                .features
                .push(feature);

        }

    );


    /*
       Fallback if names in REMARKS don't map.
    */

    const missing =

        CITIES.filter(

            city =>

                !DATA.municipalities[city]

        );


    if (missing.length) {

        const available =

            features.filter(

                feature =>

                    feature.geometry

            );


        missing.forEach(

            function(city,index) {

                if (!available[index]) {

                    return;

                }


                DATA.municipalities[city] = {

                    type:
                        "FeatureCollection",

                    features: [
                        available[index]
                    ]

                };

            }

        );

    }

}


/* =========================================================
   PROCESS DISTRICT GEOJSON
   ========================================================= */

function processDistrictGeoJSON(

    data,

    city

) {

    if (!DATA.geoDistricts) {

        DATA.geoDistricts = {};

    }


    DATA.geoDistricts[city] = [];


    const features =
        data.features || [];


    features.forEach(

        function(feature,index) {

            if (!feature.geometry) {

                return;

            }


            const name =

                getDistrictName(

                    feature.properties || {},

                    index

                );


            DATA.geoDistricts[city].push({

                name:
                    name,

                geometry:
                    feature.geometry

            });

        }

    );

}


/* =========================================================
   APPLY GRAFANA DATA
   =========================================================

   THIS IS THE MAIN FIX.

   Expected SQL:

       state
       count
       lat
       long

   Also supports:

       LocationName
       TotalCount
       Lat
       Longitude
   ========================================================= */

function applyGrafanaData(

    rows

) {

    console.log(
        "Applying Grafana data:",
        rows
    );


    if (!Array.isArray(rows)) {

        console.warn(
            "Grafana data is not an array:",
            rows
        );

        return;

    }


    /*
       Reset previous SQL data.
    */

    DATA.incidentRows = [];


    DATA.districts = {

        Dammam: [],

        Khobar: [],

        Dhahran: []

    };


    DATA.municipalityTotals = {

        Dammam: 0,

        Khobar: 0,

        Dhahran: 0

    };


    /*
       Read SQL rows.
    */

    rows.forEach(

        function(row,index) {

            /*
               Support both alias styles.
            */

            const name =

                String(

                    row.state ??

                    row.LocationName ??

                    ""

                ).trim();


            const count =

                Number(

                    row.count ??

                    row.TotalCount ??

                    0

                );


            const lat =

                Number(

                    row.lat ??

                    row.Lat ??

                    0

                );


            const lng =

                Number(

                    row.long ??

                    row.Longitude ??

                    0

                );


            if (!name) {

                console.warn(
                    "Skipping row without location name:",
                    row
                );

                return;

            }


            if (!Number.isFinite(count)) {

                console.warn(
                    "Skipping row with invalid count:",
                    row
                );

                return;

            }


            if (

                !Number.isFinite(lat) ||

                !Number.isFinite(lng)

            ) {

                console.warn(
                    "Location has no valid coordinates:",
                    row
                );

                return;

            }


            /*
               Resolve municipality using actual
               municipality polygons.
            */

            const city =

                resolveMunicipality(

                    lat,

                    lng

                );


            const item = {

                id:
                    "sql_" + index,

                name:
                    name,

                count:
                    count,

                lat:
                    lat,

                lng:
                    lng,

                city:
                    city

            };


            DATA.incidentRows.push(
                item
            );


            /*
               Add to municipality total.
            */

            if (

                city &&

                DATA.municipalityTotals[city]
                    !== undefined

            ) {

                DATA.municipalityTotals[city]
                    += count;


                DATA.districts[city]
                    .push(item);

            }


            console.log(
                "SQL location:",
                name,
                "count:",
                count,
                "lat:",
                lat,
                "lng:",
                lng,
                "municipality:",
                city
            );

        }

    );


    /*
       Update status.
    */

    dataStatus(

        "SQL data: " +

        DATA.incidentRows.length +

        " locations | " +

        "Total incidents: " +

        fmt(

            DATA.incidentRows.reduce(

                (sum,row) =>

                    sum + row.count,

                0

            )

        )

    );


    console.log(
        "FINAL DATA:",
        DATA
    );


    /*
       Refresh current screen.
    */

    if (level === 1) {

        showLevel1();

    }

    else if (

        level === 2 &&

        selectedCity

    ) {

        showLevel2(

            selectedCity

        );

    }

    else if (

        level === 3 &&

        selectedCity &&

        selectedGroup

    ) {

        const groups =

            groupsOf(

                DATA.districts[
                    selectedCity
                ] || []

            );


        const index =

            Number(

                selectedGroup
                    .replace(
                        "Group ",
                        ""
                    )

            ) - 1;


        showLevel3(

            selectedCity,

            selectedGroup,

            groups[index] || []

        );

    }

}


/* =========================================================
   GRAFANA MESSAGE RECEIVER
   =========================================================

   Grafana / HTML panel should send:

   window.parent.postMessage({

       type: "incidentData",

       data: rows

   }, "*");

   ========================================================= */

window.addEventListener(

    "message",

    function(event) {

        if (!event.data) {

            return;

        }


        if (

            event.data.type !==
            "incidentData"

        ) {

            return;

        }


        console.log(
            "Received incidentData from Grafana:",
            event.data.data
        );


        const rows =

            event.data.data || [];


        /*
           Grafana can send data before GeoJSON
           finishes loading.
        */

        if (!mapReady) {

            pendingGrafanaData =
                rows;

            return;

        }


        applyGrafanaData(

            rows

        );

    }

);

/* =========================================================
   LOAD JSON
   ========================================================= */

async function loadJSON(path) {

    const response =
        await fetch(path);


    if (!response.ok) {

        throw new Error(

            path +

            " -> HTTP " +

            response.status

        );

    }


    return response.json();

}


/* =========================================================
   LOAD ALL GEOJSON
   ========================================================= */

async function loadData() {

    try {

        /*
           Municipality.
        */

        const municipalityData =

            await loadJSON(
                "./municipality.geojson"
            );


        processMunicipalityGeoJSON(

            municipalityData

        );


        /*
           Districts.
        */

        const dammamData =

            await loadJSON(
                "./dammam.geojson"
            );


        const khobarData =

            await loadJSON(
                "./khobar.geojson"
            );


        const dhahranData =

            await loadJSON(
                "./dhahran.geojson"
            );


        processDistrictGeoJSON(

            dammamData,

            "Dammam"

        );


        processDistrictGeoJSON(

            khobarData,

            "Khobar"

        );


        processDistrictGeoJSON(

            dhahranData,

            "Dhahran"

        );


        console.log(
            "Municipalities:",
            DATA.municipalities
        );


        console.log(
            "District GeoJSON:",
            DATA.geoDistricts
        );


        /*
           Hide loading.
        */

        document.getElementById(
            "loading"
        ).style.display =
            "none";


        /*
           Map is now ready to accept Grafana data.
        */

        mapReady = true;


        /*
           If Grafana sent data before GeoJSON
           completed, process it now.
        */

        if (

            pendingGrafanaData

        ) {

            applyGrafanaData(

                pendingGrafanaData

            );


            pendingGrafanaData =
                null;

        }

        else {

            /*
               No SQL data yet.
            */

            showLevel1();

        }


        /*
           Tell Grafana iframe is ready.
        */

        window.parent.postMessage(

            {

                type:
                    "iframeReady"

            },

            "*"

        );


        setTimeout(

            function() {

                map.invalidateSize(
                    true
                );

            },

            300

        );


        console.log(
            "3-level incident map ready."
        );

    }

    catch(error) {

        console.error(
            "MAP LOAD ERROR:",
            error
        );


        document.getElementById(
            "loading"
        ).innerHTML =

            "Map data could not be loaded.<br><br>" +

            "<small>" +

            error.message +

            "<br><br>" +

            "Required files:<br>" +

            "municipality.geojson<br>" +

            "dammam.geojson<br>" +

            "khobar.geojson<br>" +

            "dhahran.geojson" +

            "</small>";

    }

}


/* =========================================================
   START
   ========================================================= */

loadData();

</script>

</body>

</html>
