<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Municipality Incident Heat Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
#map{width:100%;height:100vh;background:#dbeafe}
.leaflet-container{background:#dbeafe}
.map-title{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:2000;background:rgba(255,255,255,.94);border:1px solid #444;border-radius:8px;padding:7px 18px;font-size:15px;font-weight:800;color:#111;box-shadow:0 2px 8px rgba(0,0,0,.18);pointer-events:none;white-space:nowrap}
.map-info{position:absolute;top:54px;left:50%;transform:translateX(-50%);z-index:2000;background:rgba(255,255,255,.90);border-radius:7px;padding:5px 12px;font-size:12px;color:#222;pointer-events:none;white-space:nowrap}
.back-btn{position:absolute;top:12px;left:12px;z-index:2000;background:#fff;border:1px solid #555;border-radius:7px;padding:8px 12px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18);display:none}
.back-btn:hover{background:#f4f4f4}
.legend{position:absolute;bottom:14px;left:14px;z-index:2000;background:rgba(255,255,255,.95);border:1px solid #555;border-radius:8px;padding:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:12px;min-width:125px}
.legend-title{font-weight:800;font-size:13px;text-align:center;margin-bottom:7px}
.legend-row{display:flex;align-items:center;gap:7px;margin:5px 0}
.swatch{width:18px;height:18px;border-radius:3px;display:inline-block}
.city-label{background:rgba(255,255,255,.92);border:1px solid rgba(60,60,60,.65);border-radius:5px;padding:3px 7px;font-weight:800;font-size:12px;color:#111;white-space:nowrap}
.area-label{background:rgba(255,255,255,.88);border:1px solid rgba(40,40,40,.55);border-radius:4px;padding:2px 6px;font-weight:800;font-size:11px;color:#111;white-space:nowrap}
.leaflet-tooltip.custom{background:rgba(255,255,255,.97);border:1px solid #333;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.22);color:#111;padding:6px 8px;font-size:12px;line-height:1.45}
.heat-canvas{pointer-events:none}
@media(max-width:600px){.map-title{font-size:12px;padding:6px 10px}.map-info{font-size:10px;top:49px}.legend{font-size:11px;min-width:110px}.back-btn{font-size:12px;padding:7px 9px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="map-title">Municipality Incident Heat Map</div>
<div id="map-info" class="map-info">🟢 Low &nbsp; 🟡 Medium &nbsp; 🔴 High &nbsp; | &nbsp; Click a municipality</div>
<button id="backBtn" class="back-btn" type="button">← Back</button>
<div class="legend">
  <div class="legend-title">Incident Risk</div>
  <div class="legend-row"><span class="swatch" style="background:#16a34a"></span><span>Low</span></div>
  <div class="legend-row"><span class="swatch" style="background:#facc15"></span><span>Medium</span></div>
  <div class="legend-row"><span class="swatch" style="background:#dc2626"></span><span>High</span></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  'use strict';

  const CITIES = ['Dammam','Dhahran','Khobar'];
  const AREA_COLORS = ['#2e8b57','#e6b800','#d64545','#3b82c4','#8b5cf6'];

  const map = L.map('map',{zoomControl:true,maxZoom:19}).setView([26.42,50.10],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'&copy; OpenStreetMap contributors', maxZoom:19
  }).addTo(map);

  const municipalityFeatures = {Dammam:[],Dhahran:[],Khobar:[]};
  const municipalityLayers = {};
  const municipalityCenters = {};
  const districtFeatures = {Dammam:[],Dhahran:[],Khobar:[]};
  const districtLookup = {};
  const districtRows = {Dammam:[],Dhahran:[],Khobar:[]};
  const municipalityTotals = {Dammam:0,Dhahran:0,Khobar:0};

  let allRows = [];
  let drillLevel = 0;
  let selectedCity = null;
  let selectedArea = null;
  let areaModels = null;
  let districtLayer = null;
  let heatLayer = null;
  let labelLayer = L.layerGroup().addTo(map);
  let municipalityOutlineLayer = L.layerGroup().addTo(map);

  const $ = id => document.getElementById(id);
  const info = text => { $('map-info').innerHTML = text; };

  function norm(v){
    return String(v ?? '').trim().replace(/\s+/g,' ').toLowerCase().replace(/[‐-‒–—―]/g,'-');
  }
  function normAr(v){
    return norm(v).replace(/[\u064B-\u065F\u0670]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
  }
  function key(v){ return normAr(v); }

  function pointInRing(lat,lng,ring){
    if(!ring || ring.length<3) return false;
    let inside=false;
    for(let i=0,j=ring.length-1;i<ring.length;j=i++){
      const xi=Number(ring[i][0]), yi=Number(ring[i][1]);
      const xj=Number(ring[j][0]), yj=Number(ring[j][1]);
      const hit=((yi>lat)!=(yj>lat)) && (lng < (xj-xi)*(lat-yi)/((yj-yi)||1e-12)+xi);
      if(hit) inside=!inside;
    }
    return inside;
  }
  function pointInPolygon(lat,lng,coords){
    if(!coords || !coords.length || !pointInRing(lat,lng,coords[0])) return false;
    for(let i=1;i<coords.length;i++) if(pointInRing(lat,lng,coords[i])) return false;
    return true;
  }
  function pointInGeometry(lat,lng,g){
    if(!g || !g.coordinates) return false;
    if(g.type==='Polygon') return pointInPolygon(lat,lng,g.coordinates);
    if(g.type==='MultiPolygon') return g.coordinates.some(p=>pointInPolygon(lat,lng,p));
    return false;
  }
  function featureCenter(feature){
    try { return L.geoJSON(feature).getBounds().getCenter(); } catch(e){ return null; }
  }
  function dist2(a,b){
    const lat=((a.lat+b.lat)/2)*Math.PI/180;
    const dx=(a.lng-b.lng)*Math.cos(lat), dy=a.lat-b.lat;
    return dx*dx+dy*dy;
  }

  function resolveCity(row){
    const name = String(row.state ?? row.name ?? '').trim();
    const k = key(name);
    if(districtLookup[k]) return {city:districtLookup[k].city,feature:districtLookup[k].feature};
    const lat=Number(row.lat), lng=Number(row.long);
    if(Number.isFinite(lat)&&Number.isFinite(lng)){
      for(const city of CITIES){
        for(const f of municipalityFeatures[city]){
          if(pointInGeometry(lat,lng,f.geometry)) return {city,feature:f};
        }
      }
      let best=null,bd=Infinity;
      for(const city of CITIES){
        const c=municipalityCenters[city]; if(!c) continue;
        const d=dist2({lat,lng},c); if(d<bd){bd=d;best=city;}
      }
      if(best) return {city:best,feature:null};
    }
    return {city:null,feature:null};
  }

  function riskColorFromScore(s){
    if(s>=0.68) return [220,38,38];
    if(s>=0.36) return [250,204,21];
    return [22,163,74];
  }

  // More controlled than a classic heatmap: counts are log-scaled and every point
  // has a local radius, so one huge count cannot paint the whole municipality red.
  class HeatLayer extends L.Layer {
    constructor(){ super(); this._onMove=()=>this.redraw(); this.config={}; }
    onAdd(m){
      this._map=m;
      this._canvas=L.DomUtil.create('canvas','heat-canvas');
      this._canvas.style.position='absolute';
      this._canvas.style.left='0';
      this._canvas.style.top='0';
      this._canvas.style.zIndex='250';
      m.getPanes().overlayPane.appendChild(this._canvas);
      m.on('move zoom resize',this._onMove);
      this.redraw();
    }
    onRemove(m){
      m.off('move zoom resize',this._onMove);
      if(this._canvas) this._canvas.remove();
      this._canvas=null;
    }
    setConfig(cfg){ this.config=cfg||{}; this.redraw(); }
    redraw(){
      if(!this._map || !this._canvas) return;
      const size=this._map.getSize();
      this._canvas.width=Math.max(1,Math.floor(size.x));
      this._canvas.height=Math.max(1,Math.floor(size.y));
      this._canvas.style.width=size.x+'px';
      this._canvas.style.height=size.y+'px';
      const ctx=this._canvas.getContext('2d');
      ctx.clearRect(0,0,size.x,size.y);
      const cfg=this.config;
      if(!cfg || !cfg.rows || !cfg.rows.length || !cfg.features || !cfg.features.length) return;

      const points=cfg.rows.filter(r=>Number.isFinite(r.lat)&&Number.isFinite(r.lng)).map(r=>({
        lat:r.lat,lng:r.lng,count:Math.max(0,Number(r.count)||0)
      }));
      if(!points.length) return;
      const maxCount=Math.max(...points.map(p=>p.count),1);
      const bbox=cfg.bbox||this._map.getBounds();
      const latSpan=Math.max(Math.abs(bbox.getNorth()-bbox.getSouth()),0.001);
      const lngSpan=Math.max(Math.abs(bbox.getEast()-bbox.getWest()),0.001);
      const radiusDeg=Math.max(Math.min(Math.min(latSpan,lngSpan)*0.13,0.018),0.0035);
      const step=cfg.stepPx||6;

      // Precompute point pixels for this map view.
      const pp=points.map(p=>{
        const q=this._map.latLngToContainerPoint([p.lat,p.lng]);
        return {x:q.x,y:q.y,count:p.count,v:Math.sqrt(Math.log1p(p.count)/Math.log1p(maxCount))};
      });

      // Municipality mask test via geographic coordinates.
      function inside(lat,lng){ return cfg.features.some(f=>pointInGeometry(lat,lng,f.geometry)); }

      for(let y=0;y<size.y;y+=step){
        for(let x=0;x<size.x;x+=step){
          const ll=this._map.containerPointToLatLng([x+step/2,y+step/2]);
          if(!inside(ll.lat,ll.lng)) continue;

          let score=0;
          let support=0;
          for(const p of pp){
            // Convert pixel distance to an approximate degree distance at this latitude.
            const plat=this._map.containerPointToLatLng([p.x,p.y]);
            const dlat=ll.lat-plat.lat;
            const dlng=(ll.lng-plat.lng)*Math.cos(ll.lat*Math.PI/180);
            const d=Math.sqrt(dlat*dlat+dlng*dlng);
            if(d>radiusDeg*1.65) continue;
            const influence=Math.exp(-Math.pow(d/radiusDeg,2)*2.2);
            score=Math.max(score,p.v*influence);
            support += p.v*influence*0.18;
          }
          score=Math.min(1,score+support);
          if(score<0.18) continue;

          const [r,g,b]=riskColorFromScore(score);
          let alpha=Math.min(0.84,0.22+(score-0.18)*0.95);
          ctx.fillStyle=`rgba(${r},${g},${b},${alpha})`;
          ctx.fillRect(x,y,step+1,step+1);
        }
      }
    }
  }

  function ensureHeat(){ if(!heatLayer){ heatLayer=new HeatLayer().addTo(map); } }
  function hideHeat(){ if(heatLayer){ heatLayer.setConfig(null); } }

  function clearLabels(){ labelLayer.clearLayers(); }
  function labelPoint(lat,lng,text,cls){
    return L.marker([lat,lng],{interactive:false,icon:L.divIcon({className:'',html:`<div class="${cls}">${text}</div>`,iconSize:null})}).addTo(labelLayer);
  }

  function cityOutlineStyle(city){
    const total=municipalityTotals[city]||0;
    return {color:'#ffffff',weight:2,opacity:.95,fill:false,fillOpacity:0};
  }

  function showMunicipalityOverview(){
    drillLevel=0; selectedCity=null; selectedArea=null; areaModels=null;
    $('backBtn').style.display='none';
    clearLabels();
    if(districtLayer){ map.removeLayer(districtLayer); districtLayer=null; }
    municipalityOutlineLayer.clearLayers();
    const layers=[];
    for(const city of CITIES){
      for(const f of municipalityFeatures[city]){
        const l=L.geoJSON(f,{style:()=>cityOutlineStyle(city)});
        l.bindTooltip(`<b>Municipality:</b> ${city}<br><b>Total incidents:</b> ${(municipalityTotals[city]||0).toLocaleString()}<br><b>Click municipality to drill down>`,`className:'custom'`,{sticky:true});
        l.on('click',e=>{ L.DomEvent.stopPropagation(e); showFiveAreas(city); });
        l.addTo(municipalityOutlineLayer);
        layers.push(l);
      }
      const c=municipalityCenters[city];
      if(c) labelPoint(c.lat,c.lng,`${city} · ${(municipalityTotals[city]||0).toLocaleString()}`,'city-label');
    }
    ensureHeat();
    heatLayer.setConfig({
      rows:CITIES.flatMap(c=>districtRows[c]),
      features:CITIES.flatMap(c=>municipalityFeatures[c]),
      bbox: L.latLngBounds(layers.flatMap(l=>l.getBounds ? [l.getBounds().getNorthEast(),l.getBounds().getSouthWest()] : [])),
      stepPx:6
    });
    const all=L.featureGroup(layers);
    if(all.getBounds().isValid()) map.fitBounds(all.getBounds(),{padding:[30,30],maxZoom:12});
    info('🟢 Low &nbsp; 🟡 Medium &nbsp; 🔴 High &nbsp; | &nbsp; Click a municipality');
  }

  function chooseInitialSeeds(rows,k){
    const clean=rows.filter(r=>Number.isFinite(r.lat)&&Number.isFinite(r.lng));
    if(!clean.length) return [];
    const seeds=[{lat:clean[0].lat,lng:clean[0].lng}];
    while(seeds.length<k){
      let best=clean[0],bestD=-1;
      for(const p of clean){
        const d=Math.min(...seeds.map(s=>dist2(p,s)));
        if(d>bestD){bestD=d;best=p;}
      }
      seeds.push({lat:best.lat,lng:best.lng});
    }
    return seeds;
  }

  function kmeans5(rows){
    const pts=rows.filter(r=>Number.isFinite(r.lat)&&Number.isFinite(r.lng));
    if(!pts.length) return {seeds:[],assignments:[]};
    const k=Math.min(5,pts.length);
    let seeds=chooseInitialSeeds(pts,k);
    for(let it=0;it<12;it++){
      const groups=Array.from({length:k},()=>[]);
      pts.forEach(p=>{
        let bi=0,bd=Infinity;
        seeds.forEach((s,i)=>{const d=dist2(p,s);if(d<bd){bd=d;bi=i;}});
        groups[bi].push(p);
        p._area=bi;
      });
      let moved=false;
      seeds=seeds.map((s,i)=>{
        const g=groups[i]; if(!g.length) return s;
        const ns={lat:g.reduce((a,p)=>a+p.lat,0)/g.length,lng:g.reduce((a,p)=>a+p.lng,0)/g.length};
        if(dist2(s,ns)>1e-10) moved=true;
        return ns;
      });
      if(!moved) break;
    }
    return {seeds,assignments:pts.map(p=>({...p,area:p._area}))};
  }

  function municipalityBBox(city){
    const ls=[];
    municipalityFeatures[city].forEach(f=>{
      const b=L.geoJSON(f).getBounds(); if(b.isValid()) ls.push(b.getNorthEast(),b.getSouthWest());
    });
    return ls.length?L.latLngBounds(ls):null;
  }

  // Render a clipped nearest-seed partition: a geographic, Voronoi-like 5-area split.
  class AreaLayer extends L.Layer {
    onAdd(m){this._map=m;this._canvas=L.DomUtil.create('canvas','heat-canvas');this._canvas.style.position='absolute';this._canvas.style.left='0';this._canvas.style.top='0';this._canvas.style.zIndex='240';m.getPanes().overlayPane.appendChild(this._canvas);this._handler=()=>this.redraw();m.on('move zoom resize',this._handler);this.redraw();}
    onRemove(m){m.off('move zoom resize',this._handler);if(this._canvas)this._canvas.remove();}
    setConfig(c){this.cfg=c;this.redraw();}
    redraw(){
      if(!this._map||!this._canvas||!this.cfg)return;
      const s=this._map.getSize();this._canvas.width=s.x;this._canvas.height=s.y;this._canvas.style.width=s.x+'px';this._canvas.style.height=s.y+'px';
      const ctx=this._canvas.getContext('2d');ctx.clearRect(0,0,s.x,s.y);
      const cfg=this.cfg;if(!cfg.seeds.length||!cfg.features.length)return;
      const step=7;
      const inside= (lat,lng)=>cfg.features.some(f=>pointInGeometry(lat,lng,f.geometry));
      for(let y=0;y<s.y;y+=step){for(let x=0;x<s.x;x+=step){
        const ll=this._map.containerPointToLatLng([x+step/2,y+step/2]); if(!inside(ll.lat,ll.lng))continue;
        let bi=0,bd=Infinity;cfg.seeds.forEach((seed,i)=>{const d=dist2(ll,seed);if(d<bd){bd=d;bi=i;}});
        const [rr,gg,bb]=hexToRgb(AREA_COLORS[bi%AREA_COLORS.length]);ctx.fillStyle=`rgba(${rr},${gg},${bb},0.38)`;ctx.fillRect(x,y,step+1,step+1);
      }}
    }
  }
  let areaLayer=null;
  function hexToRgb(hex){const h=hex.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}

  function showFiveAreas(city){
    selectedCity=city; selectedArea=null; drillLevel=1; $('backBtn').style.display='block'; $('backBtn').textContent='← Municipalities';
    clearLabels(); municipalityOutlineLayer.clearLayers(); hideHeat();
    if(districtLayer){map.removeLayer(districtLayer);districtLayer=null;}
    const rows=districtRows[city]||[];
    const km=kmeans5(rows);
    areaModels=km;
    if(areaLayer) map.removeLayer(areaLayer);
    areaLayer=new AreaLayer().addTo(map);
    areaLayer.setConfig({seeds:km.seeds.length===5?km.seeds:padSeeds(km.seeds,city),features:municipalityFeatures[city]});
    const centers=areaLayer.cfg.seeds;
    centers.forEach((s,i)=>labelPoint(s.lat,s.lng,`Area ${i+1}`,'area-label'));
    const b=municipalityBBox(city); if(b&&b.isValid()) map.fitBounds(b,{padding:[40,40],maxZoom:13});
    info(`<b>${city}</b> &nbsp;→&nbsp; <b>5 geographic areas</b> &nbsp; | &nbsp; Click any area`);
  }

  function padSeeds(seeds,city){
    const b=municipalityBBox(city);const c=b?b.getCenter():municipalityCenters[city];
    const out=seeds.slice();
    const offsets=[[0.010,0],[0.005,0.009],[-0.005,0.009],[-0.010,0],[-0.005,-0.009],[0.005,-0.009]];
    let i=0;while(out.length<5){const o=offsets[i++%offsets.length];out.push({lat:c.lat+o[0],lng:c.lng+o[1]});}
    return out.slice(0,5);
  }

  function areaAt(lat,lng){
    if(!areaModels||!selectedCity)return null;
    const b=municipalityBBox(selectedCity);if(!b||!b.contains([lat,lng]))return null;
    if(!municipalityFeatures[selectedCity].some(f=>pointInGeometry(lat,lng,f.geometry)))return null;
    const seeds=areaLayer&&areaLayer.cfg?areaLayer.cfg.seeds:areaModels.seeds;
    if(!seeds.length)return null;
    let bi=0,bd=Infinity;seeds.forEach((s,i)=>{const d=dist2({lat,lng},s);if(d<bd){bd=d;bi=i;}});return bi;
  }

  function selectedAreaRows(city,area){
    return (areaModels?.assignments||[]).filter(r=>r.area===area);
  }

  function getRiskStats(rows){
    const vals=rows.map(r=>Number(r.count)||0).filter(v=>v>0).sort((a,b)=>a-b);
    if(!vals.length)return {a:0,b:0};
    return {a:vals[Math.floor((vals.length-1)*0.33)],b:vals[Math.floor((vals.length-1)*0.66)]};
  }
  function riskFor(count,stats){
    const v=Number(count)||0;if(v<=0)return {name:'No Data',color:'#94a3b8'};
    if(v>=stats.b)return {name:'High',color:'#dc2626'};
    if(v>=stats.a)return {name:'Medium',color:'#facc15'};
    return {name:'Low',color:'#16a34a'};
  }

  function showDistricts(city,area){
    selectedArea=area;drillLevel=2;$('backBtn').style.display='block';$('backBtn').textContent='← 5 Areas';clearLabels();if(areaLayer){map.removeLayer(areaLayer);areaLayer=null;}
    if(districtLayer){map.removeLayer(districtLayer);districtLayer=null;}
    const rows=selectedAreaRows(city,area);const stats=getRiskStats(rows);const rowMap={};rows.forEach(r=>rowMap[key(r.name)] = r);
    const group=L.layerGroup();
    districtFeatures[city].forEach(f=>{
      const name=f.name;const row=rowMap[key(name)] || districtRows[city].find(r=>key(r.name)===key(name));
      const count=row?Number(row.count)||0:0;const risk=riskFor(count,stats);
      const layer=L.geoJSON(f.feature,{style:{color:'#ffffff',weight:1.2,opacity:.95,fillColor:risk.color,fillOpacity:count>0?.48:.03}});
      layer.bindTooltip(`<b>District:</b> ${name}<br><b>Municipality:</b> ${city}<br><b>Incidents:</b> ${count.toLocaleString()}<br><b>Risk:</b> ${risk.name}`,{sticky:true,className:'custom'});
      layer.on('mouseover',()=>layer.setStyle({weight:2.5,fillOpacity:count>0?.72:.08}));
      layer.on('mouseout',()=>layer.setStyle({weight:1.2,fillOpacity:count>0?.48:.03}));
      layer.on('click',e=>{L.DomEvent.stopPropagation(e);window.parent.postMessage({type:'mapClick',state:name,municipality:city,lat:row?.lat??null,long:row?.lng??null},'*');});
      layer.addTo(group);
    });
    districtLayer=group.addTo(map);
    const pts=rows.filter(r=>Number.isFinite(r.lat)&&Number.isFinite(r.lng));
    if(pts.length){map.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lng])),{padding:[60,60],maxZoom:16});}
    const total=rows.reduce((s,r)=>s+(Number(r.count)||0),0);
    info(`<b>${city}</b> &nbsp;→&nbsp; <b>Area ${area+1}</b> &nbsp;→&nbsp; <b>Districts</b> &nbsp; | &nbsp; ${total.toLocaleString()} incidents`);
  }

  $('backBtn').addEventListener('click',()=>{
    if(drillLevel===2){showFiveAreas(selectedCity);return;}
    if(drillLevel===1){showMunicipalityOverview();return;}
  });

  map.on('click',e=>{
    if(drillLevel===0){
      for(const city of CITIES){if(municipalityFeatures[city].some(f=>pointInGeometry(e.latlng.lat,e.latlng.lng,f.geometry))){showFiveAreas(city);return;}}
    } else if(drillLevel===1){
      const a=areaAt(e.latlng.lat,e.latlng.lng);if(a!==null){showDistricts(selectedCity,a);}
    }
  });

  async function loadGeo(){
    const [mun,d1,d2,d3]=await Promise.all([
      fetch('./municipality.geojson').then(r=>r.json()),
      fetch('./dammam.geojson').then(r=>r.json()),
      fetch('./dhahran.geojson').then(r=>r.json()),
      fetch('./khobar.geojson').then(r=>r.json())
    ]);
    if(Array.isArray(mun.features)){
      mun.features.forEach(f=>{
        const raw=String(f.properties?.REMARKS||f.properties?.NameEn||f.properties?.NAME||f.properties?.name||'').trim();
        const n=normAr(raw);
        let city=null;
        if(raw==='الدمام'||n==='dammam') city='Dammam';
        else if(raw==='الظهران'||n==='dhahran') city='Dhahran';
        else if(raw==='الخبر'||n==='khobar') city='Khobar';
        if(city){municipalityFeatures[city].push(f); const c=featureCenter(f); if(c)municipalityCenters[city]=c;}
      });
    }
    const sources=[['Dammam',d1],['Dhahran',d2],['Khobar',d3]];
    sources.forEach(([city,data])=>{
      (data.features||[]).forEach(f=>{
        const name=String(f.properties?.REMARKS||f.properties?.NameEn||f.properties?.NAME||f.properties?.name||'').trim();
        if(!name)return;const c=featureCenter(f);districtFeatures[city].push({name,feature:f,center:c});districtLookup[key(name)]={city,feature:f};
      });
    });
    showMunicipalityOverview();
  }

  function applyIncidentData(rows){
    allRows=Array.isArray(rows)?rows:[];
    CITIES.forEach(c=>{districtRows[c]=[];municipalityTotals[c]=0;});
    allRows.forEach(row=>{
      const name=String(row.state??row.name??'').trim();const count=Number(row.count)||0;let lat=Number(row.lat),lng=Number(row.long);
      if(!name||!Number.isFinite(count))return;
      const res=resolveCity(row);if(!res.city)return;
      if(!Number.isFinite(lat)||!Number.isFinite(lng)){
        const feat=res.feature?featureCenter(res.feature):null;if(feat){lat=feat.lat;lng=feat.lng;}
      }
      municipalityTotals[res.city]+=count;
      districtRows[res.city].push({name,count,lat,lng,city:res.city});
    });
    showMunicipalityOverview();
  }

  window.addEventListener('message',event=>{
    if(event.data?.type!=='incidentData')return;
    applyIncidentData(event.data.data||[]);
  });

  loadGeo().then(()=>{
    window.parent.postMessage({type:'iframeReady'},'*');
  }).catch(err=>{
    console.error('GeoJSON load error',err);
    info('GeoJSON could not be loaded. Keep the 4 GeoJSON files beside this HTML file.');
  });
})();
</script>
</body>
</html>
