/* =========================================================
   DRILL-DOWN HEAT MAP
   Each view has a heat surface plus plain text count labels.
   Labels are clickable; they are not bubble markers.
   ========================================================= */

function clearHeatVisuals() {
    incidentHeatLayer.setLatLngs([]);
    heatLabelLayer.clearLayers();
}


function getHeatWeight(count, stats) {
    count = Number(count || 0);

    if (!count || !stats || !stats.max) return 0;

    if (stats.max === stats.min) return 1;

    return Math.max(0.08, count / stats.max);
}


function addHeatCountLabel(item, title, onClick) {
    if (!Number.isFinite(item.lat) || !Number.isFinite(item.lng)) return;

    const icon = L.divIcon({
        className: "heat-label-marker",
        html: `<div class="heat-data-label"><b>${title}</b><span>${Number(item.count || 0).toLocaleString()} incidents</span></div>`,
        iconSize: [112, 42],
        iconAnchor: [56, 21]
    });

    const label = L.marker([item.lat, item.lng], {
        icon,
        keyboard: true,
        zIndexOffset: 2000,
        interactive: true
    });

    if (onClick) label.on("click", onClick);
    heatLabelLayer.addLayer(label);
}


function renderHeatLevel(items, labelFor, onClickFor, radius) {
    clearHeatVisuals();

    const visible = (items || []).filter(item =>
        Number.isFinite(item.lat) &&
        Number.isFinite(item.lng) &&
        Number(item.count) > 0
    );

    if (!visible.length) return;

    const stats = calculateLayerRisk(visible);

    incidentHeatLayer.setOptions({
        radius: radius,
        blur: Math.round(radius * 0.7857),
        minOpacity: 0.35,
        maxZoom: 13,
        gradient: {
            0.10: "#bbf7d0",
            0.25: "#22c55e",
            0.45: "#fef08a",
            0.60: "#facc15",
            0.78: "#fecaca",
            0.90: "#ef4444",
            1.00: "#991b1b"
        }
    });

    incidentHeatLayer.setLatLngs(
        visible.map(item => [
            item.lat,
            item.lng,
            getHeatWeight(Number(item.count), stats)
        ])
    );

    visible.forEach(item =>
        addHeatCountLabel(item, labelFor(item), onClickFor(item))
    );
}


function fitToItems(items, padding, maxZoom) {
    const points = (items || [])
        .filter(item => Number.isFinite(item.lat) && Number.isFinite(item.lng))
        .map(item => [item.lat, item.lng]);

    if (!points.length) return;
    const bounds = L.latLngBounds(points);
    if (bounds.isValid()) map.fitBounds(bounds, { padding, maxZoom });
}


function showMunicipalityOverview() {
    drillLevel = 0;
    selectedMunicipality = null;
    selectedCluster = null;
    selectedSubCluster = null;
    currentClusters = [];

    const municipalities = CITIES.map(city => ({
        city,
        count: municipalityTotals[city] || 0,
        lat: municipalityCenters[city]?.lat,
        lng: municipalityCenters[city]?.long
    }));

    renderHeatLevel(
        municipalities,
        item => item.city,
        item => () => showMunicipality(item.city),
        82
    );

    CITIES.forEach(city => {
        const boundary = municipalityBoundaryLayers[city];
        if (!boundary) return;
        boundary.off("click");
        boundary.on("click", () => showMunicipality(city));
    });

    const boundaries = CITIES.map(city => municipalityBoundaryLayers[city]).filter(Boolean);
    if (boundaries.length) {
        const bounds = L.featureGroup(boundaries).getBounds();
        if (bounds.isValid()) map.fitBounds(bounds, { padding: [30, 30] });
    }

    updateMapInfo("Municipalities — click a municipality or its count label");
    updateBackButton();
}


function showMunicipality(city) {
    selectedMunicipality = city;
    selectedCluster = null;
    selectedSubCluster = null;
    drillLevel = 1;

    const rows = prepareRows(municipalityIncidentRows[city] || [], city);
    currentClusters = createClusters(rows);

    renderHeatLevel(
        currentClusters,
        item => `Group ${item.index + 1}`,
        item => () => showSecondLevel(item, city),
        62
    );

    const boundary = municipalityBoundaryLayers[city];
    if (boundary && boundary.getBounds().isValid()) {
        map.fitBounds(boundary.getBounds(), { padding: [70, 70], maxZoom: 13 });
    }

    updateMapInfo(`<b>${city}</b> — 3 heat groups; click a group label`);
    updateBackButton();
}


function showSecondLevel(cluster, city) {
    selectedCluster = cluster;
    selectedSubCluster = null;
    drillLevel = 2;

    currentClusters = createClusters(cluster.items || []);

    renderHeatLevel(
        currentClusters,
        item => `Sub-group ${item.index + 1}`,
        item => () => showDistrictLevel(item, city),
        52
    );

    fitToItems(cluster.items, [100, 100], 15);
    updateMapInfo(`<b>${city}</b> — Group ${cluster.index + 1}; click a sub-group label`);
    updateBackButton();
}


function showDistrictLevel(cluster, city) {
    selectedSubCluster = cluster;
    drillLevel = 3;

    const rows = cluster.items || [];
    renderHeatLevel(
        rows,
        item => item.name || "District",
        item => () => {
            window.parent.postMessage({
                type: "mapClick",
                state: item.name,
                municipality: city,
                lat: item.lat,
                long: item.lng
            }, "*");
        },
        42
    );

    fitToItems(rows, [90, 90], 17);
    updateMapInfo(`<b>${city}</b> — districts; click a district label to filter Grafana`);
    updateBackButton();
}
/* =========================================================
   APPLY GRAFANA DATA
   ========================================================= */

function applyIncidentData(rows) {


    /* =====================================================
       RESET
       ===================================================== */

    Object.keys(
        districtCounts
    ).forEach(key => {

        delete districtCounts[key];

    });


    Object.keys(
        districtNameLookup
    ).forEach(key => {

        delete districtNameLookup[key];

    });


    CITIES.forEach(city => {

        municipalityTotals[city] =
            0;

        municipalityIncidentRows[city] =
            [];

    });


    /* =====================================================
       PROCESS ROWS
       ===================================================== */

    (rows || []).forEach(row => {

        const name =
            String(
                row.state || ""
            ).trim();


        const count =
            Number(
                row.count || 0
            );


        let lat =
            Number(row.lat);


        let lng =
            Number(row.long);


        if (

            !name ||

            !Number.isFinite(count)

        ) {

            return;

        }


        if (

            !Number.isFinite(lat)

        ) {

            lat = null;

        }


        if (

            !Number.isFinite(lng)

        ) {

            lng = null;

        }


        const resolution =

            resolveMunicipality(

                name,

                lat,

                lng

            );


        if (

            !resolution.city

        ) {

            console.warn(

                "Could not resolve municipality:",

                {

                    name,

                    count,

                    lat,

                    lng

                }

            );

            return;

        }


        const city =
            resolution.city;


        /* ------------------------------------------------
           Municipality total
           ------------------------------------------------ */

        municipalityTotals[city] +=
            count;


        /* ------------------------------------------------
           Exact district
           ------------------------------------------------ */

        const exactDistrict =
            districtToCity[name];


        if (exactDistrict) {

            districtCounts[
                exactDistrict
            ] = {

                count,

                lat,

                long:
                    lng

            };

        }


        /* ------------------------------------------------
           Normalized lookup
           ------------------------------------------------ */

        districtNameLookup[

            districtLookupKey(name)

        ] = {

            name,

            city,

            count

        };


        /* ------------------------------------------------
           KEEP EVERY ROW
           ------------------------------------------------ */

        municipalityIncidentRows[city]
            .push({

                name,

                count,

                lat,

                lng,

                displayLat:
                    lat,

                displayLng:
                    lng,

                city,

                method:
                    resolution.method

            });

    });


    /* =====================================================
       FALLBACK POSITIONS
       ===================================================== */

    CITIES.forEach(city => {

        const rowsForCity =

            municipalityIncidentRows[city];


        rowsForCity.forEach(

            (row, index) => {

                if (

                    !Number.isFinite(row.lat) ||

                    !Number.isFinite(row.lng)

                ) {

                    const fallback =

                        fallbackCoordinate(

                            city,

                            index,

                            rowsForCity.length

                        );


                    if (fallback) {

                        row.lat =
                            fallback.lat;

                        row.lng =
                            fallback.lng;

                        row.displayLat =
                            fallback.lat;

                        row.displayLng =
                            fallback.lng;

                    }

                }

            }

        );

    });


    /* =====================================================
       UPDATE DISTRICT POLYGONS
       ===================================================== */

    Object.keys(
        districtLayers
    ).forEach(name => {

        const city =
            districtToCity[name];


        const layer =
            districtLayers[name];


        if (!layer) {

            return;

        }


        layer.setStyle(

            districtStyle(

                city,

                name

            )

        );


        const count =
            getDistrictCount(name);


        const risk =

            count > 0

                ? getLayerRisk(

                    count,

                    {

                        min: count,

                        max: count,

                        lowLimit: count,

                        highLimit: count

                    }

                )

                : {

                    level:
                        "No Data",

                    color:
                        "#94a3b8",

                    className:
                        "no-data-count"

                };


        layer.setTooltipContent(

            districtTooltipHtml(

                name,

                city,

                count,

                risk

            )

        );

    });


    /* =====================================================
       RESET DRILL STATE
       ===================================================== */

    drillLevel =
        0;

    selectedMunicipality =
        null;

    selectedCluster =
        null;

    selectedSubCluster =
        null;

    currentClusters = [];


    /* =====================================================
       SHOW MUNICIPALITIES
       ===================================================== */

    showMunicipalityOverview();


    scheduleRefresh();

}

   REFRESH
   ========================================================= */

function scheduleRefresh() {

    if (refreshTimer) {

        clearTimeout(
            refreshTimer
        );

    }


    refreshTimer =

        setTimeout(

            () => {

                refreshTimer =
                    null;

                refreshMap();

            },

            100

        );

}


/* =========================================================
   REFRESH MAP
   ========================================================= */

function refreshMap() {

    if (

        drillLevel === 0

    ) {

        showMunicipalityOverview();

    }

}


/* =========================================================
   RECEIVE GRAFANA DATA
   ========================================================= */

window.addEventListener(

    "message",

    event => {

        if (

            event.data?.type !==
            "incidentData"

        ) {

            return;

        }


        const rows =
            event.data.data || [];


        console.log(

            "Received incident data:",

            rows

        );


        if (!mapReady) {

            pendingIncidentData =
                rows;

            return;

        }


        applyIncidentData(rows);

    }

);

</script>



<script>
/* =========================================================
   FINAL 3-LEVEL ACTUAL-SHAPE MAP OVERRIDE

   Level 1 = Municipalities + actual district polygons
   Level 2 = 3 actual-shape Groups inside municipality
   Level 3 = direct Districts inside selected Group

   No Sub-Group level.
   No artificial circles for geographic areas.
   ========================================================= */

(function(){

    const FINAL_PALETTE = {
        Dammam:  { light:'#fecaca', mid:'#ef4444', dark:'#991b1b', border:'#7f1d1d' },
        Khobar:  { light:'#fef3c7', mid:'#facc15', dark:'#a16207', border:'#854d0e' },
        Dhahran: { light:'#bbf7d0', mid:'#22c55e', dark:'#166534', border:'#14532d' }
    };

    let finalShapeLayer = L.layerGroup().addTo(map);
    let finalLabelLayer = L.layerGroup().addTo(map);

    function removeFinalLayers(){
        finalShapeLayer.clearLayers();
        finalLabelLayer.clearLayers();
    }

    function hideOriginalDistrictLayers(){
        Object.keys(districtLayers).forEach(name => {
            const layer = districtLayers[name];
            if(layer && map.hasLayer(layer)) map.removeLayer(layer);
        });
    }

    function showOriginalDistrictLayers(names){
        (names || []).forEach(name => {
            const layer = districtLayers[name];
            if(layer) map.addLayer(layer);
        });
    }

    function palette(city){
        return FINAL_PALETTE[city] || FINAL_PALETTE.Dammam;
    }

    function colorForCount(count, stats, city){
        const p = palette(city);
        const n = Number(count || 0);
        if(!n) return '#94a3b8';
        if(!stats || stats.max <= 0) return p.light;
        if(stats.max === stats.min) return p.dark;
        if(n >= stats.highLimit) return p.dark;
        if(n >= stats.lowLimit) return p.mid;
        return p.light;
    }

    function riskForCount(count, stats){
        const n = Number(count || 0);
        if(!n) return 'No Data';
        if(!stats || stats.max <= 0) return 'Low';
        if(stats.max === stats.min) return 'High';
        if(n >= stats.highLimit) return 'High';
        if(n >= stats.lowLimit) return 'Medium';
        return 'Low';
    }

    function districtStats(rows){
        return calculateLayerRisk(rows || []);
    }

    function addCountLabel(row, city, showName){
        if(!Number.isFinite(row.lat) || !Number.isFinite(row.lng)) return;
        const count = Number(row.count || 0);
        if(count <= 0) return;

        const html = showName
            ? `<div class="final-district-label"><b>${row.name || 'District'}</b><span>${count.toLocaleString()}</span></div>`
            : `<div class="final-count-label">${count.toLocaleString()}</div>`;

        const icon = L.divIcon({
            className:'final-label-icon',
            html,
            iconSize: showName ? [118,42] : [64,34],
            iconAnchor: showName ? [59,21] : [32,17]
        });

        const marker = L.marker([row.lat,row.lng], {
            icon,
            zIndexOffset:4000,
            interactive:true
        });

        marker.bindTooltip(
            districtTooltipHtml(
                row.name || 'District',
                city,
                count,
                {level:'Incident', color: colorForCount(count,districtStats(municipalityIncidentRows[city]),city)}
            ),
            {sticky:true,direction:'top',opacity:0.95,className:'custom-tooltip'}
        );

        marker.on('click',()=>{
            window.parent.postMessage({
                type:'mapClick',
                state:row.name,
                municipality:city,
                lat:row.lat,
                long:row.lng
            },'*');
        });

        finalLabelLayer.addLayer(marker);
    }

    function styleDistrict(name, city, stats, opacity){
        const count = getDistrictCount(name);
        const fill = colorForCount(count,stats,city);
        return {
            color:'#ffffff',
            weight:1.2,
            opacity:0.92,
            fillColor:fill,
            fillOpacity: opacity == null ? 0.68 : opacity
        };
    }

    function addDistrictPolygon(name, city, stats, opacity){
        const original = districtLayers[name];
        if(!original) return;

        const clone = L.geoJSON(original.toGeoJSON(), {
            style:()=>styleDistrict(name,city,stats,opacity),
            interactive:true
        });

        clone.bindTooltip(
            districtTooltipHtml(
                name,
                city,
                getDistrictCount(name),
                {
                    level:riskForCount(getDistrictCount(name),stats),
                    color:colorForCount(getDistrictCount(name),stats,city)
                }
            ),
            {sticky:true,direction:'top',opacity:0.95,className:'custom-tooltip'}
        );

        clone.on('mouseover',e=>{
            e.layer.setStyle({weight:2.5,fillOpacity:0.82});
            e.layer.bringToFront();
        });

        clone.on('mouseout',e=>{
            e.layer.setStyle(styleDistrict(name,city,stats,opacity));
        });

        clone.on('click',()=>{
            const d=districtCounts[name];
            window.parent.postMessage({
                type:'mapClick',
                state:name,
                municipality:city,
                lat:d ? d.lat : null,
                long:d ? d.long : null
            },'*');
        });

        finalShapeLayer.addLayer(clone);
    }

    function rowsForCity(city){
        return prepareRows(municipalityIncidentRows[city] || [],city)
            .filter(r=>r && r.name);
    }

    function districtNamesForRows(rows){
        return [...new Set((rows||[]).map(r=>r.name).filter(Boolean))];
    }

    function addMunicipalityBoundary(city){
        const boundary=municipalityBoundaryLayers[city];
        if(!boundary) return;
        const p=palette(city);
        boundary.setStyle({
            color:'#ffffff',
            weight:2.5,
            opacity:0.98,
            fillColor:p.mid,
            fillOpacity:0.04
        });
        if(!map.hasLayer(boundary)) map.addLayer(boundary);
        boundary.bringToFront();
    }

    function clearMunicipalityBoundaries(){
        CITIES.forEach(city=>{
            const b=municipalityBoundaryLayers[city];
            if(b && map.hasLayer(b)) map.removeLayer(b);
        });
    }

    /* ---------------------------------------------------------
       LEVEL 1 — ACTUAL DISTRICTS COLOURED INSIDE MUNICIPALITY
       --------------------------------------------------------- */
    window.showMunicipalityOverview = function(){
        drillLevel=0;
        selectedMunicipality=null;
        selectedCluster=null;
        selectedSubCluster=null;
        currentClusters=[];

        if(typeof clearBubbleLayer==='function') clearBubbleLayer();
        if(typeof clearHeatVisuals==='function') clearHeatVisuals();
        removeFinalLayers();
        hideOriginalDistrictLayers();
        clearMunicipalityBoundaries();

        CITIES.forEach(city=>{
            const rows=rowsForCity(city);
            const stats=districtStats(rows);
            const names=districtNamesForRows(rows);

            names.forEach(name=>addDistrictPolygon(name,city,stats,0.72));

            rows.forEach(row=>addCountLabel(row,city,false));

            addMunicipalityBoundary(city);
        });

        const boundaries=CITIES.map(c=>municipalityBoundaryLayers[c]).filter(Boolean);
        if(boundaries.length){
            const b=L.featureGroup(boundaries).getBounds();
            if(b.isValid()) map.fitBounds(b,{padding:[30,30]});
        }

        updateMapInfo('Municipalities — click Dammam, Khobar or Dhahran to view 3 Groups');
        updateBackButton();
    };

    /* ---------------------------------------------------------
       LEVEL 2 — THREE ACTUAL-SHAPE GROUPS
       Group 1 = RED
       Group 2 = YELLOW
       Group 3 = GREEN
       --------------------------------------------------------- */
    window.showMunicipality = function(city){
        selectedMunicipality=city;
        selectedCluster=null;
        selectedSubCluster=null;
        drillLevel=1;

        if(typeof clearBubbleLayer==='function') clearBubbleLayer();
        if(typeof clearHeatVisuals==='function') clearHeatVisuals();
        removeFinalLayers();
        hideOriginalDistrictLayers();
        clearMunicipalityBoundaries();

        const rows=rowsForCity(city);
        currentClusters=createClusters(rows);

        const p=palette(city);
        const groupColors=[
            {light:'#fecaca',mid:'#ef4444',dark:'#991b1b',border:'#7f1d1d'},
            {light:'#fef3c7',mid:'#facc15',dark:'#a16207',border:'#854d0e'},
            {light:'#bbf7d0',mid:'#22c55e',dark:'#166534',border:'#14532d'}
        ];

        currentClusters.forEach((cluster,index)=>{
            const names=districtNamesForRows(cluster.items);
            const colors=groupColors[index] || groupColors[2];
            const stats=districtStats(cluster.items);

            // Draw actual district polygons, but same group family.
            names.forEach(name=>{
                const original=districtLayers[name];
                if(!original) return;

                const layer=L.geoJSON(original.toGeoJSON(),{
                    style:{
                        color:'#ffffff',
                        weight:1.0,
                        opacity:0.95,
                        fillColor:colors.mid,
                        fillOpacity:0.78
                    }
                });

                layer.on('mouseover',e=>e.layer.setStyle({weight:2.5,fillOpacity:0.90}));
                layer.on('mouseout',e=>e.layer.setStyle({weight:1.0,fillOpacity:0.78}));
                layer.on('click',()=>window.showDistrictLevel(cluster,city));
                finalShapeLayer.addLayer(layer);
            });

            const center=getCentroid(cluster.items);
            if(center){
                const label=L.marker([center.lat,center.lng],{
                    icon:L.divIcon({
                        className:'final-group-label',
                        html:`<div style="background:${colors.dark};">Group ${index+1}<span>${cluster.count.toLocaleString()}</span></div>`,
                        iconSize:[132,58],
                        iconAnchor:[66,29]
                    }),
                    zIndexOffset:5000
                });
                label.on('click',()=>window.showDistrictLevel(cluster,city));
                finalLabelLayer.addLayer(label);
            }
        });

        const boundary=municipalityBoundaryLayers[city];
        if(boundary){
            boundary.setStyle({color:'#ffffff',weight:2.5,opacity:1,fillOpacity:0});
            map.addLayer(boundary);
            boundary.bringToFront();
        }

        const points=rows.filter(r=>Number.isFinite(r.lat)&&Number.isFinite(r.lng));
        if(points.length){
            const bounds=L.latLngBounds(points.map(r=>[r.lat,r.lng]));
            if(bounds.isValid()) map.fitBounds(bounds,{padding:[70,70],maxZoom:14});
        }

        updateMapInfo(`<b>${city}</b> — 3 Groups: 🔴 Group 1 • 🟡 Group 2 • 🟢 Group 3`);
        updateBackButton();
    };

    /* ---------------------------------------------------------
       LEVEL 3 — DIRECT DISTRICTS
       NO SUB-GROUP
       District count decides RED / YELLOW / GREEN
       --------------------------------------------------------- */
    window.showDistrictLevel = function(cluster,city){
        selectedCluster=cluster;
        selectedSubCluster=null;
        drillLevel=2;

        if(typeof clearBubbleLayer==='function') clearBubbleLayer();
        if(typeof clearHeatVisuals==='function') clearHeatVisuals();
        removeFinalLayers();
        hideOriginalDistrictLayers();
        clearMunicipalityBoundaries();

        const rows=cluster.items || [];
        const stats=districtStats(rows);

        rows.forEach(row=>{
            if(!row.name) return;
            addDistrictPolygon(row.name,city,stats,0.76);
            addCountLabel(row,city,true);
        });

        const points=rows.filter(r=>Number.isFinite(r.lat)&&Number.isFinite(r.lng));
        if(points.length){
            const bounds=L.latLngBounds(points.map(r=>[r.lat,r.lng]));
            if(bounds.isValid()) map.fitBounds(bounds,{padding:[65,65],maxZoom:16});
        }

        updateMapInfo(`<b>${city}</b> — Direct Districts • 🟢 Low • 🟡 Medium • 🔴 High (based on count)`);
        updateBackButton();
    };

    /* ---------------------------------------------------------
       BACK BUTTON — 0 -> 1 -> 2
       --------------------------------------------------------- */
    window.updateBackButton = function(){
        const button=document.getElementById('back-button') || document.querySelector('.back-button');
        if(!button) return;

        if(drillLevel===0){
            button.style.display='none';
        } else {
            button.style.display='block';
            button.innerHTML=drillLevel===1 ? '← Municipalities' : '← Groups';
        }
    };

    window.handleBack = function(){
        if(drillLevel===2){
            showMunicipality(selectedMunicipality);
        } else if(drillLevel===1){
            showMunicipalityOverview();
        } else {
            showMunicipalityOverview();
        }
    };

    // Try to attach to an existing Back button.
    function wireBackButton(){
        const candidates=document.querySelectorAll('button, .back-button, [id*=back i]');
        candidates.forEach(btn=>{
            if((btn.textContent||'').toLowerCase().includes('back')){
                btn.onclick=handleBack;
            }
        });
    }

    /* ---------------------------------------------------------
       SATELLITE BACKGROUND
       --------------------------------------------------------- */
    try{
        if(typeof osm!=='undefined' && map.hasLayer(osm)) map.removeLayer(osm);
    }catch(e){}

    const finalSatellite=L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        {attribution:'Esri World Imagery',maxZoom:19}
    ).addTo(map);

    // Put satellite below vector overlays.
    if(map.getPane('tilePane')) map.getPane('tilePane').style.zIndex=200;

    // The original initialization happens asynchronously.
    // Re-run our intended overview after all source data is ready.
    const originalApplyIncidentData=window.applyIncidentData;
    if(typeof originalApplyIncidentData==='function'){
        // Function is already used by existing listeners; no replacement needed.
    }

    setTimeout(()=>{
        wireBackButton();
        if(typeof mapReady!=='undefined' && mapReady){
            showMunicipalityOverview();
        }
    },1200);

    // Keep our level functions after any source redraw.
    setTimeout(wireBackButton,1800);

})();

</script>

<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>

<script>
/* =========================================================
   FINAL CLEAN OVERRIDE

   IMPORTANT:
   - Only THREE visual levels.
   - Level 1: Municipality polygons only.
   - Level 2: 3 contiguous group regions.
   - Level 3: Direct districts, count-based RED/YELLOW/GREEN.
   - No sub-groups.
   - No municipality district colouring at Level 1.
   - Existing municipality/district layer control remains.
   ========================================================= */
(function(){

    const P = {
        Dammam: {
            light:'#fca5a5',
            mid:'#ef4444',
            dark:'#991b1b',
            border:'#ffffff'
        },
        Khobar: {
            light:'#fde68a',
            mid:'#facc15',
            dark:'#a16207',
            border:'#ffffff'
        },
        Dhahran: {
            light:'#bbf7d0',
            mid:'#22c55e',
            dark:'#166534',
            border:'#ffffff'
        }
    };

    const RISK = {
        High:P.Dammam,
        Medium:P.Khobar,
        Low:P.Dhahran
    };

    let shape = L.layerGroup().addTo(map);
    let labels = L.layerGroup().addTo(map);

    let level = 0;
    let city = null;
    let group = null;

    function clear(){
        shape.clearLayers();
        labels.clearLayers();
    }

    function hideOldDistricts(){
        if(typeof districtLayers === 'undefined') return;
        Object.values(districtLayers).forEach(function(l){
            if(l && map.hasLayer(l)) map.removeLayer(l);
        });
    }

    function hideOldHeat(){
        try{ incidentHeatLayer.setLatLngs([]); }catch(e){}
        try{ heatLabelLayer.clearLayers(); }catch(e){}
        try{ clearBubbleLayer(); }catch(e){}
    }

    function rows(c){
        if(typeof municipalityIncidentRows === 'undefined') return [];
        let a = municipalityIncidentRows[c] || [];
        if(typeof prepareRows === 'function') a = prepareRows(a,c);
        return a.filter(function(r){return r && r.name;});
    }

    function num(v){
        const n=Number(v);
        return Number.isFinite(n)?n:0;
    }

    function fmt(v){return num(v).toLocaleString();}

    function centerOf(rs){
        if(typeof getCentroid === 'function') return getCentroid(rs);
        const valid=rs.filter(r=>Number.isFinite(r.lat)&&Number.isFinite(r.lng));
        if(!valid.length) return null;
        return {
            lat:valid.reduce((s,r)=>s+r.lat,0)/valid.length,
            lng:valid.reduce((s,r)=>s+r.lng,0)/valid.length
        };
    }

    function addNumber(lat,lng,value,large){
        if(!Number.isFinite(lat)||!Number.isFinite(lng)) return;
        const marker=L.marker([lat,lng],{
            interactive:false,
            zIndexOffset:9000,
            icon:L.divIcon({
                className:'final-clean-number-label',
                html:'<div class="'+(large?'final-clean-group-number':'final-clean-number')+'">'+fmt(value)+'</div>',
                iconSize:large?[120,34]:[110,30],
                iconAnchor:large?[60,17]:[55,15]
            })
        });
        labels.addLayer(marker);
    }

    function defs(){
        const svg=document.querySelector('#map svg.leaflet-zoom-animated');
        if(!svg) return null;
        let d=svg.querySelector('defs');
        if(!d){
            d=document.createElementNS('http://www.w3.org/2000/svg','defs');
            svg.insertBefore(d,svg.firstChild);
        }
        return d;
    }

    function gradient(id,palette,intensity){
        const d=defs();
        if(!d) return false;
        const old=document.getElementById(id);
        if(old) old.remove();

        const g=document.createElementNS('http://www.w3.org/2000/svg','radialGradient');
        g.setAttribute('id',id);
        g.setAttribute('cx','50%');
        g.setAttribute('cy','50%');
        g.setAttribute('r','76%');

        intensity=Math.max(0,Math.min(1,num(intensity)));
        const core=Math.round(18+35*intensity);
        const m1=Math.min(70,core+12);
        const m2=Math.min(86,m1+12);

        g.innerHTML=
            '<stop offset="0%" stop-color="'+palette.dark+'" stop-opacity="0.96"></stop>'+
            '<stop offset="'+core+'%" stop-color="'+palette.dark+'" stop-opacity="0.91"></stop>'+
            '<stop offset="'+m1+'%" stop-color="'+palette.mid+'" stop-opacity="0.84"></stop>'+
            '<stop offset="'+m2+'%" stop-color="'+palette.mid+'" stop-opacity="0.76"></stop>'+
            '<stop offset="100%" stop-color="'+palette.light+'" stop-opacity="0.64"></stop>';
        d.appendChild(g);
        return true;
    }

    function paint(layer,id){
        function apply(){
            if(!layer) return;
            if(layer._layers){
                Object.values(layer._layers).forEach(function(x){
                    if(x && x._path) x._path.style.fill='url(#'+id+')';
                });
            }
        }
        apply();
        setTimeout(apply,80);
        setTimeout(apply,250);
        setTimeout(apply,600);
    }

    function riskStats(rs){
        const values=rs.map(r=>num(r.count)).filter(v=>v>0).sort((a,b)=>a-b);
        if(!values.length) return {min:0,max:0,lowLimit:0,highLimit:0};
        const min=values[0], max=values[values.length-1];
        const low=values[Math.floor((values.length-1)/3)];
        const high=values[Math.floor((values.length-1)*2/3)];
        return {min,max,lowLimit:low,highLimit:high};
    }

    function risk(rs,count){
        const s=riskStats(rs), n=num(count);
        if(!n) return 'Low';
        if(s.max===s.min) return 'High';
        if(n>=s.highLimit) return 'High';
        if(n>=s.lowLimit) return 'Medium';
        return 'Low';
    }

    function bindTooltip(layer,name,c,total,kind,cname){
        if(typeof districtTooltipHtml==='function' && kind==='district'){
            const rr = (typeof cname === 'string') ? cname : 'District';
            layer.bindTooltip(
                districtTooltipHtml(
                    name,
                    city,
                    c,
                    {level:rr}
                ),
                {sticky:true,direction:'top',opacity:.95,className:'custom-tooltip'}
            );
        }else if(typeof municipalityTooltipHtml==='function'){
            layer.bindTooltip(
                municipalityTooltipHtml(
                    name,
                    {level:kind,color:'#333'}
                ),
                {sticky:true,direction:'top',opacity:.95,className:'custom-tooltip'}
            );
        }else{
            layer.bindTooltip('<b>'+name+'</b><br>Incidents: '+fmt(total||c),{sticky:true});
        }
    }

    function municipalityBoundary(c){
        return municipalityBoundaryLayers && municipalityBoundaryLayers[c];
    }

    /* ======================================================
       LEVEL 1
       ONLY MUNICIPALITY SHAPES
       ====================================================== */
    function level1(){
        level=0; city=null; group=null;
        clear(); hideOldHeat(); hideOldDistricts();

        const totals=CITIES.map(c=>num(municipalityTotals[c]));
        const mn=Math.min.apply(null,totals), mx=Math.max.apply(null,totals);

        CITIES.forEach(function(c){
            const b=municipalityBoundary(c);
            if(!b) return;
            const total=num(municipalityTotals[c]);
            const intensity=mx===mn?.65:(total-mn)/(mx-mn);
            const p=P[c];
            const id='munGradient_'+c;

            const clone=L.geoJSON(b.toGeoJSON(),{
                style:{
                    color:'#ffffff',
                    weight:2.5,
                    opacity:1,
                    fillColor:p.mid,
                    fillOpacity:.78
                }
            });

            clone.on('mouseover',function(e){e.layer.setStyle({weight:3,fillOpacity:.86});});
            clone.on('mouseout',function(e){e.layer.setStyle({weight:2.5,fillOpacity:.78});});
            clone.on('click',function(){level2(c);});
            bindTooltip(clone,c,total,total,'Municipality',c);
            shape.addLayer(clone);

            setTimeout(function(){
                if(gradient(id,p,intensity)) paint(clone,id);
            },100);

            const ctr=b.getBounds().getCenter();
            addNumber(ctr.lat,ctr.lng,total,true);
        });

        const bs=CITIES.map(municipalityBoundary).filter(Boolean);
        if(bs.length){
            const fg=L.featureGroup(bs), bb=fg.getBounds();
            if(bb.isValid()) map.fitBounds(bb,{padding:[35,35],maxZoom:11});
        }
        updateInfo('LEVEL 1 — Municipalities Overview | Click a municipality to view Groups');
        backButton();
    }

    /* ======================================================
       LEVEL 2
       3 GROUPS — RED / YELLOW / GREEN
       ====================================================== */
    function level2(c){
        level=1; city=c; group=null;
        clear(); hideOldHeat(); hideOldDistricts();

        const rs=rows(c);
        let groups;
        if(typeof createClusters==='function') groups=createClusters(rs);
        else groups=[];

        // Always exactly three groups where data exists.
        groups=groups.slice(0,3);

        const palettes=[P.Dammam,P.Khobar,P.Dhahran];
        const names=['Group 1','Group 2','Group 3'];

        groups.forEach(function(g,i){
            const p=palettes[i];
            const items=g.items||[];
            const total=items.reduce((s,r)=>s+num(r.count),0);
            const id='grpGradient_'+i+'_'+Date.now();

            // Use the real district geometries, but remove internal borders.
            items.forEach(function(r){
                const original=districtLayers[r.name];
                if(!original) return;
                const poly=L.geoJSON(original.toGeoJSON(),{
                    style:{
                        color:'transparent',
                        weight:0,
                        opacity:0,
                        fillColor:p.mid,
                        fillOpacity:.82
                    }
                });
                poly.on('click',function(){level3(g,c);});
                poly.on('mouseover',function(e){e.layer.setStyle({fillOpacity:.9});});
                poly.on('mouseout',function(e){e.layer.setStyle({fillOpacity:.82});});
                shape.addLayer(poly);
                setTimeout(function(){
                    if(gradient(id,p,Math.min(1,total/Math.max(1,num(municipalityTotals[c]))))) paint(poly,id);
                },120);
            });

            const ctr=centerOf(items);
            if(ctr) addNumber(ctr.lat,ctr.lng,total,true);
        });

        // Draw group boundaries using convex hull-like visual outlines from
        // the actual district points. No artificial data points are created.
        groups.forEach(function(g,i){
            const pts=(g.items||[]).filter(r=>Number.isFinite(r.lat)&&Number.isFinite(r.lng)).map(r=>[r.lng,r.lat]);
            if(pts.length>=3 && typeof turf!=='undefined'){
                const fc=turf.featureCollection(pts.map(x=>turf.point(x)));
                const hull=turf.convexHull(fc);
                if(hull){
                    const p=palettes[i];
                    const outline=L.geoJSON(hull,{style:{color:'#ffffff',weight:2,fillOpacity:0,opacity:.95}});
                    outline.on('click',function(){level3(g,c);});
                    shape.addLayer(outline);
                }
            }
        });

        const boundary=municipalityBoundary(c);
        if(boundary){
            const outline=L.geoJSON(boundary.toGeoJSON(),{style:{color:'#ffffff',weight:2.5,fillOpacity:0,opacity:1}});
            shape.addLayer(outline);
        }

        const points=rs.filter(r=>Number.isFinite(r.lat)&&Number.isFinite(r.lng));
        if(points.length){
            const bb=L.latLngBounds(points.map(r=>[r.lat,r.lng]));
            if(bb.isValid()) map.fitBounds(bb,{padding:[45,45],maxZoom:13});
        }
        updateInfo('LEVEL 2 — '+c+' Groups | 🔴 Group 1  •  🟡 Group 2  •  🟢 Group 3');
        backButton();
    }

    /* ======================================================
       LEVEL 3
       DIRECT DISTRICTS — COUNT BASED RED/YELLOW/GREEN
       ====================================================== */
    function level3(g,c){
        level=2; city=c; group=g;
        clear(); hideOldHeat(); hideOldDistricts();

        const rs=g.items||[];
        const stats=riskStats(rs);

        rs.forEach(function(r){
            const original=districtLayers[r.name];
            if(!original) return;

            const rr=risk(rs,r.count);
            const p=RISK[rr];
            const intensity=stats.max===stats.min?.7:(num(r.count)-stats.min)/Math.max(1,stats.max-stats.min);
            const id='distGradient_'+String(r.name).replace(/[^a-zA-Z0-9]/g,'_')+'_'+Date.now();

            const poly=L.geoJSON(original.toGeoJSON(),{
                style:{
                    color:'#ffffff',
                    weight:1.4,
                    opacity:1,
                    fillColor:p.mid,
                    fillOpacity:.78
                }
            });

            poly.on('mouseover',function(e){e.layer.setStyle({weight:2.5,fillOpacity:.9});});
            poly.on('mouseout',function(e){e.layer.setStyle({weight:1.4,fillOpacity:.78});});
            poly.on('click',function(){
                const d=districtCounts[r.name];
                window.parent.postMessage({
                    type:'mapClick',
                    state:r.name,
                    municipality:c,
                    lat:d?d.lat:r.lat,
                    long:d?d.long:r.lng
                },'*');
            });
            bindTooltip(poly,r.name,num(r.count),num(r.count),'district',rr);
            shape.addLayer(poly);

            setTimeout(function(){
                if(gradient(id,p,intensity)) paint(poly,id);
            },120);

            // Number only at actual district coordinate.
            addNumber(r.lat,r.lng,num(r.count),false);
        });

        const pts=rs.filter(r=>Number.isFinite(r.lat)&&Number.isFinite(r.lng));
        if(pts.length){
            const bb=L.latLngBounds(pts.map(r=>[r.lat,r.lng]));
            if(bb.isValid()) map.fitBounds(bb,{padding:[45,45],maxZoom:15});
        }
        updateInfo('LEVEL 3 — '+c+' / '+(g.index!=null?'Group '+(g.index+1):'Group')+' / Direct Districts | 🔴 High  🟡 Medium  🟢 Low');
        backButton();
    }

    function updateInfo(t){
        const el=document.getElementById('map-info');
        if(el) el.innerHTML=t;
        const title=document.querySelector('.map-title');
        if(title){
            title.innerHTML=
                level===0 ? 'LEVEL 1 — Municipalities Overview' :
                level===1 ? 'LEVEL 2 — Groups - '+city :
                'LEVEL 3 — Districts - '+city;
        }
    }

    function backButton(){
        let b=document.querySelector('.map-back-button');
        if(!b){
            const ctl=L.control({position:'topleft'});
            ctl.onAdd=function(){
                const d=L.DomUtil.create('button','map-back-button');
                d.type='button';
                d.style.display='none';
                d.onclick=function(){
                    L.DomEvent.stopPropagation(event);
                    if(level===2) level2(city);
                    else if(level===1) level1();
                    else level1();
                };
                return d;
            };
            ctl.addTo(map);
            b=document.querySelector('.map-back-button');
        }
        if(!b) return;
        b.style.display=level===0?'none':'block';
        b.innerHTML=level===2?'← Groups':'← Municipalities';
    }

    // Replace any old click handlers on municipality boundaries.
    function wire(){
        if(typeof municipalityBoundaryLayers==='undefined') return false;
        const ready=CITIES.every(c=>municipalityBoundaryLayers[c]);
        if(!ready) return false;
        CITIES.forEach(function(c){
            const b=municipalityBoundaryLayers[c];
            b.off('click');
            b.on('click',function(){level2(c);});
        });
        return true;
    }

    // Wait for the original GeoJSON/data loader to finish.
    let tries=0;
    const timer=setInterval(function(){
        tries++;
        if(wire()){
            clearInterval(timer);
            setTimeout(level1,150);
        }
        if(tries>80) clearInterval(timer);
    },250);

    window.__threeLevelMap={level1,level2,level3};

})();
</script>
