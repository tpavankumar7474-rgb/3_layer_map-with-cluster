<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Municipality Incident Heat Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; font-family:Arial,Helvetica,sans-serif; }
#map { width:100%; height:100vh; }
.map-title{
 position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:9999;
 background:rgba(255,255,255,.96); border:1px solid #333; border-radius:9px;
 padding:8px 18px; font-size:16px; font-weight:800; color:#111; box-shadow:0 2px 8px rgba(0,0,0,.25);
 pointer-events:none; white-space:nowrap;
}
.map-info{
 position:absolute; top:58px; left:50%; transform:translateX(-50%); z-index:9999;
 background:rgba(255,255,255,.92); border-radius:8px; padding:6px 12px;
 font-size:12px; color:#222; box-shadow:0 1px 6px rgba(0,0,0,.18); pointer-events:none; white-space:nowrap;
}
.back-btn{
 background:#fff; border:1px solid #333; border-radius:8px; padding:8px 12px; font-size:13px; font-weight:800;
 cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.25); display:none;
}
.back-btn:hover{background:#f3f4f6}
.legend{
 background:rgba(255,255,255,.95); border:1px solid #333; border-radius:9px; padding:10px 12px;
 box-shadow:0 2px 8px rgba(0,0,0,.26); color:#111; font-size:12px; min-width:155px;
}
.legend-title{font-weight:800;font-size:13px;text-align:center;margin-bottom:7px}
.legend-row{display:flex;align-items:center;gap:7px;margin:4px 0}
.swatch{width:18px;height:18px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,.2)}
.sw-green{background:#16a34a}.sw-yellow{background:#facc15}.sw-red{background:#dc2626}
.area-label{
 background:rgba(255,255,255,.88); border:1px solid rgba(0,0,0,.55); border-radius:999px;
 padding:3px 7px; font-size:11px; font-weight:800; color:#111; box-shadow:0 1px 4px rgba(0,0,0,.18);
}
.leaflet-tooltip.custom-tip{background:rgba(255,255,255,.97);border:1px solid #333;color:#111;border-radius:7px;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:12px;line-height:1.5}
@media(max-width:600px){.map-title{font-size:13px;padding:7px 12px}.map-info{font-size:10px}.legend{min-width:125px;font-size:11px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="map-title">Municipality Incident Heat Map</div>
<div id="mapInfo" class="map-info">🟢 Low &nbsp; 🟡 Medium &nbsp; 🔴 High &nbsp; | &nbsp; Click a municipality to drill down</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
'use strict';

const CITIES=['Dammam','Dhahran','Khobar'];
const CITY_AR={'Dammam':'الدمام','Dhahran':'الظهران','Khobar':'الخبر'};
const CITY_MATCH={dammam:'Dammam',dhahran:'Dhahran',khobar:'Khobar','الدمام':'Dammam','الظهران':'Dhahran','الخبر':'Khobar'};
const AREA_COLORS=['#dc2626','#facc15','#16a34a','#3b82f6','#8b5cf6'];
const districtLayers={};
const districtMeta={};
const cityFeatures={Dammam:[],Dhahran:[],Khobar:[]};
const cityBoundaries={};
const cityCenters={};
const cityRows={Dammam:[],Dhahran:[],Khobar:[]};
const municipalityTotals={Dammam:0,Dhahran:0,Khobar:0};
const heatLayers={Dammam:null,Dhahran:null,Khobar:null};
const areaLayers=[];
const areaLabels=[];
let state={level:0,city:null,area:null};
let mapReady=false,pendingRows=null;

const map=L.map('map',{zoomControl:true,maxZoom:19});
const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19}).addTo(map);

function norm(v){return String(v??'').trim().replace(/\s+/g,' ').toLowerCase().replace(/[‐-‒–—―]/g,'-');}
function normAr(v){return norm(v).replace(/[\u064B-\u065F\u0670]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');}
function cityFromName(v){const n=normAr(v); return CITY_MATCH[n] || null;}
function num(v){const x=Number(v); return Number.isFinite(x)?x:0;}
function rowLat(r){return Number.isFinite(Number(r.lat))?Number(r.lat):Number.isFinite(Number(r.latitude))?Number(r.latitude):null;}
function rowLng(r){return Number.isFinite(Number(r.long))?Number(r.long):Number.isFinite(Number(r.lng))?Number(r.lng):Number.isFinite(Number(r.longitude))?Number(r.longitude):null;}
function rowName(r){return String(r.state??r.name??r.district??r.location??'').trim();}
function pointDist(a,b){const dx=(a.lng-b.lng)*Math.cos(((a.lat+b.lat)/2)*Math.PI/180); const dy=a.lat-b.lat; return Math.sqrt(dx*dx+dy*dy);}
function pointInRing(lat,lng,ring){
  let inside=false; if(!Array.isArray(ring)||ring.length<3)return false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=Number(ring[i][0]), yi=Number(ring[i][1]), xj=Number(ring[j][0]), yj=Number(ring[j][1]);
    const cross=((yi>lat)!==(yj>lat))&&(lng < (xj-xi)*(lat-yi)/((yj-yi)||1e-12)+xi);
    if(cross)inside=!inside;
  }
  return inside;
}
function pointInPolygon(lat,lng,coords){
  if(!coords||!coords.length||!pointInRing(lat,lng,coords[0]))return false;
  for(let i=1;i<coords.length;i++) if(pointInRing(lat,lng,coords[i])) return false;
  return true;
}
function pointInGeometry(lat,lng,g){
  if(!g||!g.coordinates)return false;
  if(g.type==='Polygon')return pointInPolygon(lat,lng,g.coordinates);
  if(g.type==='MultiPolygon')return g.coordinates.some(p=>pointInPolygon(lat,lng,p));
  return false;
}
function geometryRings(g){
  if(!g)return[];
  if(g.type==='Polygon')return g.coordinates.map(r=>r);
  if(g.type==='MultiPolygon')return g.coordinates.flatMap(p=>p);
  return[];
}
function geoBounds(features){
  let minLat=Infinity,maxLat=-Infinity,minLng=Infinity,maxLng=-Infinity;
  features.forEach(f=>geometryRings(f.geometry).forEach(r=>r.forEach(p=>{minLng=Math.min(minLng,p[0]);maxLng=Math.max(maxLng,p[0]);minLat=Math.min(minLat,p[1]);maxLat=Math.max(maxLat,p[1]);})));
  return (Number.isFinite(minLat))?{minLat,maxLat,minLng,maxLng}:null;
}
function featureGeometryContains(features,lat,lng){return features.some(f=>pointInGeometry(lat,lng,f.geometry));}
function centroidOfCoords(coords){let lat=0,lng=0,n=0;coords.forEach(p=>{lng+=Number(p[0]);lat+=Number(p[1]);n++;});return n?{lat:lat/n,lng:lng/n}:null;}
function featureCenter(feature){
  const pts=[]; geometryRings(feature.geometry).forEach(r=>r.forEach(p=>pts.push(p)));
  return pts.length?centroidOfCoords(pts):null;
}

function riskStats(rows){
  const vals=(rows||[]).map(r=>num(r.count)).filter(v=>v>0);
  if(!vals.length)return{min:0,max:0,p33:0,p66:0};
  vals.sort((a,b)=>a-b);
  const q=p=>vals[Math.min(vals.length-1,Math.max(0,Math.floor((vals.length-1)*p)))];
  return{min:vals[0],max:vals[vals.length-1],p33:q(.33),p66:q(.66)};
}
function riskColor(count,stats){
  const c=num(count); if(c<=0)return'#94a3b8';
  if(stats.max===stats.min)return'#dc2626';
  if(c>=stats.p66)return'#dc2626';
  if(c>=stats.p33)return'#facc15';
  return'#16a34a';
}
function color3(t){
  const clamp=Math.max(0,Math.min(1,t));
  const stops=[[0,[22,163,74]],[0.5,[250,204,21]],[1,[220,38,38]]];
  let a=stops[0],b=stops[2];
  if(clamp<=.5)b=stops[1]; else a=stops[1];
  const u=(clamp-a[0])/(b[0]-a[0]||1);
  const c=a[1].map((v,i)=>Math.round(v+(b[1][i]-v)*u));
  return 'rgba('+c[0]+','+c[1]+','+c[2]+',0.88)';
}
function colorCssHex(t){
  const clamp=Math.max(0,Math.min(1,t));
  const stops=[[0,[22,163,74]],[.5,[250,204,21]],[1,[220,38,38]]];
  let a=stops[0],b=stops[2]; if(clamp<=.5)b=stops[1]; else a=stops[1];
  const u=(clamp-a[0])/(b[0]-a[0]||1); const c=a[1].map((v,i)=>Math.round(v+(b[1][i]-v)*u));
  return '#'+c.map(x=>x.toString(16).padStart(2,'0')).join('');
}

function makeHeatDataURL(features,rows,width,height,seedLabel){
  const bounds=geoBounds(features); if(!bounds||!rows.length)return null;
  const padLat=(bounds.maxLat-bounds.minLat)*.015||.002, padLng=(bounds.maxLng-bounds.minLng)*.015||.002;
  const b={minLat:bounds.minLat-padLat,maxLat:bounds.maxLat+padLat,minLng:bounds.minLng-padLng,maxLng:bounds.maxLng+padLng};
  const canvas=document.createElement('canvas'); canvas.width=width; canvas.height=height;
  const ctx=canvas.getContext('2d'); const img=ctx.createImageData(width,height);
  const pts=rows.filter(r=>Number.isFinite(r.lat)&&Number.isFinite(r.lng)&&num(r.count)>0).map(r=>({lat:r.lat,lng:r.lng,w:Math.log1p(num(r.count))}));
  if(!pts.length)return{url:canvas.toDataURL(),bounds:[[b.minLat,b.minLng],[b.maxLat,b.maxLng]]};
  let minScore=Infinity,maxScore=-Infinity;
  const vals=new Float32Array(width*height); const denom=new Float32Array(width*height);
  const minDim=Math.min(b.maxLat-b.minLat,b.maxLng-b.minLng); const nearest=[];
  pts.forEach((p,i)=>{let d=Infinity;pts.forEach((q,j)=>{if(i!==j)d=Math.min(d,pointDist(p,q));});nearest.push(Number.isFinite(d)?d:minDim*.22);});
  let sigma=nearest.reduce((a,v)=>a+v,0)/nearest.length*.95; sigma=Math.max(minDim*.045,Math.min(minDim*.18,sigma||minDim*.1));
  // Keep the surface local. Very high counts increase intensity, not geographic spread.
  for(let y=0;y<height;y++){
    const lat=b.maxLat-(y/(height-1))*(b.maxLat-b.minLat);
    for(let x=0;x<width;x++){
      const lng=b.minLng+(x/(width-1))*(b.maxLng-b.minLng);
      if(!featureGeometryContains(features,lat,lng))continue;
      let nume=0,den=0;
      for(const p of pts){const d=pointDist({lat,lng},p); const k=Math.exp(-(d*d)/(2*sigma*sigma)); nume+=p.w*k; den+=k;}
      const score=den?`0`===seedLabel?0:(nume/den):0;
      vals[y*width+x]=score; denom[y*width+x]=den;
      if(den>0){minScore=Math.min(minScore,score);maxScore=Math.max(maxScore,score);}
    }
  }
  const lo=minScore, hi=maxScore; const span=(hi-lo)||1;
  for(let y=0;y<height;y++) for(let x=0;x<width;x++){
    const idx=y*width+x; const off=idx*4; const lat=b.maxLat-(y/(height-1))*(b.maxLat-b.minLat); const lng=b.minLng+(x/(width-1))*(b.maxLng-b.minLng);
    if(!featureGeometryContains(features,lat,lng)||denom[idx]<=0){img.data[off+3]=0;continue;}
    let t=(vals[idx]-lo)/span;
    // Compress the upper end so one extreme district does not paint the whole municipality red.
    t=Math.pow(Math.max(0,Math.min(1,t)),1.35);
    const rgb=colorCssHex(t); const r=parseInt(rgb.slice(1,3),16),g=parseInt(rgb.slice(3,5),16),bl=parseInt(rgb.slice(5,7),16);
    img.data[off]=r;img.data[off+1]=g;img.data[off+2]=bl;img.data[off+3]=205;
  }
  ctx.putImageData(img,0,0);
  return{url:canvas.toDataURL('image/png'),bounds:[[b.minLat,b.minLng],[b.maxLat,b.maxLng]]};
}
function clearHeat(){Object.keys(heatLayers).forEach(c=>{if(heatLayers[c]){map.removeLayer(heatLayers[c]);heatLayers[c]=null;}});}
function drawCityHeat(city,rows){
  if(heatLayers[city])map.removeLayer(heatLayers[city]);
  const data=makeHeatDataURL(cityFeatures[city],rows,420,420,city);
  if(!data)return;
  heatLayers[city]=L.imageOverlay(data.url,data.bounds,{opacity:.78,interactive:false,zIndex:100}).addTo(map);
}
function clearAreas(){areaLayers.splice(0).forEach(l=>map.removeLayer(l));areaLabels.splice(0).forEach(l=>map.removeLayer(l));}

function municipalityStyle(city){
  const stats=riskStats(CITIES.map(c=>({count:municipalityTotals[c]})));
  return{color:'#ffffff',weight:2,opacity:.9,fillColor:riskColor(municipalityTotals[city],stats),fillOpacity:.05};
}
function bindCityClicks(){
  CITIES.forEach(city=>{
    if(!cityBoundaries[city])return;
    cityBoundaries[city].eachLayer(layer=>{
      layer.setStyle(municipalityStyle(city));
      layer.on('mouseover',()=>layer.setStyle({weight:3,fillOpacity:.08}));
      layer.on('mouseout',()=>{if(state.level===0)layer.setStyle(municipalityStyle(city));});
      layer.on('click',e=>{L.DomEvent.stopPropagation(e);showFiveAreas(city);});
      layer.bindTooltip('<b>Municipality:</b> '+city+'<br><b>Incidents:</b> '+municipalityTotals[city].toLocaleString()+'<br><b>Click:</b> divide into 5 areas',{sticky:true,className:'custom-tip'});
    });
  });
}

function chooseSeeds(rows,city){
  const pts=rows.filter(r=>Number.isFinite(r.lat)&&Number.isFinite(r.lng));
  const center=cityCenters[city]||getCenterFromRows(rows);
  if(!pts.length){return Array.from({length:5},(_,i)=>offsetSeed(center,i,5));}
  const seeds=[pts.reduce((best,p)=>best&&num(best.count)>=num(p.count)?best:p,pts[0])];
  while(seeds.length<Math.min(5,pts.length)){
    let best=null,bestScore=-Infinity;
    pts.forEach(p=>{let d=Infinity;seeds.forEach(s=>d=Math.min(d,pointDist(p,s))); const score=d*(1+Math.log1p(num(p.count))); if(score>bestScore){bestScore=score;best=p;}});
    seeds.push(best);
  }
  while(seeds.length<5)seeds.push(offsetSeed(center,seeds.length,5));
  return seeds.map((s,i)=>({lat:s.lat,lng:s.lng,label:'Area '+(i+1)}));
}
function offsetSeed(center,i,n){const r=.18;const a=(Math.PI*2*i/n);return{lat:center.lat+Math.sin(a)*r,lng:center.lng+Math.cos(a)*r};}
function getCenterFromRows(rows){const p=rows.filter(r=>Number.isFinite(r.lat)&&Number.isFinite(r.lng)); if(!p.length)return{lat:26.42,lng:50.1}; return{lat:p.reduce((a,r)=>a+r.lat,0)/p.length,lng:p.reduce((a,r)=>a+r.lng,0)/p.length};}

// Clip a convex polygon by a half-plane n.x + c <= 0.
function clipHalfPlane(poly,A,B){
  if(!poly.length)return[];
  const out=[]; const ax=B.lng-A.lng, ay=B.lat-A.lat;
  // Voronoi condition: dist(P,A)^2 <= dist(P,B)^2.
  // Rearranged: 2(B-A).P <= |B|^2-|A|^2
  const nx=2*(B.lng-A.lng), ny=2*(B.lat-A.lat), cc=(A.lng*A.lng+A.lat*A.lat-B.lng*B.lng-B.lat*B.lat);
  function val(p){return nx*p.lng+ny*p.lat+cc;}
  for(let i=0;i<poly.length;i++){
    const S=poly[i],E=poly[(i+1)%poly.length]; const vs=val(S),ve=val(E); const insS=vs<=0,insE=ve<=0;
    if(insS&&insE){out.push(E);}
    else if(insS&&!insE){const t=vs/(vs-ve);out.push({lat:S.lat+(E.lat-S.lat)*t,lng:S.lng+(E.lng-S.lng)*t});}
    else if(!insS&&insE){const t=vs/(vs-ve);out.push({lat:S.lat+(E.lat-S.lat)*t,lng:S.lng+(E.lng-S.lng)*t});out.push(E);}
  }
  return out;
}
function bboxPolygon(b){return[{lat:b.minLat,lng:b.minLng},{lat:b.maxLat,lng:b.minLng},{lat:b.maxLat,lng:b.maxLng},{lat:b.minLat,lng:b.maxLng}];}
function voronoiCells(features,seeds){
  const b=geoBounds(features); if(!b)return[]; const box=bboxPolygon(b); const cells=[];
  seeds.forEach((s,i)=>{let cell=box; seeds.forEach((o,j)=>{if(i!==j)cell=clipHalfPlane(cell,s,o);}); cells.push(cell.filter((p,k,arr)=>k===0||pointDist(p,arr[k-1])>1e-9));});
  return cells;
}
function pointInsidePolygonObj(pt,poly){let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];const hit=((a.lat>pt.lat)!==(b.lat>pt.lat))&&(pt.lng<(b.lng-a.lng)*(pt.lat-a.lat)/((b.lat-a.lat)||1e-12)+a.lng);if(hit)inside=!inside;}return inside;}
function assignRowsToSeeds(rows,seeds){return seeds.map(s=>[]).map((_,i)=>[]).concat();}
function assignRows(rows,seeds){const groups=seeds.map(()=>[]);rows.forEach(r=>{if(!Number.isFinite(r.lat)||!Number.isFinite(r.lng)){groups[0].push(r);return;}let bi=0,bd=Infinity;seeds.forEach((s,i)=>{const d=pointDist(r,s);if(d<bd){bd=d;bi=i;}});groups[bi].push(r);});return groups;}
function areaTooltip(city,i,rows){const total=rows.reduce((a,r)=>a+num(r.count),0);return '<b>'+city+' — Area '+(i+1)+'</b><br><b>Incidents:</b> '+total.toLocaleString()+'<br><b>Districts:</b> '+rows.length+'<br><b>Click:</b> view districts';}

function showOverview(){
  state={level:0,city:null,area:null}; clearAreas(); clearHeat();
  // Style municipality outlines only; heat surfaces carry the actual visual intensity.
  const totalRows=CITIES.map(c=>({count:municipalityTotals[c]}));
  CITIES.forEach(city=>{
    if(cityBoundaries[city])cityBoundaries[city].setStyle(municipalityStyle(city));
    drawCityHeat(city,cityRows[city]);
  });
  const bounds=[]; CITIES.forEach(c=>{if(cityBoundaries[c])bounds.push(cityBoundaries[c].getBounds());});
  if(bounds.length){const g=L.featureGroup(bounds.map(b=>L.rectangle(b,{opacity:0,fillOpacity:0})));if(g.getBounds().isValid())map.fitBounds(g.getBounds(),{padding:[25,25]});}
  setInfo('🟢 Low &nbsp; 🟡 Medium &nbsp; 🔴 High &nbsp; | &nbsp; Click a municipality to divide it into 5 areas');
  updateBackButton();
}
function showFiveAreas(city){
  state={level:1,city,area:null}; clearHeat(); clearAreas();
  CITIES.forEach(c=>{if(cityBoundaries[c])cityBoundaries[c].setStyle(c===city?{color:'#fff',weight:2.5,fillOpacity:0}:{color:'#aaa',weight:1,fillOpacity:0});});
  const rows=cityRows[city]; const seeds=chooseSeeds(rows,city); const cells=voronoiCells(cityFeatures[city],seeds); const groups=assignRows(rows,seeds); 
  cells.forEach((cell,i)=>{
    if(cell.length<3)return;
    const poly=L.polygon(cell.map(p=>[p.lat,p.lng]),{color:'#ffffff',weight:1.5,opacity:.85,fillColor:AREA_COLORS[i],fillOpacity:.28});
    poly.bindTooltip(areaTooltip(city,i,groups[i]),{sticky:true,className:'custom-tip'});
    poly.on('mouseover',()=>poly.setStyle({weight:2.5,fillOpacity:.38}));
    poly.on('mouseout',()=>poly.setStyle({weight:1.5,fillOpacity:.28}));
    poly.on('click',()=>showDistricts(city,i,seeds,cells,groups));
    poly.addTo(map); areaLayers.push(poly);
    const center=cell[Math.floor(cell.length/2)]||seeds[i];
    const label=L.tooltip({permanent:true,direction:'center',className:'area-label',opacity:.95}).setLatLng([center.lat,center.lng]).setContent('Area '+(i+1));
    label.addTo(map);areaLabels.push(label);
  });
  const b=cityBoundaries[city]?.getBounds(); if(b&&b.isValid())map.fitBounds(b,{padding:[60,60],maxZoom:14});
  setInfo('<b>'+city+'</b> &nbsp;→&nbsp; 5 geographic areas &nbsp;|&nbsp; Click an area');
  updateBackButton();
}
function showDistricts(city,index,seeds,cells,groups){
  state={level:2,city,area:index}; clearAreas(); clearHeat();
  CITIES.forEach(c=>{if(cityBoundaries[c])cityBoundaries[c].setStyle(c===city?{color:'#fff',weight:2.2,fillOpacity:0}:{color:'#aaa',weight:1,fillOpacity:0});});
  const rows=groups[index]||[]; const stats=riskStats(rows);
  // First show district polygons that exist in GeoJSON and belong to the selected area's district names.
  const selectedNames=new Set(rows.map(r=>normAr(r.name)));
  const points=[];
  rows.forEach(r=>{if(Number.isFinite(r.lat)&&Number.isFinite(r.lng))points.push([r.lat,r.lng]);});
  Object.values(districtMeta).filter(d=>d.city===city && selectedNames.has(normAr(d.name))).forEach(d=>{
    const count=num((districtMeta[normAr(d.name)]||{}).count);
    const layer=d.layer; const col=riskColor(count,stats);
    layer.setStyle({color:'#ffffff',weight:1.4,opacity:.9,fillColor:col,fillOpacity:.55}); layer.addTo(map);
    layer.bindTooltip('<b>District:</b> '+d.name+'<br><b>Municipality:</b> '+city+'<br><b>Incidents:</b> '+count.toLocaleString()+'<br><b>Risk:</b> '+(col==='#dc2626'?'High':col==='#facc15'?'Medium':'Low'),{sticky:true,className:'custom-tip'});
  });
  const heat=makeHeatDataURL(cityFeatures[city],rows,420,420,city+'-'+index); if(heat){const h=L.imageOverlay(heat.url,heat.bounds,{opacity:.38,interactive:false,zIndex:160}).addTo(map); areaLayers.push(h);}
  points.length && map.fitBounds(L.latLngBounds(points),{padding:[70,70],maxZoom:17});
  setInfo('<b>'+city+'</b> &nbsp;→&nbsp; Area '+(index+1)+' &nbsp;→&nbsp; <b>Districts</b> &nbsp;|&nbsp; District colors are based on this selected area');
  updateBackButton();
}

function setInfo(html){document.getElementById('mapInfo').innerHTML=html;}

const backControl=L.control({position:'topright'});
backControl.onAdd=function(){const div=L.DomUtil.create('div','back-btn');div.textContent='← Back';L.DomEvent.disableClickPropagation(div);div.addEventListener('click',()=>{if(state.level===2)showFiveAreas(state.city);else if(state.level===1)showOverview();else showOverview();});backControl._button=div;return div;};
backControl.addTo(map);
function updateBackButton(){const b=backControl._button;if(!b)return;b.style.display=state.level?'block':'none';b.textContent=state.level===2?'← 5 Areas':'← Municipalities';}

const legend=L.control({position:'bottomleft'});
legend.onAdd=function(){const d=L.DomUtil.create('div','legend');d.innerHTML='<div class="legend-title">Incident Risk</div><div class="legend-row"><span class="swatch sw-green"></span>Low</div><div class="legend-row"><span class="swatch sw-yellow"></span>Medium</div><div class="legend-row"><span class="swatch sw-red"></span>High</div>';return d;};
legend.addTo(map);

function loadBoundaryData(){
  return Promise.all([
    fetch('./municipality.geojson').then(r=>r.json()),
    fetch('./dammam.geojson').then(r=>r.json()),
    fetch('./dhahran.geojson').then(r=>r.json()),
    fetch('./khobar.geojson').then(r=>r.json())
  ]).then(([mun,dammam,dhahran,khobar])=>{
    if(mun&&Array.isArray(mun.features)){
      mun.features.forEach(f=>{
        const name=String(f.properties?.REMARKS??f.properties?.NameEn??f.properties?.NAME??f.properties?.name??'').trim();
        const city=cityFromName(name); if(!city)return;
        cityFeatures[city].push(f);
        if(!cityBoundaries[city])cityBoundaries[city]=L.geoJSON(null,{style:municipalityStyle(city)}).addTo(map);
        cityBoundaries[city].addData(f);
      });
    }
    const districtSets=[[dammam,'Dammam'],[dhahran,'Dhahran'],[khobar,'Khobar']];
    districtSets.forEach(([data,city])=>{
      if(!data||!Array.isArray(data.features))return;
      data.features.forEach(f=>{
        const name=String(f.properties?.REMARKS??f.properties?.NameEn??f.properties?.NAME??f.properties?.name??'').trim(); if(!name)return;
        const key=normAr(name);
        const layer=L.geoJSON(f,{style:{color:'#94a3b8',weight:1,opacity:.4,fillColor:'#94a3b8',fillOpacity:0.02}});
        districtMeta[key]={name,city,layer,count:0}; districtLayers[name]=layer; layer.addTo(map);
        // District boundaries are hidden at municipality/5-area level.
        layer.eachLayer(l=>l.on('click',()=>{const d=districtMeta[normAr(name)];window.parent.postMessage({type:'mapClick',state:name,municipality:city,lat:d?.center?.lat??null,long:d?.center?.lng??null},'*');}));
        const c=featureCenter(f); if(c)districtMeta[key].center=c;
        layer.remove();
      });
    });
    mapReady=true;
    if(pendingRows){applyIncidentData(pendingRows);pendingRows=null;}else showOverview();
    window.parent.postMessage({type:'iframeReady'},'*');
  }).catch(err=>{console.error('GeoJSON loading error',err);setInfo('GeoJSON loading failed — check the four GeoJSON files and their paths.');});
}

function applyIncidentData(rows){
  CITIES.forEach(c=>{cityRows[c]=[];municipalityTotals[c]=0;});
  Object.values(districtMeta).forEach(d=>d.count=0);
  const districtKeyMap={}; Object.values(districtMeta).forEach(d=>districtKeyMap[normAr(d.name)]=d);
  (rows||[]).forEach(r=>{
    const name=rowName(r); const count=num(r.count); const lat=rowLat(r); const lng=rowLng(r); if(!name||count<0)return;
    const exact=districtKeyMap[normAr(name)];
    let city=exact?.city||cityFromName(r.municipality)||cityFromName(r.city)||null;
    if(!city&&Number.isFinite(lat)&&Number.isFinite(lng)){city=CITIES.find(c=>featureGeometryContains(cityFeatures[c],lat,lng))||null;}
    if(!city){
      // Fallback: nearest municipality center if the GeoJSON does not contain the district name.
      let best=null,bd=Infinity; CITIES.forEach(c=>{if(!cityCenters[c])return;const d=pointDist({lat:lat??cityCenters[c].lat,lng:lng??cityCenters[c].lng},cityCenters[c]);if(d<bd){bd=d;best=c;}}); city=best;
    }
    if(!city)return;
    const item={name,count,lat,lng,city}; cityRows[city].push(item); municipalityTotals[city]+=count;
    if(exact)exact.count+=count;
  });
  CITIES.forEach(city=>{
    if(!cityCenters[city]&&cityFeatures[city].length){const c=featureCenter(cityFeatures[city][0]); if(c)cityCenters[city]=c;}
    if(!cityCenters[city])cityCenters[city]=getCenterFromRows(cityRows[city]);
  });
  // Hide all district polygons after refreshing counts.
  Object.values(districtMeta).forEach(d=>{if(map.hasLayer(d.layer))map.removeLayer(d.layer);});
  state={level:0,city:null,area:null};showOverview();
}

window.addEventListener('message',e=>{
  if(e.data?.type!=='incidentData')return;
  const rows=Array.isArray(e.data.data)?e.data.data:[];
  if(!mapReady){pendingRows=rows;return;} applyIncidentData(rows);
});

loadBoundaryData();

})();
</script>
</body>
</html>
