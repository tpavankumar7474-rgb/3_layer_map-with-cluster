<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incident Map - Query Driven</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#0b1114}
#map{width:100%;height:100vh;background:#d8c79c}

/* ---------- TOP LEFT ---------- */
.info-panel{
    position:absolute;z-index:2000;top:14px;left:14px;
    min-width:300px;max-width:430px;
    padding:12px 16px;color:#fff;
    background:rgba(3,12,17,.90);
    border:1px solid rgba(255,255,255,.25);
    border-radius:10px;
    box-shadow:0 5px 18px rgba(0,0,0,.35);
}
.level{color:#39ff14;font-size:14px;font-weight:800;margin-bottom:5px}
.title{font-size:20px;font-weight:800;line-height:1.15}
.stats{font-size:11px;color:#d7d7d7;margin-top:7px}

/* ---------- BUTTONS ---------- */
.top-buttons{
    position:absolute;z-index:2000;right:14px;top:14px;
    display:flex;gap:6px
}
.top-btn{
    padding:10px 14px;color:#fff;background:rgba(3,12,17,.90);
    border:1px solid rgba(255,255,255,.30);border-radius:7px;
    font-size:13px;font-weight:700;cursor:pointer
}
.top-btn:hover{background:#17252b}

/* ---------- LEGEND ---------- */
.legend{
    position:absolute;z-index:2000;right:14px;bottom:14px;
    width:285px;padding:13px 15px;color:#fff;
    background:rgba(3,12,17,.91);
    border:1px solid rgba(255,255,255,.25);
    border-radius:9px;box-shadow:0 5px 18px rgba(0,0,0,.35)
}
.legend-title{font-size:17px;font-weight:800;margin-bottom:9px}
.legend-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px;font-weight:700}
.legend-color{width:19px;height:15px;border-radius:2px;border:1px solid rgba(255,255,255,.35)}
.red{background:#ef4444}.yellow{background:#facc15}.green{background:#65b84a}
.divider{border-top:1px solid rgba(255,255,255,.65);margin:9px 0}

/* ---------- BOTTOM MESSAGE ---------- */
.instruction{
    position:absolute;z-index:2000;left:14px;bottom:14px;
    padding:9px 13px;color:#fff;background:rgba(3,12,17,.90);
    border:1px solid rgba(255,255,255,.25);border-radius:7px;
    font-size:12px
}

/* ---------- NUMBER ONLY LABEL ----------
   No circle. No square. No background.
*/
.number-label{
    background:transparent !important;
    border:0 !important;
    box-shadow:none !important;
    width:auto !important;
    height:auto !important;
}
.number-label::before{display:none!important}
.number-text{
    display:block;
    color:#fff;
    font-size:17px;
    line-height:1;
    font-weight:900;
    white-space:nowrap;
    text-align:center;
    transform:translate(-50%,-50%);
    text-shadow:
        0 2px 2px rgba(0,0,0,.95),
        2px 0 2px rgba(0,0,0,.85),
        -2px 0 2px rgba(0,0,0,.85),
        0 -1px 2px rgba(0,0,0,.85);
}
.number-large .number-text{font-size:21px}
.number-small .number-text{font-size:13px}

/* ---------- LEAFLET ---------- */
.leaflet-control-attribution{
    background:rgba(255,255,255,.55)!important;
    font-size:9px!important
}
.leaflet-popup-content-wrapper{
    background:#071116;color:#fff;border-radius:8px
}
.leaflet-popup-tip{background:#071116}
.leaflet-popup-content{font-size:12px;line-height:1.45}
.leaflet-tooltip{background:#071116;color:#fff;border:0;font-size:11px}

@media(max-width:700px){
 .info-panel{left:8px;top:8px;min-width:220px;max-width:280px}
 .title{font-size:15px}
 .legend{right:8px;bottom:8px;width:225px}
 .instruction{left:8px;bottom:8px;max-width:260px}
 .top-buttons{right:8px;top:8px}
 .top-btn{padding:8px 10px;font-size:11px}
}
</style>
</head>

<body>
<div id="map">

    <div class="info-panel">
        <div class="level" id="levelTitle">LEVEL 1</div>
        <div class="title" id="pageTitle">Municipalities Overview</div>
        <div class="stats" id="stats">Waiting for Grafana query data...</div>
    </div>

    <div class="top-buttons">
        <button class="top-btn" id="backBtn" style="display:none">← Back</button>
        <button class="top-btn" id="resetBtn">↻ Reset View</button>
    </div>

    <div class="legend">
        <div class="legend-title">Incidents (Count)</div>
        <div class="legend-row"><span class="legend-color red"></span><span>Red — High</span></div>
        <div class="legend-row"><span class="legend-color yellow"></span><span>Yellow — Medium</span></div>
        <div class="legend-row"><span class="legend-color green"></span><span>Green — Low</span></div>
        <div class="divider"></div>
        <div style="font-size:11px;color:#ddd">
            Colors are calculated from the current query data.
        </div>
    </div>

    <div class="instruction" id="instruction">
        ⓘ Waiting for Grafana query data
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"></script>

<script>
/* ============================================================
   QUERY-DRIVEN INCIDENT MAP

   Expected Grafana message:

   {
      type: "incidentData",
      data: [
        {
          state: "Location Name",
          lat: 26.42,
          long: 50.08,
          count: 1234,
          ticket: "...",
          classification: "...",
          status: "..."
        }
      ]
   }

   This keeps the same field contract as the original working
   Grafana integration.
   ============================================================ */

const map = L.map("map", {
    zoomControl: true,
    preferCanvas: true
});

const satelliteLayer = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
        attribution:"Tiles © Esri | OpenStreetMap contributors",
        maxZoom:19,
        crossOrigin:true
    }
);

const streetLayer = L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:"© OpenStreetMap contributors",
        maxZoom:19
    }
);

/* Satellite is the requested look. If Esri tiles fail, keep a usable
   map by falling back to OpenStreetMap tiles. */
satelliteLayer.on("tileerror", function(){
    if(!map.hasLayer(streetLayer)){
        console.warn("Satellite tiles unavailable; switching to OpenStreetMap.");
        map.removeLayer(satelliteLayer);
        streetLayer.addTo(map);
    }
});
satelliteLayer.addTo(map);

const CITIES = ["Dammam","Al Khobar","Dhahran"];

const CITY_ALIASES = {
    "dammam":"Dammam",
    "ad dammam":"Dammam",
    "ad-dammam":"Dammam",
    "al dammam":"Dammam",
    "al-dammam":"Dammam",

    "khobar":"Al Khobar",
    "al khobar":"Al Khobar",
    "al-khobar":"Al Khobar",
    "alkhobar":"Al Khobar",

    "dhahran":"Dhahran",
    "ad dhahran":"Dhahran",
    "ad-dhahran":"Dhahran",
    "al dhahran":"Dhahran",
    "al-dhahran":"Dhahran"
};

let rawRows = [];
let currentLevel = 1;
let selectedCity = null;
let selectedGroup = null;

let mapLayers = [];
let numberLayers = [];

let districtFeatures = [];
let municipalityFeatures = [];
let districtIndex = [];
let cityIndex = [];

let dataReady = false;

/* ============================================================
   NORMALIZATION
   ============================================================ */

function norm(v){
    return String(v ?? "")
        .trim()
        .toLowerCase()
        .replace(/[ًٌٍَُِّْـ]/g,"")
        .replace(/[\u200f\u200e]/g,"")
        .replace(/[‐‑‒–—−]/g,"-")
        .replace(/\s+/g," ")
        .trim();
}

function normalizeCity(v){
    const k = norm(v);
    if(CITY_ALIASES[k]) return CITY_ALIASES[k];

    if(k.includes("dammam")) return "Dammam";
    if(k.includes("khobar")) return "Al Khobar";
    if(k.includes("dhahran")) return "Dhahran";

    return null;
}

function number(v){
    const n = Number(String(v ?? "").replace(/,/g,""));
    return Number.isFinite(n) ? n : 0;
}

function fmt(v){
    return Number(v || 0).toLocaleString("en-US");
}

/* ============================================================
   DATA HELPERS
   ============================================================ */

function validRow(r){
    /* cleanRows() converts `long` -> `lng`, so validate the
       normalized field. The previous version checked r.long here,
       which removed EVERY query row and made the map appear blank. */
    return r &&
        String(r.state ?? "").trim() !== "" &&
        Number.isFinite(Number(r.lat)) &&
        Number.isFinite(Number(r.lng)) &&
        Number.isFinite(Number(r.count));
}

function cleanRows(rows){
    return (rows || [])
        .map(r => ({
            state: String(r.state ?? "").trim(),
            lat: Number(r.lat),
            lng: Number(r.long),
            count: number(r.count),
            ticket: r.ticket ?? "",
            classification: r.classification ?? "",
            status: r.status ?? ""
        }))
        .filter(validRow);
}

/* ============================================================
   GEOJSON

   If districts.geojson exists beside this HTML, it is used for
   actual district boundaries.

   Expected properties:
      City
      Name

   If it is not available, the map automatically falls back to
   point-based geometry from the actual query coordinates.
   ============================================================ */

async function loadGeoJSON(){
    /* Load the SAME boundary files used by the original working map.
       Municipality = municipality.geojson
       Districts     = dammam.geojson / dhahran.geojson / khobar.geojson
       Query counts still come only from Grafana. */

    const files = [
        {url:"./municipality.geojson", type:"municipality"},
        {url:"./dammam.geojson", type:"Dammam"},
        {url:"./dhahran.geojson", type:"Dhahran"},
        {url:"./khobar.geojson", type:"Al Khobar"}
    ];

    municipalityFeatures = [];
    districtFeatures = [];
    districtIndex = [];
    cityIndex = [];

    const results = await Promise.all(
        files.map(async item=>{
            try{
                const r = await fetch(item.url,{cache:"no-store"});
                if(!r.ok) throw new Error(`${r.status} ${r.statusText}`);
                const json = await r.json();
                return {item,json};
            }catch(e){
                console.warn("Boundary file unavailable:",item.url,e);
                return {item,json:null};
            }
        })
    );

    results.forEach(({item,json})=>{
        if(!json || !Array.isArray(json.features)) return;

        if(item.type === "municipality"){
            municipalityFeatures.push(...json.features.filter(f=>f && f.geometry));
        }else{
            const city = item.type;
            json.features.forEach(f=>{
                if(!f || !f.geometry) return;
                f.__mapCity = city;
                districtFeatures.push(f);
            });
        }
    });

    buildGeoIndexes();
    buildBoundaryLayerControl();

    console.log("Municipality boundary features:",municipalityFeatures.length);
    console.log("District boundary features:",districtFeatures.length);
}

function boundaryCityFromProperties(p, fallback=null){
    const raw =
        p.City ?? p.city ?? p.Municipality ?? p.MunicipalityName ??
        p.Municipality_Name ?? p.MunicipalityNameEn ?? "";
    return normalizeCity(raw) || fallback;
}

function boundaryName(p){
    return String(
        p.REMARKS ?? p.Name ?? p.name ?? p.NAME ??
        p.NameEn ?? p.District ?? p.DistrictName ?? ""
    ).trim();
}

function buildBoundaryLayerControl(){
    if(window.boundaryControl){
        try{ map.removeControl(window.boundaryControl); }catch(e){}
    }

    const municipalityOverlay = L.layerGroup();
    const districtOverlay = L.layerGroup();

    municipalityFeatures.forEach(f=>{
        const p=f.properties||{};
        const city = boundaryCityFromProperties(p);
        if(!city) return;

        const layer=L.geoJSON(f,{
            style:{
                color:"#ffffff",
                weight:3,
                fillColor:cityColor(city),
                fillOpacity:0.08,
                opacity:1
            }
        });
        layer.bindTooltip(city,{sticky:true});
        municipalityOverlay.addLayer(layer);
    });

    districtFeatures.forEach(f=>{
        const city=f.__mapCity || boundaryCityFromProperties(f.properties||{});
        if(!city) return;
        const name=boundaryName(f.properties||{});
        const layer=L.geoJSON(f,{
            style:{
                color:"#ffffff",
                weight:1.5,
                fillColor:cityColor(city),
                fillOpacity:0.10,
                opacity:0.95
            }
        });
        layer.bindTooltip(`${name || "District"} (${city})`,{sticky:true});
        districtOverlay.addLayer(layer);
    });

    /* Visible by default: these are the real GIS layers. */
    municipalityOverlay.addTo(map);
    districtOverlay.addTo(map);

    window.boundaryControl = L.control.layers(
        {"Satellite":satelliteLayer,"Street":streetLayer},
        {
            "Municipality Boundaries":municipalityOverlay,
            "District Boundaries":districtOverlay
        },
        {collapsed:false,position:"topright"}
    ).addTo(map);

    window.municipalityOverlay=municipalityOverlay;
    window.districtOverlay=districtOverlay;
}

function cityColor(city){
    if(city === "Dammam") return "#ef4444";
    if(city === "Al Khobar") return "#facc15";
    if(city === "Khobar") return "#facc15";
    if(city === "Dhahran") return "#4ade80";
    return "#60a5fa";
}

function buildGeoIndexes(){
    districtIndex=[];
    cityIndex=[];

    municipalityFeatures.forEach(feature=>{
        const p=feature.properties||{};
        const city=boundaryCityFromProperties(p);
        if(city) cityIndex.push({feature,city});
    });

    districtFeatures.forEach(feature=>{
        const p=feature.properties||{};
        const name=boundaryName(p);
        const city=feature.__mapCity || boundaryCityFromProperties(p);
        if(name){
            districtIndex.push({
                feature,
                name,
                key:norm(name),
                city
            });
        }
    });
}

/* ============================================================
   POINT IN POLYGON
   ============================================================ */

function pointFeature(row){
    return turf.point([row.lng,row.lat]);
}

function findDistrictForRow(row){

    if(!districtIndex.length) return null;

    const pt = pointFeature(row);

    for(const d of districtIndex){

        try{
            if(
                turf.booleanPointInPolygon(
                    pt,
                    d.feature
                )
            ){
                return d;
            }
        }catch(e){}
    }

    /* Name match as secondary fallback */
    const exact = districtIndex.find(
        d => d.key === norm(row.state)
    );

    return exact || null;
}

/* ============================================================
   MUNICIPALITY RESOLUTION
   ============================================================ */

function resolveCity(row){

    /* 1. Exact municipality name */
    const direct = normalizeCity(row.state);
    if(direct) return direct;

    /* 2. Actual district polygon */
    const district = findDistrictForRow(row);

    if(district && district.city){
        return district.city;
    }

    /* 3. Point inside municipality feature */
    if(cityIndex.length){

        const pt = pointFeature(row);

        for(const item of cityIndex){

            try{
                if(
                    turf.booleanPointInPolygon(
                        pt,
                        item.feature
                    )
                ){
                    return item.city;
                }
            }catch(e){}
        }
    }

    /* 4. Saudi Eastern Province coordinate fallback */
    const lat = row.lat;
    const lng = row.lng;

    /*
       These are deliberately broad fallbacks only.
       Actual GeoJSON/data coordinates take priority.
    */

    if(
        lat >= 26.15 &&
        lat <= 26.55 &&
        lng >= 49.95 &&
        lng <= 50.22
    ){
        /* Dhahran is south-west of central Dammam */
        if(
            lat <= 26.34 &&
            lng <= 50.18
        ){
            return "Dhahran";
        }

        return "Dammam";
    }

    if(
        lat >= 26.15 &&
        lat <= 26.45 &&
        lng >= 50.15 &&
        lng <= 50.35
    ){
        return "Al Khobar";
    }

    return null;
}

/* ============================================================
   DATA AGGREGATION
   ============================================================ */

function groupRowsByCity(){

    const result = {
        "Dammam":[],
        "Al Khobar":[],
        "Dhahran":[]
    };

    rawRows.forEach(row => {

        const city = resolveCity(row);

        if(city && result[city]){
            result[city].push({
                ...row,
                city
            });
        }
    });

    return result;
}

function sum(rows){
    return rows.reduce(
        (a,r) => a + number(r.count),
        0
    );
}

/* ============================================================
   RISK

   High = top third
   Medium = middle third
   Low = bottom third

   This is calculated independently for the visible level.
   ============================================================ */

function riskColor(value, values){

    if(!values.length) return "#65b84a";

    const sorted = [...values].sort((a,b)=>b-a);

    /* With 3 items: highest=red, middle=yellow, lowest=green. */
    if(sorted.length <= 3){
        const rank = sorted.indexOf(value);
        if(rank === 0) return "#ef4444";
        if(rank === 1) return "#facc15";
        return "#65b84a";
    }

    const lowCut =
        sorted[Math.floor(sorted.length*0.66)];

    const highCut =
        sorted[Math.floor(sorted.length*0.33)];

    if(value >= highCut) return "#ef4444";
    if(value >= lowCut) return "#facc15";
    return "#65b84a";
}

function riskName(value, values){

    if(!values.length) return "Low";

    const sorted = [...values].sort((a,b)=>b-a);

    if(sorted.length <= 3){
        const rank = sorted.indexOf(value);
        if(rank === 0) return "High";
        if(rank === 1) return "Medium";
        return "Low";
    }

    const lowCut =
        sorted[Math.floor(sorted.length*0.66)];

    const highCut =
        sorted[Math.floor(sorted.length*0.33)];

    if(value >= highCut) return "High";
    if(value >= lowCut) return "Medium";
    return "Low";
}

/* ============================================================
   NUMBER ONLY LABEL
   ============================================================ */

function numberLabel(value, size="normal"){

    return L.marker(
        [value.lat,value.lng],
        {
            interactive:false,
            keyboard:false,
            icon:L.divIcon({
                className:
                    "number-label " +
                    (size === "large"
                        ? "number-large"
                        : size === "small"
                            ? "number-small"
                            : ""),
                html:
                    `<span class="number-text">${fmt(value.count)}</span>`,
                iconSize:null,
                iconAnchor:[0,0]
            }),
            zIndexOffset:1000
        }
    );
}

function addNumber(value,size="normal"){

    const label = numberLabel(value,size);

    label.addTo(map);

    numberLayers.push(label);

    return label;
}

/* ============================================================
   CLEAR
   ============================================================ */

function clearMap(){

    mapLayers.forEach(layer => {

        try{
            if(map.hasLayer(layer)){
                map.removeLayer(layer);
            }
        }catch(e){}
    });

    numberLayers.forEach(layer => {

        try{
            if(map.hasLayer(layer)){
                map.removeLayer(layer);
            }
        }catch(e){}
    });

    mapLayers = [];
    numberLayers = [];
}

/* ============================================================
   GEOJSON STYLE
   ============================================================ */

function polygonStyle(color, opacity=.62, weight=2.5){

    return {
        color:"#fff",
        weight,
        opacity:1,
        fillColor:color,
        fillOpacity:opacity,
        lineJoin:"round"
    };
}

/* ============================================================
   CITY GEOMETRY

   Prefer real GeoJSON. If no municipality GeoJSON exists,
   create a convex hull around the actual query coordinates.
   ============================================================ */

function cityGeometry(city,rows){

    const features =
        cityIndex
            .filter(x => x.city === city)
            .map(x => x.feature);

    if(features.length){

        try{

            const fc =
                turf.featureCollection(features);

            const dissolved =
                turf.union(fc);

            if(dissolved){
                return dissolved;
            }

        }catch(e){

            console.warn(
                "Municipality dissolve failed:",
                city,
                e
            );

            /* Use first geometry if dissolve fails */
            if(features[0]){
                return features[0];
            }
        }
    }

    /* Query-data fallback */
    const points = rows.map(r =>
        turf.point([r.lng,r.lat])
    );

    if(points.length >= 3){

        try{
            const hull = turf.convex(
                turf.featureCollection(points)
            );

            if(hull) return hull;

        }catch(e){}
    }

    if(points.length === 1){

        return turf.buffer(
            points[0],
            2,
            {units:"kilometers"}
        );
    }

    return null;
}

/* ============================================================
   LEVEL 1
   MUNICIPALITIES
   ============================================================ */

function showLevel1(){

    clearMap();

    currentLevel = 1;
    selectedCity = null;
    selectedGroup = null;

    setHeader(
        "LEVEL 1",
        "Municipalities Overview"
    );

    setInstruction(
        "ⓘ Click on any Municipality to view Groups (Level 2)"
    );

    const byCity = groupRowsByCity();

    const cityValues =
        CITIES.map(city => sum(byCity[city]));

    CITIES.forEach((city,index)=>{

        const rows = byCity[city] || [];

        if(!rows.length) return;

        const total = sum(rows);

        const color =
            riskColor(
                total,
                cityValues.filter(v=>v>0)
            );

        const geometry =
            cityGeometry(city,rows);

        let layer = null;

        if(geometry){

            layer =
                L.geoJSON(
                    geometry,
                    {
                        style:
                            polygonStyle(
                                color,
                                .58,
                                3
                            )
                    }
                ).addTo(map);

            layer.eachLayer(poly=>{

                poly.on(
                    "click",
                    ()=>{
                        showLevel2(city);
                    }
                );

                poly.bindTooltip(
                    `<b>${city}</b><br>Incidents: ${fmt(total)}`,
                    {sticky:true}
                );

                poly.bindPopup(
                    `<b>${city}</b><br>
                     Total incidents:
                     <b>${fmt(total)}</b>`
                );
            });

            mapLayers.push(layer);
        }

        /* Label position from actual geometry */
        let center = null;

        try{
            center =
                geometry
                    ? turf.centroid(geometry).geometry.coordinates
                    : null;
        }catch(e){}

        if(!center && rows.length){

            center = [
                rows.reduce((a,r)=>a+r.lat,0)/rows.length,
                rows.reduce((a,r)=>a+r.lng,0)/rows.length
            ];
        }

        if(center){

            addNumber(
                {
                    lat:center[1],
                    lng:center[0],
                    count:total
                },
                "large"
            );
        }
    });

    updateStats(
        "Municipalities",
        sum(rawRows),
        rawRows.length
    );

    fitInitial();
}

/* ============================================================
   K-MEANS

   Exactly three geographic groups are created from the real
   query coordinates inside the selected municipality.

   No fake counts are generated.
   Every group count is SUM(real query count).
   ============================================================ */

function createClusters(rows,k=3){

    if(rows.length <= k){
        return rows.map((r,i)=>({
            index:i,
            items:[r],
            count:number(r.count)
        }));
    }

    const points = rows.map(r => ({
        lat:r.lat,
        lng:r.lng
    }));

    /* Farthest-seed initialization */
    const centers = [];

    centers.push({
        lat:points[0].lat,
        lng:points[0].lng
    });

    while(centers.length < k){

        let bestPoint = null;
        let bestDistance = -1;

        points.forEach(p=>{

            let minDist = Infinity;

            centers.forEach(c=>{

                const d =
                    Math.pow(p.lat-c.lat,2) +
                    Math.pow(p.lng-c.lng,2);

                minDist =
                    Math.min(minDist,d);
            });

            if(minDist > bestDistance){

                bestDistance = minDist;
                bestPoint = p;
            }
        });

        centers.push({...bestPoint});
    }

    let assignments =
        new Array(rows.length).fill(0);

    for(let iteration=0;iteration<30;iteration++){

        let changed = false;

        rows.forEach((row,i)=>{

            let best = 0;
            let bestDist = Infinity;

            centers.forEach((c,j)=>{

                const d =
                    Math.pow(row.lat-c.lat,2) +
                    Math.pow(row.lng-c.lng,2);

                if(d < bestDist){

                    bestDist = d;
                    best = j;
                }
            });

            if(assignments[i] !== best){
                assignments[i] = best;
                changed = true;
            }
        });

        const sums =
            centers.map(()=>({
                lat:0,
                lng:0,
                n:0
            }));

        rows.forEach((row,i)=>{

            const c =
                sums[assignments[i]];

            c.lat += row.lat;
            c.lng += row.lng;
            c.n++;
        });

        centers.forEach((c,i)=>{

            if(sums[i].n){

                c.lat =
                    sums[i].lat /
                    sums[i].n;

                c.lng =
                    sums[i].lng /
                    sums[i].n;
            }
        });

        if(!changed) break;
    }

    const groups =
        centers.map((c,i)=>({
            index:i,
            items:[],
            center:c,
            count:0
        }));

    rows.forEach((row,i)=>{

        const g = groups[assignments[i]];

        g.items.push(row);
        g.count += number(row.count);
    });

    /* Remove empty groups */
    return groups.filter(g=>g.items.length);
}

/* ============================================================
   GROUP POLYGON
   ============================================================ */

function groupGeometry(group){

    const points =
        group.items.map(r =>
            turf.point([r.lng,r.lat])
        );

    if(points.length >= 3){

        try{

            const hull =
                turf.convex(
                    turf.featureCollection(points)
                );

            if(hull) return hull;

        }catch(e){}
    }

    if(points.length === 2){

        try{
            const line =
                turf.lineString(
                    points.map(p=>p.geometry.coordinates)
                );

            return turf.buffer(
                line,
                1.3,
                {units:"kilometers"}
            );
        }catch(e){}
    }

    if(points.length === 1){

        return turf.buffer(
            points[0],
            1.5,
            {units:"kilometers"}
        );
    }

    return null;
}

/* ============================================================
   LEVEL 2
   GROUPS
   ============================================================ */

function showLevel2(city){

    clearMap();

    currentLevel = 2;
    selectedCity = city;
    selectedGroup = null;

    const byCity = groupRowsByCity();
    const rows = byCity[city] || [];

    setHeader(
        "LEVEL 2",
        `Groups - ${city}`
    );

    setInstruction(
        "ⓘ Click on any Group to view Districts (Level 3)"
    );

    if(!rows.length){

        updateStats(city,0,0);

        return;
    }

    /* ------------------------------------------------------------
       REAL DISTRICT BOUNDARIES
       Draw the actual GIS district layer underneath the 3 query-data
       groups. Counts/colours still come from the Grafana query.
       ------------------------------------------------------------ */
    const cityDistrictFeatures = districtFeatures.filter(f =>
        (f.__mapCity || boundaryCityFromProperties(f.properties||{})) === city
    );

    const districtCountsForView = aggregateAllCityDistricts(rows);
    const districtValues = Object.values(districtCountsForView).map(x=>x.count);

    cityDistrictFeatures.forEach(feature=>{
        const name = boundaryName(feature.properties||{});
        const key = norm(name);
        const d = districtCountsForView[key];
        const c = d ? riskColor(d.count,districtValues) : "#94a3b8";

        const layer = L.geoJSON(feature,{
            style:{
                color:"#ffffff",
                weight:1.5,
                opacity:0.95,
                fillColor:c,
                fillOpacity:d ? 0.22 : 0.06
            }
        }).addTo(map);

        layer.eachLayer(poly=>{
            poly.bindTooltip(
                `<b>${escapeHtml(name || "District")}</b><br>Incidents: ${fmt(d ? d.count : 0)}`,
                {sticky:true}
            );
            poly.on("click",()=>{
                const matching = rows.filter(r=>{
                    const found=findDistrictForRow(r);
                    return found && norm(found.name)===key;
                });
                if(matching.length){
                    showLevel3({index:0,items:matching,count:sum(matching)},city);
                }
            });
        });
        mapLayers.push(layer);
    });

    const groups =
        createClusters(rows,3);

    const groupValues =
        groups.map(g=>g.count);

    groups.forEach(group=>{

        const geometry =
            groupGeometry(group);

        const color =
            riskColor(
                group.count,
                groupValues
            );

        if(geometry){

            const layer =
                L.geoJSON(
                    geometry,
                    {
                        style:
                            polygonStyle(
                                color,
                                .62,
                                2.5
                            )
                    }
                ).addTo(map);

            layer.eachLayer(poly=>{

                poly.on(
                    "click",
                    ()=>{
                        showLevel3(
                            group,
                            city
                        );
                    }
                );

                poly.bindTooltip(
                    `<b>Group ${group.index+1}</b><br>
                     Incidents: ${fmt(group.count)}`,
                    {sticky:true}
                );
            });

            mapLayers.push(layer);
        }

        let center =
            group.center || null;

        if(!center){

            center = {
                lat:
                    group.items.reduce(
                        (a,r)=>a+r.lat,0
                    ) / group.items.length,

                lng:
                    group.items.reduce(
                        (a,r)=>a+r.lng,0
                    ) / group.items.length
            };
        }

        /*
           NUMBER ONLY.
           No black square.
           No circle.
           No bubble.
        */
        addNumber(
            {
                lat:center.lat,
                lng:center.lng,
                count:group.count
            },
            "large"
        );
    });

    updateStats(
        `${city} Groups`,
        sum(rows),
        rows.length
    );

    fitRows(rows,70);
}

/* ============================================================
   DISTRICT AGGREGATION

   Original query rows are assigned to actual district polygons
   using their coordinates.

   If the same district has multiple query rows, counts are SUMMED.
   ============================================================ */

function aggregateAllCityDistricts(rows){
    const out={};
    rows.forEach(row=>{
        const d=findDistrictForRow(row);
        if(!d) return;
        const key=norm(d.name);
        if(!out[key]) out[key]={name:d.name,count:0};
        out[key].count += number(row.count);
    });
    return out;
}

function aggregateDistricts(groupRows){

    const mapData = new Map();

    groupRows.forEach(row=>{

        const d =
            findDistrictForRow(row);

        const districtName =
            d
                ? d.name
                : row.state;

        const key =
            norm(districtName);

        if(!key) return;

        if(!mapData.has(key)){

            mapData.set(
                key,
                {
                    name:districtName,
                    city:row.city,
                    count:0,
                    rows:[],
                    feature:d ? d.feature : null,
                    lat:row.lat,
                    lng:row.lng
                }
            );
        }

        const item =
            mapData.get(key);

        item.count += number(row.count);
        item.rows.push(row);

        item.lat =
            item.rows.reduce(
                (a,r)=>a+r.lat,0
            ) / item.rows.length;

        item.lng =
            item.rows.reduce(
                (a,r)=>a+r.lng,0
            ) / item.rows.length;
    });

    return [...mapData.values()];
}

/* ============================================================
   LEVEL 3
   DISTRICTS

   Uses actual district polygons where available.
   Otherwise creates small point polygons around the actual
   query coordinates.
   ============================================================ */

function showLevel3(group,city){

    clearMap();

    currentLevel = 3;
    selectedGroup = group;

    const rows =
        group.items || [];

    setHeader(
        "LEVEL 3",
        `Districts - ${city} / Group ${group.index+1}`
    );

    setInstruction(
        `ⓘ District incidents (Count: ${fmt(group.count)})`
    );

    const districts =
        aggregateDistricts(rows);

    const values =
        districts.map(d=>d.count);

    districts.forEach(district=>{

        const color =
            riskColor(
                district.count,
                values
            );

        let geometry =
            district.feature;

        /* Query coordinate fallback */
        if(!geometry){

            const p =
                turf.point([
                    district.lng,
                    district.lat
                ]);

            try{

                geometry =
                    turf.buffer(
                        p,
                        .8,
                        {units:"kilometers"}
                    );

            }catch(e){}
        }

        if(geometry){

            const layer =
                L.geoJSON(
                    geometry,
                    {
                        style:
                            polygonStyle(
                                color,
                                .55,
                                1.8
                            )
                    }
                ).addTo(map);

            layer.eachLayer(poly=>{

                poly.bindTooltip(
                    `<b>${escapeHtml(district.name)}</b><br>
                     Incidents: ${fmt(district.count)}`,
                    {sticky:true}
                );

                poly.bindPopup(
                    `<b>${escapeHtml(district.name)}</b><br>
                     Incidents:
                     <b>${fmt(district.count)}</b>`
                );

                poly.on(
                    "click",
                    ()=>{
                        const first =
                            district.rows[0];

                        window.parent.postMessage(
                            {
                                type:"mapClick",
                                state:district.name,
                                municipality:city,
                                lat:first?.lat ?? district.lat,
                                long:first?.lng ?? district.lng
                            },
                            "*"
                        );
                    }
                );
            });

            mapLayers.push(layer);
        }

        /*
           ONLY THE NUMBER.
           It floats over the district polygon.
        */
        addNumber(
            {
                lat:district.lat,
                lng:district.lng,
                count:district.count
            },
            "normal"
        );
    });

    updateStats(
        `${city} / Group ${group.index+1}`,
        group.count,
        rows.length
    );

    if(districts.length){

        const points =
            districts.map(d=>[
                d.lat,
                d.lng
            ]);

        try{

            map.fitBounds(
                L.latLngBounds(points),
                {
                    padding:[80,80],
                    maxZoom:16
                }
            );

        }catch(e){}
    }
}

/* ============================================================
   HEADER / STATS
   ============================================================ */

function setHeader(level,title){

    document.getElementById(
        "levelTitle"
    ).textContent = level;

    document.getElementById(
        "pageTitle"
    ).textContent = title;

    document.getElementById(
        "backBtn"
    ).style.display =
        level === "LEVEL 1"
            ? "none"
            : "block";
}

function setInstruction(text){

    document.getElementById(
        "instruction"
    ).textContent = text;
}

function updateStats(label,total,records){

    document.getElementById(
        "stats"
    ).textContent =
        `${records.toLocaleString()} query rows | Total incidents: ${fmt(total)}`;
}

/* ============================================================
   FIT
   ============================================================ */

function fitRows(rows,padding=60){

    if(!rows.length) return;

    const points =
        rows.map(r=>[
            r.lat,
            r.lng
        ]);

    try{

        map.fitBounds(
            L.latLngBounds(points),
            {
                padding:[padding,padding],
                maxZoom:14
            }
        );

    }catch(e){}
}

function fitInitial(){

    const byCity =
        groupRowsByCity();

    const all =
        CITIES.flatMap(city =>
            byCity[city] || []
        );

    if(all.length){

        fitRows(all,50);

    }else{

        map.setView(
            [26.35,50.10],
            10
        );
    }
}

/* ============================================================
   BACK
   ============================================================ */

document.getElementById(
    "backBtn"
).addEventListener(
    "click",
    function(){

        if(currentLevel === 3){

            if(selectedCity){

                showLevel2(
                    selectedCity
                );
            }

            return;
        }

        if(currentLevel === 2){

            showLevel1();
        }
    }
);

/* ============================================================
   RESET
   ============================================================ */

document.getElementById(
    "resetBtn"
).addEventListener(
    "click",
    function(){

        showLevel1();

        window.parent.postMessage(
            {
                type:"mapClick",
                state:null,
                lat:null,
                long:null
            },
            "*"
        );
    }
);

/* ============================================================
   HTML ESCAPE
   ============================================================ */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

/* ============================================================
   RECEIVE GRAFANA QUERY DATA

   IMPORTANT:
   This is compatible with the original Grafana code that sends:

      type: "incidentData"
      data: incidentData

   where incidentData contains:
      state
      lat
      long
      count
   ============================================================ */

window.addEventListener(
    "message",
    function(event){

        if(!event.data) return;

        if(
            event.data.type ===
            "incidentData"
        ){

            rawRows =
                cleanRows(
                    event.data.data || []
                );

            dataReady = true;

            console.log(
                "Incident rows received:",
                rawRows.length,
                event.data.data || []
            );

            if(!rawRows.length){
                setHeader("LEVEL 1", "Municipalities Overview");
                setInstruction("⚠ No valid query rows received. Check state / lat / long / count field names.");
                updateStats("Query", 0, 0);
            } else {
                showLevel1();
            }
        }
    }
);

/* ============================================================
   READY HANDSHAKE

   Grafana should send data after receiving this message.
   ============================================================ */

window.parent.postMessage(
    {
        type:"iframeReady"
    },
    "*"
);

/* ============================================================
   START

   Load GeoJSON first. The map still works without it because
   query coordinates are used as fallback geometry.
   ============================================================ */

(async function(){

    await loadGeoJSON();

    setHeader(
        "LEVEL 1",
        "Municipalities Overview"
    );

    setInstruction(
        "ⓘ Waiting for Grafana query data"
    );

    map.setView(
        [26.35,50.10],
        10
    );

    /*
       Send ready again after GeoJSON has loaded.
       This avoids a race condition with Grafana iframe loading.
    */
    window.parent.postMessage(
        {
            type:"iframeReady"
        },
        "*"
    );

})();

</script>
