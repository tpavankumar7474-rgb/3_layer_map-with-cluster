<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Incident Map - Dynamic</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #303050;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            width: 100%;
            height: 100vh;
            padding: 0 10px 10px;
            background: #303050;
        }

        .title {
            height: 209px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 8px;
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        #map {
            width: 100%;
            height: calc(100vh - 219px);
            min-height: 450px;
            position: relative;
            background: #d8c79c;
        }

        /* -----------------------------------
           TOP LEFT PANEL
        ----------------------------------- */

        .info-panel {
            position: absolute;
            z-index: 1000;
            top: 12px;
            left: 12px;

            width: 300px;
            min-height: 110px;

            padding: 12px 14px;

            color: white;
            background: rgba(3, 12, 17, 0.94);

            border: 1px solid rgba(255,255,255,0.30);
            border-radius: 10px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.35);
        }

        .level {
            color: #39ff14;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .stats {
            font-size: 12px;
            font-weight: bold;
            line-height: 1.4;
        }

        /* -----------------------------------
           LEGEND
        ----------------------------------- */

        .legend {
            position: absolute;
            z-index: 1000;
            right: 15px;
            bottom: 15px;

            width: 300px;

            padding: 14px;

            color: white;
            background: rgba(3, 12, 17, 0.94);

            border: 1px solid rgba(255,255,255,0.30);
            border-radius: 10px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.35);
        }

        .legend-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .legend-row {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 7px 0;
            font-size: 13px;
            font-weight: bold;
        }

        .legend-color {
            width: 25px;
            height: 20px;
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.4);
        }

        .red {
            background: #d71920;
        }

        .yellow {
            background: #d89b00;
        }

        .green {
            background: #16803c;
        }

        .pink {
            background: #ffaaaa;
        }

        .khobar {
            background: #ffe68a;
        }

        .dhahran {
            background: #9bd48a;
        }

        .legend-divider {
            border-top: 2px solid rgba(255,255,255,0.85);
            margin: 12px 0;
        }

        /* -----------------------------------
           RESET BUTTON
        ----------------------------------- */

        .reset-btn {
            position: absolute;
            z-index: 1000;
            right: 15px;
            top: 13px;

            padding: 12px 18px;

            color: white;
            background: rgba(3, 12, 17, 0.94);

            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 7px;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
        }

        .reset-btn:hover {
            background: #17252b;
        }

        /* -----------------------------------
           BOTTOM INSTRUCTION
        ----------------------------------- */

        .instruction {
            position: absolute;
            z-index: 1000;
            left: 15px;
            bottom: 15px;

            padding: 11px 16px;

            color: white;
            background: rgba(3, 12, 17, 0.94);

            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 8px;

            font-size: 13px;
        }

        /* -----------------------------------
           COUNT LABEL
           
           IMPORTANT:
           These are NOT clustered bubbles.
           They are simple labels attached to
           the polygon/location.
        ----------------------------------- */

        .count-label {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .count-label::before {
            display: none !important;
        }

        .count-number {
            min-width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 4px 7px;

            border-radius: 50%;

            color: white;

            font-size: 12px;
            font-weight: bold;

            border: 2px solid white;

            box-shadow: 0 2px 7px rgba(0,0,0,0.35);
        }

        .count-high {
            background: #d71920;
        }

        .count-medium {
            background: #d89b00;
        }

        .count-low {
            background: #16803c;
        }

        /* -----------------------------------
           POLYGON STYLING
        ----------------------------------- */

        .municipality-polygon {
            fill-opacity: 0.65;
            weight: 2.5;
            color: white;
        }

        .district-polygon {
            fill-opacity: 0.55;
            weight: 2;
            color: white;
        }

        .location-dot {
            stroke: white;
            stroke-width: 2;
        }

        /* Leaflet popup */
        .leaflet-popup-content-wrapper {
            background: #071116;
            color: white;
        }

        .leaflet-popup-tip {
            background: #071116;
        }

        .leaflet-popup-content {
            font-size: 13px;
        }

        /* -----------------------------------
           MOBILE
        ----------------------------------- */

        @media (max-width: 700px) {

            .title {
                height: 130px;
            }

            #map {
                height: calc(100vh - 140px);
            }

            .info-panel {
                width: 260px;
            }

            .legend {
                width: 245px;
                right: 10px;
                bottom: 10px;
            }

            .instruction {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="title">
        Incident Map (Dynamic)
    </div>

    <div id="map">

        <!-- Information -->
        <div class="info-panel">

            <div class="level" id="levelTitle">
                LEVEL 1
            </div>

            <div class="stats" id="stats">
                SQL data: 134 locations | Total incidents: 58,731
            </div>

        </div>

        <!-- Reset -->
        <button
            class="reset-btn"
            id="resetBtn"
        >
            ↻ Reset View
        </button>

        <!-- Legend -->
        <div class="legend">

            <div class="legend-title">
                Incidents (Count)
            </div>

            <div class="legend-row">
                <div class="legend-color red"></div>
                <span>Red — High</span>
            </div>

            <div class="legend-row">
                <div class="legend-color yellow"></div>
                <span>Yellow — Medium</span>
            </div>

            <div class="legend-row">
                <div class="legend-color green"></div>
                <span>Green — Low</span>
            </div>

            <div class="legend-divider"></div>

            <div class="legend-row">
                <div class="legend-color pink"></div>
                <span>Dammam</span>
            </div>

            <div class="legend-row">
                <div class="legend-color khobar"></div>
                <span>Khobar</span>
            </div>

            <div class="legend-row">
                <div class="legend-color dhahran"></div>
                <span>Dhahran</span>
            </div>

        </div>

        <!-- Instruction -->
        <div
            class="instruction"
            id="instruction"
        >
            ⓘ Click on any Municipality to view Districts (Level 2)
        </div>

    </div>

</div>


<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* ============================================================
   MAP INITIALIZATION
   ============================================================ */

const map = L.map("map", {
    zoomControl: true,
    preferCanvas: true
});


/* ============================================================
   BASE MAP
   ============================================================ */

L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/" +
    "World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
        attribution:
            "Tiles © Esri | OpenStreetMap contributors",
        maxZoom: 19
    }
).addTo(map);


/* ============================================================
   DATA
   ============================================================

   Replace these arrays with your actual SQL/API data.

   IMPORTANT:

   There is NO marker clustering.

   Every municipality/district/location gets its own
   polygon or marker and its own count.

   ============================================================ */


/* ------------------------------------------------------------
   LEVEL 1
   MUNICIPALITIES
   ------------------------------------------------------------ */

const municipalities = [

    {
        id: "dammam",
        name: "Dammam",
        count: 24500,

        /* polygon coordinates */
        geometry: [
            [26.55, 50.00],
            [26.65, 50.00],
            [26.68, 50.15],
            [26.55, 50.18],
            [26.55, 50.00]
        ],

        center: [26.61, 50.09]
    },

    {
        id: "khobar",
        name: "Khobar",
        count: 18000,

        geometry: [
            [26.20, 50.15],
            [26.35, 50.15],
            [26.38, 50.30],
            [26.20, 50.30],
            [26.20, 50.15]
        ],

        center: [26.29, 50.22]
    },

    {
        id: "dhahran",
        name: "Dhahran",
        count: 16231,

        geometry: [
            [26.20, 50.05],
            [26.32, 50.05],
            [26.35, 50.16],
            [26.20, 50.16],
            [26.20, 50.05]
        ],

        center: [26.27, 50.10]
    }

];


/* ------------------------------------------------------------
   LEVEL 2
   DISTRICTS

   Each district belongs to a municipality.

   The districts themselves are NOT clustered.

   Their individual counts are displayed.

   The color is based on their count.
   ------------------------------------------------------------ */

const districts = [

    /* Dammam */

    {
        id: "d1",
        municipalityId: "dammam",
        name: "District 1",
        count: 9200,
        center: [26.61, 50.06],

        geometry: [
            [26.55, 50.00],
            [26.63, 50.00],
            [26.63, 50.09],
            [26.55, 50.09],
            [26.55, 50.00]
        ]
    },

    {
        id: "d2",
        municipalityId: "dammam",
        name: "District 2",
        count: 7600,
        center: [26.61, 50.12],

        geometry: [
            [26.55, 50.09],
            [26.63, 50.09],
            [26.63, 50.18],
            [26.55, 50.18],
            [26.55, 50.09]
        ]
    },

    {
        id: "d3",
        municipalityId: "dammam",
        name: "District 3",
        count: 7700,
        center: [26.66, 50.09],

        geometry: [
            [26.63, 50.00],
            [26.68, 50.00],
            [26.68, 50.18],
            [26.63, 50.18],
            [26.63, 50.00]
        ]
    },


    /* Khobar */

    {
        id: "k1",
        municipalityId: "khobar",
        name: "Khobar District 1",
        count: 8000,
        center: [26.27, 50.18],

        geometry: [
            [26.20, 50.15],
            [26.30, 50.15],
            [26.30, 50.30],
            [26.20, 50.30],
            [26.20, 50.15]
        ]
    },

    {
        id: "k2",
        municipalityId: "khobar",
        name: "Khobar District 2",
        count: 6000,
        center: [26.35, 50.22],

        geometry: [
            [26.30, 50.15],
            [26.38, 50.15],
            [26.38, 50.30],
            [26.30, 50.30],
            [26.30, 50.15]
        ]
    },


    /* Dhahran */

    {
        id: "h1",
        municipalityId: "dhahran",
        name: "Dhahran District 1",
        count: 7000,
        center: [26.25, 50.08],

        geometry: [
            [26.20, 50.05],
            [26.28, 50.05],
            [26.28, 50.16],
            [26.20, 50.16],
            [26.20, 50.05]
        ]
    },

    {
        id: "h2",
        municipalityId: "dhahran",
        name: "Dhahran District 2",
        count: 9231,
        center: [26.31, 50.11],

        geometry: [
            [26.28, 50.05],
            [26.35, 50.05],
            [26.35, 50.16],
            [26.28, 50.16],
            [26.28, 50.05]
        ]
    }

];


/* ------------------------------------------------------------
   LEVEL 3
   INDIVIDUAL LOCATIONS
   ------------------------------------------------------------ */

const locations = [

    {
        id: 1,
        districtId: "d1",
        name: "Location A",
        count: 305,
        lat: 26.59,
        lng: 50.04
    },

    {
        id: 2,
        districtId: "d1",
        name: "Location B",
        count: 215,
        lat: 26.62,
        lng: 50.06
    },

    {
        id: 3,
        districtId: "d2",
        name: "Location C",
        count: 145,
        lat: 26.60,
        lng: 50.13
    },

    {
        id: 4,
        districtId: "d2",
        name: "Location D",
        count: 95,
        lat: 26.63,
        lng: 50.14
    },

    {
        id: 5,
        districtId: "d3",
        name: "Location E",
        count: 390,
        lat: 26.65,
        lng: 50.10
    },

    {
        id: 6,
        districtId: "k1",
        name: "Location F",
        count: 280,
        lat: 26.25,
        lng: 50.19
    },

    {
        id: 7,
        districtId: "k2",
        name: "Location G",
        count: 120,
        lat: 26.34,
        lng: 50.24
    },

    {
        id: 8,
        districtId: "h1",
        name: "Location H",
        count: 80,
        lat: 26.24,
        lng: 50.09
    },

    {
        id: 9,
        districtId: "h2",
        name: "Location I",
        count: 410,
        lat: 26.31,
        lng: 50.12
    }

];


/* ============================================================
   LAYER MANAGEMENT
   ============================================================ */

let currentLayer = 1;

let activeLayers = [];


/* ============================================================
   COLOR FUNCTIONS
   ============================================================

   IMPORTANT:

   These colors are based on COUNT.

   High   = Red
   Medium = Yellow
   Low    = Green

   ============================================================ */

function getCountColor(count, maxCount = null) {

    if (!maxCount) {

        maxCount = Math.max(
            ...locations.map(x => x.count),
            1
        );

    }

    const ratio = count / maxCount;

    if (ratio >= 0.66) {
        return "#d71920";
    }

    if (ratio >= 0.33) {
        return "#d89b00";
    }

    return "#16803c";
}


/* ============================================================
   POLYGON STYLE
   ============================================================ */

function polygonStyle(count, maxCount, className) {

    return {
        className: className,

        color: "#ffffff",

        weight: 2,

        fillColor: getCountColor(
            count,
            maxCount
        ),

        fillOpacity: 0.55
    };
}


/* ============================================================
   COUNT LABEL
   ============================================================

   This is a SIMPLE DIVICON.

   It is NOT a marker cluster.

   ============================================================ */

function createCountLabel(count) {

    const color =
        getCountColor(count);

    let cssClass = "count-low";

    if (color === "#d71920") {
        cssClass = "count-high";
    }
    else if (color === "#d89b00") {
        cssClass = "count-medium";
    }

    return L.divIcon({

        className: "count-label",

        html: `
            <div
                class="count-number ${cssClass}"
            >
                ${Number(count).toLocaleString()}
            </div>
        `,

        iconSize: [50, 42],

        iconAnchor: [25, 21]
    });
}


/* ============================================================
   CLEAR CURRENT LAYER
   ============================================================ */

function clearLayers() {

    activeLayers.forEach(layer => {

        if (map.hasLayer(layer)) {
            map.removeLayer(layer);
        }

    });

    activeLayers = [];
}


/* ============================================================
   LEVEL 1
   MUNICIPALITIES
   ============================================================ */

function showLevel1() {

    clearLayers();

    currentLayer = 1;

    document.getElementById("levelTitle")
        .innerText = "LEVEL 1";

    document.getElementById("instruction")
        .innerText =
        "ⓘ Click on any Municipality to view Districts (Level 2)";


    const maxCount = Math.max(
        ...municipalities.map(x => x.count)
    );


    municipalities.forEach(municipality => {

        /* Municipality polygon */

        const polygon = L.polygon(
            municipality.geometry,

            polygonStyle(
                municipality.count,
                maxCount,
                "municipality-polygon"
            )
        ).addTo(map);


        /* Popup */

        polygon.bindPopup(`
            <b>${municipality.name}</b><br>
            Total incidents:
            <b>${municipality.count.toLocaleString()}</b>
        `);


        /* Click municipality */

        polygon.on(
            "click",
            function () {

                showLevel2(
                    municipality.id
                );

            }
        );


        activeLayers.push(polygon);


        /* Municipality count */

        const label = L.marker(
            municipality.center,
            {
                icon: createCountLabel(
                    municipality.count
                ),

                interactive: false
            }
        ).addTo(map);


        activeLayers.push(label);

    });


    updateStats();
}


/* ============================================================
   LEVEL 2
   DISTRICTS
   ============================================================ */

function showLevel2(municipalityId) {

    clearLayers();

    currentLayer = 2;


    const municipality =
        municipalities.find(
            x => x.id === municipalityId
        );


    const municipalityDistricts =
        districts.filter(
            x =>
                x.municipalityId === municipalityId
        );


    document.getElementById("levelTitle")
        .innerText =
        "LEVEL 2 — " +
        municipality.name;


    document.getElementById("instruction")
        .innerText =
        "ⓘ Click on any District to view Locations (Level 3)";


    /* Maximum district count */

    const maxCount = Math.max(
        ...municipalityDistricts.map(
            x => x.count
        ),
        1
    );


    municipalityDistricts.forEach(district => {

        /* District polygon */

        const polygon = L.polygon(
            district.geometry,

            polygonStyle(
                district.count,
                maxCount,
                "district-polygon"
            )
        ).addTo(map);


        polygon.bindPopup(`
            <b>${district.name}</b><br>
            Incidents:
            <b>${district.count.toLocaleString()}</b>
        `);


        /* District click */

        polygon.on(
            "click",
            function () {

                showLevel3(
                    district.id
                );

            }
        );


        activeLayers.push(polygon);


        /* District count */

        const label = L.marker(
            district.center,
            {
                icon: createCountLabel(
                    district.count
                ),

                interactive: false
            }
        ).addTo(map);


        activeLayers.push(label);

    });


    /*
       Fit map to selected municipality districts.
    */

    if (municipalityDistricts.length > 0) {

        const group =
            L.featureGroup(
                activeLayers.filter(
                    x =>
                        x instanceof L.Polygon
                )
            );

        map.fitBounds(
            group.getBounds(),
            {
                padding: [40, 40]
            }
        );

    }

    updateStats();
}


/* ============================================================
   LEVEL 3
   LOCATIONS
   ============================================================ */

function showLevel3(districtId) {

    clearLayers();

    currentLayer = 3;


    const district =
        districts.find(
            x => x.id === districtId
        );


    const districtLocations =
        locations.filter(
            x => x.districtId === districtId
        );


    document.getElementById("levelTitle")
        .innerText =
        "LEVEL 3 — " +
        district.name;


    document.getElementById("instruction")
        .innerText =
        "ⓘ Location incident count";


    /*
       IMPORTANT:

       NO clustering here.

       Each location is an individual circle.
    */

    const maxCount = Math.max(
        ...districtLocations.map(
            x => x.count
        ),
        1
    );


    districtLocations.forEach(location => {

        const color =
            getCountColor(
                location.count,
                maxCount
            );


        /* Individual location */

        const circle =
            L.circleMarker(
                [
                    location.lat,
                    location.lng
                ],
                {
                    radius: 9,

                    fillColor: color,

                    color: "#ffffff",

                    weight: 2,

                    fillOpacity: 0.90
                }
            ).addTo(map);


        circle.bindPopup(`
            <b>${location.name}</b><br>
            Incidents:
            <b>${location.count.toLocaleString()}</b>
        `);


        activeLayers.push(circle);


        /*
           Individual count label.

           Again: NOT a cluster.
        */

        const label =
            L.marker(
                [
                    location.lat,
                    location.lng
                ],
                {
                    icon:
                        createCountLabel(
                            location.count
                        ),

                    interactive: false
                }
            ).addTo(map);


        activeLayers.push(label);

    });


    /*
       Zoom to locations.
    */

    if (districtLocations.length > 0) {

        const points =
            districtLocations.map(
                x => [
                    x.lat,
                    x.lng
                ]
            );

        map.fitBounds(
            L.latLngBounds(points),
            {
                padding: [60, 60]
            }
        );

    }


    updateStats();
}


/* ============================================================
   STATISTICS
   ============================================================ */

function updateStats() {

    let total = 0;

    municipalities.forEach(
        x => total += x.count
    );


    document.getElementById("stats")
        .innerText =
        "SQL data: " +
        locations.length +
        " locations | Total incidents: " +
        total.toLocaleString();
}


/* ============================================================
   RESET
   ============================================================ */

document
    .getElementById("resetBtn")
    .addEventListener(
        "click",
        function () {

            showLevel1();

            fitInitialView();

        }
    );


/* ============================================================
   INITIAL VIEW
   ============================================================ */

function fitInitialView() {

    const allPoints =
        municipalities.map(
            x => x.center
        );

    if (allPoints.length > 0) {

        map.fitBounds(
            L.latLngBounds(allPoints),
            {
                padding: [30, 30]
            }
        );

    }

}


/* ============================================================
   START
   ============================================================ */

showLevel1();

fitInitialView();


</script>

</body>
</html>
