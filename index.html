<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saudi 3-Level Municipality Incident Map</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body,#map{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#map{background:#071018}

/* ---------- Header ---------- */
.header,.panel,.info{
    position:fixed;
    z-index:10000;
    background:rgba(3,12,18,.94);
    color:#fff;
    border:1px solid rgba(255,255,255,.30);
    border-radius:9px;
    box-shadow:0 5px 20px #0008;
}

.header{
    left:12px;
    top:12px;
    padding:12px 18px;
    min-width:260px;
}

.level{
    color:#39ff14;
    font-weight:800;
    font-size:13px;
}

.title{
    font-size:20px;
    font-weight:800;
    margin-top:4px;
}

.btn{
    position:fixed;
    z-index:10001;
    top:15px;
    padding:10px 17px;
    border-radius:8px;
    border:1px solid #ffffff55;
    background:#030c12f0;
    color:#fff;
    font-size:15px;
    cursor:pointer;
}

.btn:hover{background:#1e2d37}
.reset{right:15px}
.back{right:145px;display:none}

/* ---------- Legend ---------- */
.panel{
    right:15px;
    bottom:15px;
    width:285px;
    padding:15px;
}

.legend{
    font-weight:800;
    font-size:18px;
    margin-bottom:10px;
}

.row{
    display:flex;
    gap:9px;
    align-items:center;
    margin:7px 0;
    font-size:13px;
}

.sw{
    width:24px;
    height:17px;
    border-radius:3px;
    border:1px solid #fff4;
}

.info{
    left:15px;
    bottom:15px;
    padding:11px 16px;
    font-size:14px;
}

/* ---------- NUMBER ONLY ---------- */
.number-label{
    background:transparent!important;
    border:0!important;
    box-shadow:none!important;
    color:#fff!important;
    font-size:18px;
    font-weight:900;
    text-align:center;
    white-space:nowrap;
    text-shadow:
        0 2px 4px #000,
        0 0 6px #000;
    pointer-events:none;
}

.district-number{
    background:transparent!important;
    border:0!important;
    box-shadow:none!important;
    color:#fff!important;
    font-size:15px;
    font-weight:900;
    text-align:center;
    white-space:nowrap;
    text-shadow:
        0 2px 4px #000,
        0 0 5px #000;
    pointer-events:none;
}

/* ---------- Tooltip ---------- */
.leaflet-tooltip{
    background:#000e;
    color:#fff;
    border:1px solid #fff4;
}

.leaflet-tooltip b{color:#fff}

/* ---------- Loading ---------- */
.loading{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:20000;
    color:#fff;
    background:rgba(3,12,18,.95);
    padding:18px 24px;
    border-radius:10px;
    border:1px solid #fff4;
    font-weight:700;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="header">
    <div id="level" class="level">LEVEL 1</div>
    <div id="title" class="title">Municipalities Overview</div>
</div>

<button id="back" class="btn back">← Back</button>
<button id="reset" class="btn reset">↻ Reset View</button>

<div id="info" class="info">
    ⓘ&nbsp;&nbsp; Click on any Municipality to view Groups (Level 2)
</div>

<div class="panel">
    <div class="legend">Incidents (Count)</div>

    <div class="row">
        <span class="sw" style="background:#b91c1c"></span>
        Red — High
    </div>
    <div class="row">
        <span class="sw" style="background:#ef4444"></span>
        Red — Medium
    </div>
    <div class="row">
        <span class="sw" style="background:#fca5a5"></span>
        Red — Low
    </div>

    <hr>

    <div class="row">
        <span class="sw" style="background:#ca8a04"></span>
        Yellow — High
    </div>
    <div class="row">
        <span class="sw" style="background:#facc15"></span>
        Yellow — Medium
    </div>
    <div class="row">
        <span class="sw" style="background:#fde68a"></span>
        Yellow — Low
    </div>

    <hr>

    <div class="row">
        <span class="sw" style="background:#166534"></span>
        Green — High
    </div>
    <div class="row">
        <span class="sw" style="background:#4d963e"></span>
        Green — Medium
    </div>
    <div class="row">
        <span class="sw" style="background:#a7d98c"></span>
        Green — Low
    </div>
</div>

<div id="loading" class="loading">Loading map layers...</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* ============================================================
   EXACT 3-LEVEL LOGIC FROM YOUR WORKING PYTHON
   ============================================================

   LEVEL 1:
       Municipality
       Dammam / Khobar / Dhahran

   LEVEL 2:
       3 groups created with the SAME angle/spatial grouping
       logic used by your Python.

   LEVEL 3:
       Direct districts.
       No Sub-Group / no Level 4.

   GeoJSON files are still used:
       municipality.geojson
       dammam.geojson
       khobar.geojson
       dhahran.geojson
   ============================================================ */

const CITIES = ["Dammam","Khobar","Dhahran"];

const municipalityTotals = {
    Dammam: 85420,
    Khobar: 68230,
    Dhahran: 42180
};

const CITY = {
    Dammam:{
        light:"#fca5a5",
        medium:"#ef4444",
        dark:"#b91c1c"
    },
    Khobar:{
        light:"#fde68a",
        medium:"#facc15",
        dark:"#ca8a04"
    },
    Dhahran:{
        light:"#a7d98c",
        medium:"#4d963e",
        dark:"#166534"
    }
};

const GROUP = {
    "Group 1":CITY.Dammam,
    "Group 2":CITY.Khobar,
    "Group 3":CITY.Dhahran
};

const RISK = {
    High:CITY.Dammam,
    Medium:CITY.Khobar,
    Low:CITY.Dhahran
};

const map = L.map("map",{
    preferCanvas:false,
    zoomControl:true,
    maxZoom:19
}).setView([26.38,50.10],10);

const satellite = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
        attribution:"Esri World Imagery",
        maxZoom:19
    }
).addTo(map);

const roads = L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:"OpenStreetMap contributors",
        opacity:.22,
        maxZoom:19
    }
).addTo(map);

L.control.layers(
    {
        "Satellite / Google Earth":satellite,
        "OpenStreetMap":L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution:"OpenStreetMap contributors",
                maxZoom:19
            }
        )
    },
    {
        "Roads + Labels":roads
    },
    {
        collapsed:true,
        position:"topright"
    }
).addTo(map);

let polygons = L.layerGroup().addTo(map);
let labels = L.layerGroup().addTo(map);

let municipalityLayer = L.layerGroup().addTo(map);
let districtLayer = L.layerGroup().addTo(map);

let level = 1;
let selectedCity = null;
let selectedGroup = null;

let DATA = {
    municipalities:{},
    districts:{},
    municipalityTotals
};


/* ============================================================
   HELPERS
   ============================================================ */

function fmt(x){
    return Number(x || 0).toLocaleString();
}

function num(x){
    const n = Number(x);
    return Number.isFinite(n) ? n : 0;
}

function clearVisuals(){
    polygons.clearLayers();
    labels.clearLayers();
    municipalityLayer.clearLayers();
    districtLayer.clearLayers();
}

function header(n,title){
    document.getElementById("level").textContent="LEVEL "+n;
    document.getElementById("title").textContent=title;
}

function info(text){
    document.getElementById("info").innerHTML="ⓘ&nbsp;&nbsp;"+text;
}

function showBack(v){
    document.getElementById("back").style.display =
        v ? "block" : "none";
}

function cityName(v){
    const s=String(v ?? "").trim().toLowerCase();

    if(s.includes("الدمام") || s.includes("dammam"))
        return "Dammam";

    if(s.includes("الخبر") || s.includes("khobar"))
        return "Khobar";

    if(s.includes("الظهران") || s.includes("dhahran"))
        return "Dhahran";

    return null;
}

function getDistrictName(properties,index){
    const candidates=[
        "REMARKS",
        "name",
        "NAME",
        "Name",
        "name_en",
        "NAME_EN",
        "district",
        "District",
        "DISTRICT",
        "DISTRICT_NA",
        "District_Name"
    ];

    for(const c of candidates){
        if(properties && properties[c] != null){
            const value=String(properties[c]).trim();
            if(value) return value;
        }
    }

    return "District "+(index+1);
}


/* ============================================================
   EXACT DETERMINISTIC COUNT GENERATOR FROM PYTHON
   ============================================================ */

function generateCounts(n,total){

    if(!n) return [];

    const weights=[];

    for(let i=0;i<n;i++){

        const w =
            1 +
            ((i*31)%97)/55 +
            ((i*17)%41)/80;

        weights.push(w);
    }

    const sum=weights.reduce(
        (a,b)=>a+b,
        0
    );

    const values=weights.map(
        x=>Math.floor(
            x/sum*total
        )
    );

    let remainder =
        total -
        values.reduce(
            (a,b)=>a+b,
            0
        );

    for(
        let i=0;
        i<remainder;
        i++
    ){
        values[i%n]++;
    }

    return values;
}


/* ============================================================
   SMOOTH WEATHER-STYLE GRADIENT
   ============================================================ */

function makeGradient(id,palette,intensity=0.65){

    const svg=document.querySelector(
        "#map svg.leaflet-zoom-animated"
    );

    if(!svg) return;

    let defs=svg.querySelector("defs");

    if(!defs){

        defs=document.createElementNS(
            "http://www.w3.org/2000/svg",
            "defs"
        );

        svg.insertBefore(
            defs,
            svg.firstChild
        );
    }

    const old=document.getElementById(id);

    if(old) old.remove();

    const g=document.createElementNS(
        "http://www.w3.org/2000/svg",
        "radialGradient"
    );

    g.setAttribute("id",id);
    g.setAttribute("cx","50%");
    g.setAttribute("cy","50%");
    g.setAttribute("r","82%");

    intensity=Math.max(
        0,
        Math.min(
            1,
            num(intensity)
        )
    );

    const core=Math.round(
        18+28*intensity
    );

    const s2=Math.min(
        60,
        core+13
    );

    const s3=Math.min(
        76,
        s2+10
    );

    const s4=Math.min(
        90,
        s3+10
    );

    g.innerHTML=
        `<stop offset="0%" stop-color="${palette.dark}" stop-opacity=".97"></stop>
         <stop offset="${core}%" stop-color="${palette.dark}" stop-opacity=".93"></stop>
         <stop offset="${s2}%" stop-color="${palette.medium}" stop-opacity=".89"></stop>
         <stop offset="${s3}%" stop-color="${palette.medium}" stop-opacity=".80"></stop>
         <stop offset="${s4}%" stop-color="${palette.light}" stop-opacity=".72"></stop>
         <stop offset="100%" stop-color="${palette.light}" stop-opacity=".64"></stop>`;

    defs.appendChild(g);
}


function applyGradient(layer,id){

    function paint(){

        if(!layer || !layer.eachLayer)
            return;

        layer.eachLayer(
            function(p){

                if(p && p._path){

                    p._path.style.fill=
                        `url(#${id})`;

                    p._path.style.fillOpacity="1";
                }
            }
        );
    }

    paint();

    setTimeout(paint,80);
    setTimeout(paint,250);
    setTimeout(paint,600);
}


/* ============================================================
   LEVEL 1
   ============================================================ */

function showLevel1(){

    level=1;
    selectedCity=null;
    selectedGroup=null;

    clearVisuals();

    header(
        1,
        "Municipalities Overview"
    );

    showBack(false);

    info(
        "Click on any Municipality to view Groups (Level 2)"
    );

    CITIES.forEach(
        function(city){

            const geometry =
                DATA.municipalities[city];

            if(!geometry) return;

            const total =
                municipalityTotals[city];

            const palette =
                CITY[city];

            /*
               Municipality total controls gradient strength
               across the three municipalities.
            */
            const totals=CITIES.map(
                c=>municipalityTotals[c]
            );

            const min=Math.min(...totals);
            const max=Math.max(...totals);

            const intensity =
                max===min
                    ? .65
                    : (total-min)/(max-min);

            const gradientId=
                "municipalityGradient_"+city;

            makeGradient(
                gradientId,
                palette,
                intensity
            );

            const layer=L.geoJSON(
                geometry,
                {
                    style:{
                        color:"#fff",
                        weight:3,
                        opacity:1,
                        fillColor:palette.medium,
                        fillOpacity:.82
                    },

                    onEachFeature:function(f,p){

                        p.bindTooltip(
                            `<b>Municipality:</b> ${city}
                             <br><b>Total Incidents:</b> ${fmt(total)}
                             <br><br><b>Click to divide into 3 groups</b>`,
                            {sticky:true}
                        );

                        p.on(
                            "mouseover",
                            function(){
                                p.setStyle({
                                    weight:5,
                                    fillOpacity:.92
                                });
                            }
                        );

                        p.on(
                            "mouseout",
                            function(){
                                p.setStyle({
                                    weight:3,
                                    fillOpacity:.82
                                });
                            }
                        );

                        p.on(
                            "click",
                            function(){
                                showLevel2(city);
                            }
                        );
                    }
                }
            ).addTo(polygons);

            layer.eachLayer(
                p=>municipalityLayer.addLayer(p)
            );

            applyGradient(
                layer,
                gradientId
            );

            const center=
                layer.getBounds().getCenter();

            /*
               Number only.
               No black box.
            */
            L.marker(
                center,
                {
                    interactive:false,
                    icon:L.divIcon({
                        className:"",
                        html:
                            `<div class="number-label">
                                ${fmt(total)}
                             </div>`,
                        iconSize:[120,32],
                        iconAnchor:[60,16]
                    })
                }
            ).addTo(labels);
        }
    );

    fitLayers(polygons,10);
}


/* ============================================================
   SAME GROUPING LOGIC AS YOUR WORKING PYTHON
   ============================================================ */

function groupsOf(ds){

    if(!ds.length)
        return [[],[],[]];

    const clat=
        ds.reduce(
            (s,d)=>s+d.lat,
            0
        )/ds.length;

    const clng=
        ds.reduce(
            (s,d)=>s+d.lng,
            0
        )/ds.length;

    const ordered=
        ds.slice().sort(
            function(x,y){

                return Math.atan2(
                    x.lat-clat,
                    x.lng-clng
                )
                -
                Math.atan2(
                    y.lat-clat,
                    y.lng-clng
                );
            }
        );

    const n=ordered.length;

    const b=Math.floor(n/3);
    const r=n%3;

    const sizes=[
        b+(r>0 ? 1:0),
        b+(r>1 ? 1:0),
        b
    ];

    const output=[];

    let start=0;

    for(let i=0;i<3;i++){

        output.push(
            ordered.slice(
                start,
                start+sizes[i]
            )
        );

        start+=sizes[i];
    }

    return output;
}


/* ============================================================
   LEVEL 2
   ============================================================ */

function showLevel2(city){

    level=2;
    selectedCity=city;
    selectedGroup=null;

    clearVisuals();

    header(
        2,
        "Groups - "+city
    );

    showBack(true);

    info(
        "Click on any Group to view Districts (Level 3)"
    );

    const districts=
        DATA.districts[city] || [];

    const groups=
        groupsOf(districts);

    groups.forEach(
        function(group,index){

            if(!group.length)
                return;

            const groupName=
                "Group "+(index+1);

            const palette=
                GROUP[groupName];

            const total=
                group.reduce(
                    (s,d)=>s+num(d.count),
                    0
                );

            /*
               Heat strength for the group is based on its
               aggregated incident count.
            */
            const allTotals=
                groups.map(
                    g=>g.reduce(
                        (s,d)=>s+num(d.count),
                        0
                    )
                );

            const min=Math.min(...allTotals);
            const max=Math.max(...allTotals);

            const intensity=
                max===min
                    ? .65
                    : (total-min)/(max-min);

            const gradientId=
                "groupGradient_"+
                city.replace(/\s/g,"_")+
                "_"+
                (index+1);

            makeGradient(
                gradientId,
                palette,
                intensity
            );

            /*
               IMPORTANT:
               Every district belonging to this group keeps
               its ACTUAL geometry.
               We only remove internal visual borders so the
               group looks like one geographic region.
            */
            group.forEach(
                function(d){

                    const layer=L.geoJSON(
                        d.geometry,
                        {
                            style:{
                                color:"#ffffff00",
                                weight:0,
                                opacity:0,
                                fillColor:palette.medium,
                                fillOpacity:.82
                            },

                            onEachFeature:function(f,p){

                                p.bindTooltip(
                                    `<b>${groupName}</b>
                                     <br>Incidents: ${fmt(total)}
                                     <br>District: ${d.name}
                                     <br><br><b>Click to view Districts</b>`,
                                    {sticky:true}
                                );

                                p.on(
                                    "mouseover",
                                    function(){
                                        p.setStyle({
                                            fillOpacity:.94
                                        });
                                    }
                                );

                                p.on(
                                    "mouseout",
                                    function(){
                                        p.setStyle({
                                            fillOpacity:.82
                                        });
                                    }
                                );

                                p.on(
                                    "click",
                                    function(){
                                        showLevel3(
                                            city,
                                            groupName,
                                            group
                                        );
                                    }
                                );
                            }
                        }
                    ).addTo(polygons);

                    applyGradient(
                        layer,
                        gradientId
                    );
                }
            );

            const lat=
                group.reduce(
                    (s,d)=>s+d.lat,
                    0
                )/group.length;

            const lng=
                group.reduce(
                    (s,d)=>s+d.lng,
                    0
                )/group.length;

            /*
               Group count only.
            */
            L.marker(
                [lat,lng],
                {
                    interactive:false,
                    icon:L.divIcon({
                        className:"",
                        html:
                            `<div class="number-label">
                                ${fmt(total)}
                             </div>`,
                        iconSize:[120,32],
                        iconAnchor:[60,16]
                    })
                }
            ).addTo(labels);
        }
    );

    fitLayers(polygons,13);
}


/* ============================================================
   LEVEL 3
   DIRECT DISTRICTS
   ============================================================ */

function riskStats(ds){

    const values=
        ds.map(
            d=>num(d.count)
        ).sort(
            (a,b)=>a-b
        );

    if(!values.length)
        return {
            low:0,
            high:0
        };

    return {
        low:
            values[
                Math.floor(
                    (values.length-1)*.33
                )
            ],

        high:
            values[
                Math.floor(
                    (values.length-1)*.66
                )
            ]
    };
}

function risk(count,stats){

    if(count>=stats.high)
        return "High";

    if(count>=stats.low)
        return "Medium";

    return "Low";
}


/*
   Smooth colour interpolation inside each district.
   The classification is still Red / Yellow / Green,
   but the actual fill is continuous rather than a flat block.
*/
function districtGradient(
    id,
    palette,
    q
){

    makeGradient(
        id,
        palette,
        q
    );
}


function showLevel3(
    city,
    groupName,
    group
){

    level=3;
    selectedCity=city;
    selectedGroup=groupName;

    clearVisuals();

    header(
        3,
        "Districts - "+city+" / "+groupName
    );

    showBack(true);

    const total=
        group.reduce(
            (s,d)=>s+num(d.count),
            0
        );

    info(
        "District Incidents (Count): "+
        fmt(total)
    );

    const stats=
        riskStats(group);

    group.forEach(
        function(d){

            const count=
                num(d.count);

            const riskName=
                risk(
                    count,
                    stats
                );

            const palette=
                RISK[riskName];

            let q=.65;

            if(stats.high>stats.low){

                q=
                    (
                        count-
                        stats.low
                    )/
                    (
                        stats.high-
                        stats.low
                    );

                q=Math.max(
                    .05,
                    Math.min(1,q)
                );
            }

            const gradientId=
                "districtGradient_"+
                d.id.replace(
                    /[^a-zA-Z0-9_]/g,
                    "_"
                );

            districtGradient(
                gradientId,
                palette,
                q
            );

            const layer=L.geoJSON(
                d.geometry,
                {
                    style:{
                        color:"#fff",
                        weight:1.5,
                        opacity:1,
                        fillColor:palette.medium,
                        fillOpacity:.76
                    },

                    onEachFeature:function(f,p){

                        p.bindTooltip(
                            `<b>${d.name}</b>
                             <br>Incidents: ${fmt(count)}
                             <br>Risk: ${riskName}`,
                            {sticky:true}
                        );

                        p.on(
                            "mouseover",
                            function(){
                                p.setStyle({
                                    weight:3,
                                    fillOpacity:.90
                                });
                            }
                        );

                        p.on(
                            "mouseout",
                            function(){
                                p.setStyle({
                                    weight:1.5,
                                    fillOpacity:.76
                                });
                            }
                        );

                        p.on(
                            "click",
                            function(){

                                window.parent.postMessage(
                                    {
                                        type:"mapClick",
                                        state:"district",
                                        municipality:city,
                                        group:groupName,
                                        district:d.name,
                                        count:count,
                                        lat:d.lat,
                                        long:d.lng
                                    },
                                    "*"
                                );
                            }
                        );
                    }
                }
            ).addTo(polygons);

            applyGradient(
                layer,
                gradientId
            );

            /*
               Direct district count at the actual
               representative point.
            */
            L.marker(
                [d.lat,d.lng],
                {
                    interactive:false,
                    icon:L.divIcon({
                        className:"",
                        html:
                            `<div class="district-number">
                                ${fmt(count)}
                             </div>`,
                        iconSize:[105,28],
                        iconAnchor:[52,14]
                    })
                }
            ).addTo(labels);
        }
    );

    fitLayers(polygons,14);
}


/* ============================================================
   FIT MAP
   ============================================================ */

function fitLayers(
    layerGroup,
    maxZoom
){

    const layers=
        layerGroup.getLayers();

    if(!layers.length)
        return;

    const featureGroup=
        L.featureGroup(layers);

    const bounds=
        featureGroup.getBounds();

    if(bounds.isValid()){

        map.fitBounds(
            bounds,
            {
                padding:[45,45],
                maxZoom:maxZoom
            }
        );
    }
}

/* ============================================================
   LOAD GEOJSON
   ============================================================ */

async function loadJSON(path){

    const response=
        await fetch(path);

    if(!response.ok){

        throw new Error(
            path+
            " -> HTTP "+
            response.status
        );
    }

    return response.json();
}


async function loadData(){

    try{

        const municipalityGeoJSON=
            await loadJSON(
                "./municipality.geojson"
            );

        /*
           Municipality mapping exactly follows the
           Python city_name(REMARKS) logic.
        */
        const municipalityFeatures=
            municipalityGeoJSON.features || [];

        municipalityFeatures.forEach(
            function(feature){

                const city=
                    cityName(
                        feature.properties || {}
                            .REMARKS
                    );

                if(
                    city &&
                    feature.geometry
                ){

                    if(!DATA.municipalities[city]){

                        DATA.municipalities[city]={
                            type:"FeatureCollection",
                            features:[]
                        };
                    }

                    DATA.municipalities[city]
                        .features.push(feature);
                }
            }
        );


        /*
           If REMARKS didn't map all 3 cities,
           use geometry order as the Python fallback.
        */
        const missing=
            CITIES.filter(
                c=>!DATA.municipalities[c]
            );

        if(missing.length){

            const available=
                municipalityFeatures.filter(
                    f=>f.geometry
                );

            missing.forEach(
                function(city,index){

                    const feature=
                        available[index];

                    if(feature){

                        DATA.municipalities[city]={
                            type:"FeatureCollection",
                            features:[feature]
                        };
                    }
                }
            );
        }


        for(const city of CITIES){

            const file=
                "./"+
                city.toLowerCase()+
                ".geojson";

            const geo=
                await loadJSON(file);

            const features=
                geo.features || [];

            const rows=[];

            features.forEach(
                function(feature,index){

                    if(!feature.geometry)
                        return;

                    const bounds=
                        L.geoJSON(
                            feature
                        ).getBounds();

                    if(!bounds.isValid())
                        return;

                    /*
                       Representative point approximates
                       GeoPandas representative_point().
                    */
                    const center=
                        bounds.getCenter();

                    rows.push({
                        id:
                            city+
                            "_"+
                            index,

                        name:
                            getDistrictName(
                                feature.properties || {},
                                index
                            ),

                        lat:
                            center.lat,

                        lng:
                            center.lng,

                        geometry:
                            feature.geometry
                    });
                }
            );

            /*
               SAME dummy-count distribution as Python.
            */
            const values=
                generateCounts(
                    rows.length,
                    municipalityTotals[city]
                );

            rows.forEach(
                function(row,index){
                    row.count=
                        values[index] || 0;
                }
            );

            DATA.districts[city]=rows;

            console.log(
                city+
                ": "+
                rows.length+
                " districts"
            );
        }


        document.getElementById(
            "loading"
        ).style.display="none";


        /*
           Show Level 1 immediately.
        */
        showLevel1();

        setTimeout(
            ()=>map.invalidateSize(true),
            300
        );


        console.log(
            "3-level municipality map loaded",
            DATA
        );

    }catch(error){

        console.error(
            "MAP LOAD ERROR:",
            error
        );

        document.getElementById(
            "loading"
        ).innerHTML=
            "Map data could not be loaded.<br><br>"+
            "<small>"+
            error.message+
            "<br><br>"+
            "Make sure the HTML and these files are in the same folder:<br>"+
            "municipality.geojson<br>"+
            "dammam.geojson<br>"+
            "khobar.geojson<br>"+
            "dhahran.geojson"+
            "</small>";
    }
}

loadData();

</script>
